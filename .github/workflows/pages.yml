name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject visitor map config
        env:
          JSONBIN_BIN_ID: ${{ secrets.JSONBIN_BIN_ID }}
          JSONBIN_ACCESS_KEY: ${{ secrets.JSONBIN_ACCESS_KEY }}
        run: |
          if [ -n "$JSONBIN_BIN_ID" ] && [ -n "$JSONBIN_ACCESS_KEY" ]; then
            cat > assets/js/visitor-map-config.js << EOF
          window.VISITOR_MAP_CONFIG = {
              jsonBinId: '${JSONBIN_BIN_ID}',
              jsonBinAccessKey: '${JSONBIN_ACCESS_KEY}',
          };
          EOF
            echo "Visitor map: global sync enabled"
          else
            echo "Visitor map: JSONBIN secrets not set, local-only mode"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.pages_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
