<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Static graph addresses with dynamic request content</title><desc id="desc">Persistent input, length, slot and KV buffers keep addresses stable while each request updates content and device state; append-only padding and real-last logits preserve prompt semantics.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">STATIC POINTERS; DYNAMIC CONTENT AND STATE</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">CUDA Graph identity follows addresses and DAG, not immutable request bytes</text><g font-family="Arial, sans-serif"><g transform="translate(65 165)"><rect width="1070" height="120" rx="22" fill="#111b2a" stroke="#34475c" stroke-width="3"/><text x="35" y="42" fill="#eef7ff" font-size="21" font-weight="700">PERSISTENT ADDRESSES</text><g transform="translate(300 28)" font-size="16" font-weight="700"><rect width="165" height="55" rx="13" fill="#14263b" stroke="#70e6ff"/><text x="82" y="35" fill="#70e6ff">input_ptr</text><rect x="185" width="165" height="55" rx="13" fill="#183125" stroke="#a8ff60"/><text x="267" y="35" fill="#a8ff60">length_ptr</text><rect x="370" width="165" height="55" rx="13" fill="#2c2540" stroke="#bc9cff"/><text x="452" y="35" fill="#bc9cff">slot_ptr</text><rect x="555" width="165" height="55" rx="13" fill="#34271b" stroke="#ffb15c"/><text x="637" y="35" fill="#ffb15c">kv_ptr</text></g></g><path d="M600 285V345" stroke="#b699ff" stroke-width="7"/><path d="M588 333L600 357 612 333Z" fill="#b699ff"/><g transform="translate(65 365)"><rect width="1070" height="115" rx="22" fill="#24243a" stroke="#b699ff" stroke-width="3"/><text x="35" y="42" fill="#b699ff" font-size="21" font-weight="700">PER REQUEST / STEP</text><text x="300" y="42" fill="#eef7ff" font-size="17">copy tokens</text><text x="480" y="42" fill="#eef7ff" font-size="17">update real length</text><text x="710" y="42" fill="#eef7ff" font-size="17">update slot</text><text x="890" y="42" fill="#eef7ff" font-size="17">replay graph</text><rect x="300" y="70" width="420" height="25" rx="7" fill="#a8ff60"/><rect x="720" y="70" width="270" height="25" rx="7" fill="#2b3b4f"/><text x="510" y="90" text-anchor="middle" fill="#102012" font-size="14" font-weight="700">REAL PROMPT</text><text x="855" y="90" text-anchor="middle" fill="#9aacbf" font-size="14" font-weight="700">APPEND-ONLY PADDING</text></g><path d="M600 480V535" stroke="#a8ff60" stroke-width="7"/><path d="M588 523L600 547 612 523Z" fill="#a8ff60"/><rect x="210" y="550" width="780" height="75" rx="18" fill="#183125" stroke="#a8ff60" stroke-width="3"/><text x="600" y="580" text-anchor="middle" fill="#a8ff60" font-size="21" font-weight="700">SEMANTIC OUTPUT</text><text x="600" y="608" text-anchor="middle" fill="#eef7ff" font-size="16">causal positions use real length · logits gather at real_length − 1</text></g></svg>
