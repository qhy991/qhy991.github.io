<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Route capacity, compact prefix and persistent consumer</title><desc id="desc">The router writes an expert-major compact metadata prefix and a real-work counter into a graph-stable capacity; the persistent provider consumes only the active prefix and drains the suffix.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">GRAPH-STABLE CAPACITY; DEVICE-DYNAMIC WORK</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">B32 · topK8 · 256 experts · tile8</text><g font-family="Arial, sans-serif"><rect x="65" y="165" width="1070" height="155" rx="22" fill="#111b2a" stroke="#34475c" stroke-width="3"/><text x="100" y="205" fill="#eef7ff" font-size="21" font-weight="700">CAPACITY 256</text><rect x="100" y="230" width="950" height="52" rx="13" fill="#2b3b4f"/><rect x="100" y="230" width="312" height="52" rx="13" fill="#a8ff60"/><text x="256" y="263" text-anchor="middle" fill="#102012" font-size="18" font-weight="700">COMPACT PREFIX 84</text><text x="730" y="263" text-anchor="middle" fill="#9aacbf" font-size="18" font-weight="700">UNUSED CAPACITY SUFFIX 172</text><path d="M256 320V400" stroke="#a8ff60" stroke-width="7"/><path d="M244 388L256 412 268 388Z" fill="#a8ff60"/><path d="M730 320V400" stroke="#ffad4d" stroke-width="7"/><path d="M718 388L730 412 742 388Z" fill="#ffad4d"/><rect x="80" y="415" width="410" height="150" rx="22" fill="#183125" stroke="#a8ff60" stroke-width="3"/><text x="285" y="458" text-anchor="middle" fill="#a8ff60" font-size="23" font-weight="700">ACTIVE WORK</text><text x="285" y="497" text-anchor="middle" fill="#eef7ff" font-size="18">numNonExitingCtas = 84</text><text x="285" y="530" text-anchor="middle" fill="#c9d5e5" font-size="16">expert tiles execute</text><rect x="520" y="415" width="615" height="150" rx="22" fill="#34271b" stroke="#ffad4d" stroke-width="3"/><text x="827" y="458" text-anchor="middle" fill="#ffad4d" font-size="23" font-weight="700">PERSISTENT FAST DRAIN</text><text x="827" y="497" text-anchor="middle" fill="#eef7ff" font-size="18">early exit / CLC-enabled suffix handling</text><text x="827" y="530" text-anchor="middle" fill="#c9d5e5" font-size="16">not 172 full expert tiles</text><text x="600" y="630" text-anchor="middle" fill="#bc9cff" font-size="21" font-weight="700">NOMINAL ROWS DO NOT MAP ONE-TO-ONE TO FULL-COST CTAs</text></g></svg>
