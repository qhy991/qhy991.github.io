<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Split KV softmax partition and stable combine</title><desc id="desc">A long KV sequence is partitioned across parallel workers that produce local max, normalizer, and weighted output, then combine them stably with a dynamic tail.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#70e6ff"/></marker></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/><g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">Split-KV：先改变并行分解，再讨论调度队列</text><text x="65" y="104" fill="#9aacbf" font-size="16">每个 partition 携带 local max、normalizer 与 weighted output，最后稳定合并。</text><g transform="translate(65 155)"><rect width="1070" height="82" rx="18" fill="#13283c" stroke="#70e6ff" stroke-width="3"/><text x="535" y="34" text-anchor="middle" fill="#70e6ff" font-size="18" font-weight="700">LONG KV SEQUENCE</text><g transform="translate(30 50)"><rect width="235" height="14" rx="5" fill="#70e6ff"/><rect x="255" width="235" height="14" rx="5" fill="#b8ff5b"/><rect x="510" width="235" height="14" rx="5" fill="#b699ff"/><rect x="765" width="235" height="14" rx="5" fill="#ffb15c"/></g></g><g transform="translate(80 300)" text-anchor="middle" font-size="15"><g><rect width="220" height="120" rx="17" fill="#13283c" stroke="#70e6ff" stroke-width="2"/><text x="110" y="35" fill="#70e6ff" font-weight="700">PARTITION 0</text><text x="110" y="70" fill="#eef7ff">m₀ · ℓ₀ · o₀</text><text x="110" y="97" fill="#9aacbf" font-size="13">local softmax stats</text></g><g transform="translate(270)"><rect width="220" height="120" rx="17" fill="#182d24" stroke="#b8ff5b" stroke-width="2"/><text x="110" y="35" fill="#b8ff5b" font-weight="700">PARTITION 1</text><text x="110" y="70" fill="#eef7ff">m₁ · ℓ₁ · o₁</text><text x="110" y="97" fill="#9aacbf" font-size="13">parallel worker</text></g><g transform="translate(540)"><rect width="220" height="120" rx="17" fill="#24243a" stroke="#b699ff" stroke-width="2"/><text x="110" y="35" fill="#b699ff" font-weight="700">PARTITION 2</text><text x="110" y="70" fill="#eef7ff">m₂ · ℓ₂ · o₂</text><text x="110" y="97" fill="#9aacbf" font-size="13">parallel worker</text></g><g transform="translate(810)"><rect width="220" height="120" rx="17" fill="#34271b" stroke="#ffb15c" stroke-width="2"/><text x="110" y="35" fill="#ffb15c" font-weight="700">DYNAMIC TAIL</text><text x="110" y="70" fill="#eef7ff">mₜ · ℓₜ · oₜ</text><text x="110" y="97" fill="#9aacbf" font-size="13">only valid KV lanes</text></g></g><g fill="none" stroke="#70e6ff" stroke-width="4"><path d="M190 420C190 500 480 470 520 520"/><path d="M460 420C460 480 500 485 540 520"/><path d="M730 420C730 480 620 485 580 520"/><path d="M1000 420C1000 500 660 470 600 520"/></g><rect x="440" y="520" width="320" height="82" rx="17" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="600" y="554" text-anchor="middle" fill="#b8ff5b" font-size="18" font-weight="700">STABLE COMBINE</text><text x="600" y="582" text-anchor="middle" fill="#eef7ff" font-size="14">global max · renormalize · weighted sum</text><text x="600" y="640" text-anchor="middle" fill="#9aacbf" font-size="15">大收益来自恢复 KV 维并行度；dynamic tail 只删除最后一块无效工作。</text></g></svg>
