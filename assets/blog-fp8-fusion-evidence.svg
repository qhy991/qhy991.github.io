<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Fusion frequency and end-to-end evidence</title><desc id="desc">High-frequency byte-exact fusion can penetrate end-to-end performance, while low-frequency, no-prefix PDL, and false-overlap candidates fail despite local wins.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/><g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">Local Win 只有乘上 Frequency 与 Critical Path 才有系统价值</text><text x="65" y="104" fill="#9aacbf" font-size="16">所有候选都先过 byte/state gate；性能再按 evidence level 晋级。</text><g transform="translate(65 150)" font-size="15"><g><rect width="250" height="390" rx="21" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="24" y="42" fill="#b8ff5b" font-size="18" font-weight="700">ACTIVATION QUANT</text><text x="24" y="75" fill="#d9e7f5">348 calls / step</text><text x="24" y="112" fill="#9aacbf">Local</text><text x="24" y="142" fill="#eef7ff" font-size="24" font-weight="700">12–13.6×</text><text x="24" y="184" fill="#9aacbf">TP1 E2E</text><text x="24" y="218" fill="#b8ff5b" font-size="25" font-weight="700">+21.84%</text><line x1="24" y1="250" x2="226" y2="250" stroke="#40564a"/><text x="24" y="292" fill="#d9e7f5">byte exact</text><text x="24" y="322" fill="#d9e7f5">high frequency</text><text x="24" y="352" fill="#d9e7f5">PROMOTE</text></g><g transform="translate(270)"><rect width="250" height="390" rx="21" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="24" y="42" fill="#b8ff5b" font-size="18" font-weight="700">ADD + RMSNORM</text><text x="24" y="75" fill="#d9e7f5">96 sites / step</text><text x="24" y="112" fill="#9aacbf">Local chain</text><text x="24" y="142" fill="#eef7ff" font-size="24" font-weight="700">≈ 9×</text><text x="24" y="184" fill="#9aacbf">TP1 E2E</text><text x="24" y="218" fill="#b8ff5b" font-size="25" font-weight="700">+11–13.6%</text><line x1="24" y1="250" x2="226" y2="250" stroke="#40564a"/><text x="24" y="292" fill="#d9e7f5">round/tree exact</text><text x="24" y="322" fill="#d9e7f5">high frequency</text><text x="24" y="352" fill="#d9e7f5">QUALIFY OFF</text></g><g transform="translate(540)"><rect width="250" height="390" rx="21" fill="#34271b" stroke="#ffb15c" stroke-width="3"/><text x="24" y="42" fill="#ffb15c" font-size="18" font-weight="700">D086 PRELUDE</text><text x="24" y="75" fill="#d9e7f5">1 call / step</text><text x="24" y="112" fill="#9aacbf">Local</text><text x="24" y="142" fill="#eef7ff" font-size="24" font-weight="700">−33.26%</text><text x="24" y="184" fill="#9aacbf">E2E ceiling</text><text x="24" y="218" fill="#ffb15c" font-size="25" font-weight="700">0.0226%</text><line x1="24" y1="250" x2="226" y2="250" stroke="#60492f"/><text x="24" y="292" fill="#d9e7f5">byte exact</text><text x="24" y="322" fill="#d9e7f5">frequency too low</text><text x="24" y="352" fill="#d9e7f5">STOP BEFORE E2E</text></g><g transform="translate(810)"><rect width="250" height="390" rx="21" fill="#2b2020" stroke="#ff927f" stroke-width="3"/><text x="24" y="42" fill="#ff927f" font-size="18" font-weight="700">D036 “OVERLAP”</text><text x="24" y="75" fill="#d9e7f5">route metadata scheduling</text><text x="24" y="112" fill="#9aacbf">Local boundary</text><text x="24" y="142" fill="#eef7ff" font-size="24" font-weight="700">−1.523%</text><text x="24" y="184" fill="#9aacbf">TP2 E2E</text><text x="24" y="218" fill="#ff927f" font-size="25" font-weight="700">−0.140%</text><line x1="24" y1="250" x2="226" y2="250" stroke="#604040"/><text x="24" y="292" fill="#d9e7f5">no actual overlap</text><text x="24" y="322" fill="#d9e7f5">0 / 2 pairs</text><text x="24" y="352" fill="#d9e7f5">REJECT E2E</text></g></g><text x="600" y="607" text-anchor="middle" fill="#eef7ff" font-size="20" font-weight="700">正确性决定能不能测；频次决定值不值得测；E2E 决定能不能用。</text></g></svg>
