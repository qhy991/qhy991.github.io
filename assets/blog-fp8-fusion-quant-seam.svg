<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Activation quantization boundary before and after fusion</title><desc id="desc">The original path uses multiple reduction, scale, reciprocal, cast, and transpose kernels. The fused Triton producer emits byte-exact FP8 payload and consumer-major scales in one launch.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#8fa2bd"/></marker></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/><g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">Activation Quant：性能来自边界删除，PTX 固定数值合同</text><text x="65" y="104" fill="#9aacbf" font-size="16">一个 consumer-format producer 替代约七次 launch。</text><text x="65" y="160" fill="#ff927f" font-size="20" font-weight="700">BEFORE · PYTORCH EXPRESSION</text><g transform="translate(65 190)" text-anchor="middle" font-size="14"><g><rect width="125" height="78" rx="13" fill="#13283c" stroke="#70e6ff"/><text x="62" y="46" fill="#eef7ff">BF16 input</text></g><path d="M125 39H153" stroke="#8fa2bd" stroke-width="3" marker-end="url(#a)"/><g transform="translate(165)"><rect width="125" height="78" rx="13" fill="#2b2020" stroke="#ff927f"/><text x="62" y="32" fill="#ff927f">abs / amax</text><text x="62" y="55" fill="#d9e7f5" font-size="12">reduction</text></g><path d="M290 39H318" stroke="#8fa2bd" stroke-width="3" marker-end="url(#a)"/><g transform="translate(330)"><rect width="125" height="78" rx="13" fill="#2b2020" stroke="#ff927f"/><text x="62" y="46" fill="#ff927f">scale</text></g><path d="M455 39H483" stroke="#8fa2bd" stroke-width="3" marker-end="url(#a)"/><g transform="translate(495)"><rect width="125" height="78" rx="13" fill="#2b2020" stroke="#ff927f"/><text x="62" y="46" fill="#ff927f">reciprocal</text></g><path d="M620 39H648" stroke="#8fa2bd" stroke-width="3" marker-end="url(#a)"/><g transform="translate(660)"><rect width="125" height="78" rx="13" fill="#2b2020" stroke="#ff927f"/><text x="62" y="46" fill="#ff927f">mul / clamp</text></g><path d="M785 39H813" stroke="#8fa2bd" stroke-width="3" marker-end="url(#a)"/><g transform="translate(825)"><rect width="125" height="78" rx="13" fill="#2b2020" stroke="#ff927f"/><text x="62" y="32" fill="#ff927f">FP8 cast</text><text x="62" y="55" fill="#d9e7f5" font-size="12">payload</text></g><path d="M950 39H978" stroke="#8fa2bd" stroke-width="3" marker-end="url(#a)"/><g transform="translate(990)"><rect width="125" height="78" rx="13" fill="#2b2020" stroke="#ff927f"/><text x="62" y="32" fill="#ff927f">transpose</text><text x="62" y="55" fill="#d9e7f5" font-size="12">scale layout</text></g></g><line x1="65" y1="315" x2="1135" y2="315" stroke="#34475c"/><text x="65" y="375" fill="#b8ff5b" font-size="20" font-weight="700">AFTER · ONE TRITON KERNEL</text><g transform="translate(125 410)" text-anchor="middle"><g><rect width="235" height="126" rx="18" fill="#13283c" stroke="#70e6ff" stroke-width="3"/><text x="117" y="48" fill="#70e6ff" font-size="18" font-weight="700">BF16 GROUPS</text><text x="117" y="82" fill="#d9e7f5" font-size="14">4 × group128 / CTA</text></g><path d="M235 63H330" stroke="#b8ff5b" stroke-width="6" marker-end="url(#a)"/><g transform="translate(350)"><rect width="350" height="126" rx="18" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="175" y="38" fill="#b8ff5b" font-size="18" font-weight="700">AMAX + SCALE + RCP.RN + CAST</text><text x="175" y="72" fill="#eef7ff" font-size="14">NaN / tie semantics preserved</text><text x="175" y="98" fill="#9aacbf" font-size="13">one launch · no intermediate</text></g><path d="M700 63H795" stroke="#b8ff5b" stroke-width="6" marker-end="url(#a)"/><g transform="translate(815)"><rect width="235" height="126" rx="18" fill="#24243a" stroke="#b699ff" stroke-width="3"/><text x="117" y="42" fill="#b699ff" font-size="18" font-weight="700">GEMM ABI</text><text x="117" y="74" fill="#eef7ff" font-size="14">FP8 payload</text><text x="117" y="99" fill="#d9e7f5" font-size="13">MN-major scales</text></g></g><text x="600" y="610" text-anchor="middle" fill="#eef7ff" font-size="19" font-weight="700">Inline PTX 让更快的数据流保持 byte-exact；它不是全部收益的来源。</text></g></svg>
