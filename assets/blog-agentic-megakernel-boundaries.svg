<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">MegaKernel boundary elimination around GEMMs</title><desc id="desc">Large GEMMs remain unchanged while repeated RoPE, K/V scatter, residual, and RMSNorm seams are coarsened, increasing bounded HTTP throughput by 7.116 percent.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b10"/><stop offset="1" stop-color="#111c30"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1024" height="1024" fill="url(#bg)"/><g opacity=".12" stroke="#8fa2bd"><path d="M0 170H1024M0 340H1024M0 510H1024M0 680H1024M0 850H1024"/><path d="M170 0V1024M340 0V1024M510 0V1024M680 0V1024M850 0V1024"/></g><g font-family="Inter,Arial,'PingFang SC',sans-serif" text-anchor="middle"><text x="512" y="72" fill="#eef7ff" font-size="36" font-weight="700">OPTIMIZE THE SEAMS</text><text x="512" y="108" fill="#8fa2bd" font-size="17" letter-spacing="2">MEGAKERNEL IS A DATAFLOW BOUNDARY</text><g transform="translate(80 180)" font-size="18" font-weight="700"><rect width="250" height="154" rx="22" fill="#13283c" stroke="#70e6ff" stroke-width="3"/><text x="125" y="62" fill="#70e6ff">QKV / MLP GEMM</text><text x="125" y="98" fill="#d9e7f5" font-size="15">unchanged big machine</text><g transform="translate(306)"><rect width="250" height="154" rx="22" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="125" y="52" fill="#b8ff5b">RoPE → KV</text><text x="125" y="88" fill="#eef7ff" font-size="15">in-place + one scatter</text><text x="125" y="120" fill="#9aacbf" font-size="14">delete transfer</text></g><g transform="translate(612)"><rect width="250" height="154" rx="22" fill="#34271b" stroke="#ffb15c" stroke-width="3"/><text x="125" y="52" fill="#ffb15c">Residual → Norm</text><text x="125" y="88" fill="#eef7ff" font-size="15">fused add + RMSNorm</text><text x="125" y="120" fill="#9aacbf" font-size="14">delete materialization</text></g></g><g filter="url(#g)"><path d="M205 334C205 455 430 420 470 510M511 334V510M817 334C817 455 594 420 554 510" fill="none" stroke="#70e6ff" stroke-width="6"/><rect x="350" y="510" width="324" height="150" rx="24" fill="#15263a" stroke="#b8ff5b" stroke-width="4"/><text x="512" y="565" fill="#b8ff5b" font-size="27" font-weight="700">SHORTER DATAFLOW</text><text x="512" y="607" fill="#eef7ff" font-size="18">fewer tensors · launches · HBM trips</text></g><path d="M512 660V745" stroke="#b8ff5b" stroke-width="9"/><polygon points="512,765 498,739 526,739" fill="#b8ff5b"/><rect x="190" y="770" width="644" height="120" rx="24" fill="#121b29" stroke="#b8ff5b" stroke-width="3"/><text x="340" y="818" fill="#8fa2bd" font-size="18">HTTP SERVING</text><text x="340" y="856" fill="#eef7ff" font-size="30" font-weight="700">3066.663</text><text x="512" y="842" fill="#b8ff5b" font-size="34">→</text><text x="690" y="818" fill="#8fa2bd" font-size="18">TOKENS / S</text><text x="690" y="856" fill="#b8ff5b" font-size="30" font-weight="700">3284.878</text><text x="512" y="940" fill="#ffb15c" font-size="25" font-weight="700">+7.116% · BOUNDED S4 WIN</text><text x="512" y="974" fill="#8fa2bd" font-size="15">1×B200 · Llama-3.1-8B · capacity 16</text></g></svg>
