<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Three-arm source, CUDA, and PTX comparison</title><desc id="desc">Source control, CUDA C++ counterfactual, and Direct PTX are compared on TP2 throughput and 128-step graph wall. CUDA recovers 90.2 percent of the PTX wall saving.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/><g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">三臂反事实：PTX 更快，但大部分机制 CUDA 也能表达</text><text x="65" y="104" fill="#9aacbf" font-size="16">18 次 timed replay，三臂在六种位置排列中保持 exact token hash。</text><g transform="translate(90 165)"><text x="0" y="0" fill="#9aacbf" font-size="16">TP2 throughput (token/s)</text><g transform="translate(0 35)"><text x="0" y="35" fill="#d9e7f5" font-size="16">Source control</text><rect x="170" y="12" width="780" height="32" rx="8" fill="#405064"/><text x="970" y="36" fill="#eef7ff" font-size="18" font-weight="700">3545.015</text></g><g transform="translate(0 92)"><text x="0" y="35" fill="#d9e7f5" font-size="16">CUDA C++</text><rect x="170" y="12" width="872" height="32" rx="8" fill="#70e6ff"/><text x="1060" y="36" fill="#70e6ff" font-size="18" font-weight="700">3558.984</text></g><g transform="translate(0 149)"><text x="0" y="35" fill="#d9e7f5" font-size="16">Direct PTX</text><rect x="170" y="12" width="882" height="32" rx="8" fill="#b8ff5b"/><text x="1070" y="36" fill="#b8ff5b" font-size="18" font-weight="700">3560.509</text></g></g><line x1="90" y1="385" x2="1110" y2="385" stroke="#34475c"/><g transform="translate(90 435)"><rect width="470" height="128" rx="20" fill="#13283c" stroke="#70e6ff" stroke-width="3"/><text x="28" y="43" fill="#70e6ff" font-size="20" font-weight="700">CUDA C++</text><text x="28" y="78" fill="#eef7ff" font-size="25" font-weight="700">4.535065 ms saved</text><text x="28" y="106" fill="#9aacbf" font-size="14">+0.394049% throughput</text><g transform="translate(550)"><rect width="470" height="128" rx="20" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="28" y="43" fill="#b8ff5b" font-size="20" font-weight="700">DIRECT PTX</text><text x="28" y="78" fill="#eef7ff" font-size="25" font-weight="700">5.027854 ms saved</text><text x="28" y="106" fill="#9aacbf" font-size="14">+0.437054% throughput</text></g></g><text x="600" y="625" text-anchor="middle" fill="#ffb15c" font-size="22" font-weight="700">CUDA recovers 90.20% · PTX residual = 0.492789 ms / graph</text></g></svg>
