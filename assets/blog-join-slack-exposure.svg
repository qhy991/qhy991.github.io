<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Branch slack hides local node savings before a max join</title><desc id="desc">Speeding a shorter non-critical branch does not move the join time owned by a longer branch; shared-resource interference can even lengthen the critical branch.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">THE JOIN WAITS FOR THE LAST BRANCH, NOT THE FASTEST NODE</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">Illustrative timeline</text><g font-family="Arial, sans-serif"><text x="65" y="190" fill="#c9d5e5" font-size="20">CONTROL A</text><rect x="220" y="158" width="420" height="54" rx="12" fill="#56d8ff"/><text x="430" y="192" text-anchor="middle" fill="#102012" font-size="18" font-weight="700">20 μs</text><text x="65" y="280" fill="#c9d5e5" font-size="20">CONTROL B</text><rect x="220" y="248" width="630" height="54" rx="12" fill="#ffad4d"/><text x="535" y="282" text-anchor="middle" fill="#22170d" font-size="18" font-weight="700">30 μs · CRITICAL</text><path d="M850 145V320" stroke="#ff927f" stroke-width="5"/><text x="850" y="345" text-anchor="middle" fill="#ff927f" font-size="18" font-weight="700">JOIN = 30 μs</text><text x="65" y="430" fill="#c9d5e5" font-size="20">FASTER A</text><rect x="220" y="398" width="252" height="54" rx="12" fill="#a8ff60"/><text x="346" y="432" text-anchor="middle" fill="#102012" font-size="18" font-weight="700">12 μs</text><text x="65" y="480" fill="#c9d5e5" font-size="20">B + INTERFERENCE</text><rect x="220" y="488" width="672" height="54" rx="12" fill="#ff927f"/><text x="556" y="522" text-anchor="middle" fill="#251014" font-size="18" font-weight="700">32 μs · RESOURCE CONTENTION</text><path d="M892 385V560" stroke="#ff927f" stroke-width="5"/><text x="892" y="585" text-anchor="middle" fill="#ff927f" font-size="18" font-weight="700">JOIN = 32 μs</text><path d="M472 370H850" stroke="#bc9cff" stroke-width="3" stroke-dasharray="10 8"/><text x="660" y="392" text-anchor="middle" fill="#bc9cff" font-size="16">18 μs slack after local speedup</text><text x="600" y="640" text-anchor="middle" fill="#a8ff60" font-size="21" font-weight="700">EXPOSED SAVING = MAX(0, LOCAL SAVING − SLACK) − INTERFERENCE</text></g></svg>
