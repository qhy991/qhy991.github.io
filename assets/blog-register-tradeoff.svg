<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Register tuning balances occupancy, ILP, and spill</title><desc id="desc">Too few registers can increase occupancy but cause recomputation or spill, while too many can improve ILP but cross a residency cliff.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/><g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">Register Tuning 是三角权衡，不是单调旋钮</text><text x="65" y="104" fill="#9aacbf" font-size="16">最优点随 shape、block、toolchain、loop length 与 critical share 移动。</text><g transform="translate(600 170)" text-anchor="middle"><path d="M0 0L-390 360H390Z" fill="#121b29" stroke="#b699ff" stroke-width="4"/><circle cx="0" cy="20" r="74" fill="#13283c" stroke="#70e6ff" stroke-width="3"/><text x="0" y="12" fill="#70e6ff" font-size="20" font-weight="700">ILP</text><text x="0" y="41" fill="#d9e7f5" font-size="14">more live state</text><circle cx="-330" cy="330" r="74" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="-330" y="322" fill="#b8ff5b" font-size="20" font-weight="700">OCCUPANCY</text><text x="-330" y="351" fill="#d9e7f5" font-size="14">more warps</text><circle cx="330" cy="330" r="74" fill="#34271b" stroke="#ffb15c" stroke-width="3"/><text x="330" y="322" fill="#ffb15c" font-size="20" font-weight="700">SPILL</text><text x="330" y="351" fill="#d9e7f5" font-size="14">local-memory tax</text><g transform="translate(0 235)"><circle r="55" fill="#24243a" stroke="#b699ff" stroke-width="3"/><text y="-5" fill="#eef7ff" font-size="18" font-weight="700">SHAPE</text><text y="23" fill="#9aacbf" font-size="13">optimum</text></g></g><g transform="translate(70 565)"><text x="0" y="0" fill="#9aacbf" font-size="15">RMSNorm / SiLU</text><text x="0" y="30" fill="#b8ff5b" font-size="18" font-weight="700">move toward occupancy</text><text x="740" y="0" fill="#9aacbf" font-size="15">Single decode</text><text x="740" y="30" fill="#70e6ff" font-size="18" font-weight="700">move toward ILP</text></g><text x="600" y="645" text-anchor="middle" fill="#eef7ff" font-size="18" font-weight="700">超过任一 cliff，原本的优化方向都可能瞬间反转。</text></g></svg>
