<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Merged QKV views retain the full row stride</title><desc id="desc">Q, K and V slices share one merged storage row of width 6144; each slice has a contiguous last dimension but row stride 6144, so compact-only consumers must copy.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">A ZERO-COPY VIEW CAN STILL HAVE A NON-COMPACT ROW STRIDE</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">Merged output Y[M,6144] = Q4096 + K1024 + V1024</text><g font-family="Arial, sans-serif"><text x="65" y="190" fill="#eef7ff" font-size="21" font-weight="700">MERGED STORAGE ROW</text><rect x="65" y="215" width="1070" height="90" rx="16" fill="#111b2a" stroke="#34475c" stroke-width="3"/><rect x="85" y="235" width="700" height="50" rx="11" fill="#70e6ff"/><rect x="785" y="235" width="165" height="50" rx="11" fill="#b8ff5b"/><rect x="950" y="235" width="165" height="50" rx="11" fill="#ffb15c"/><text x="435" y="267" text-anchor="middle" fill="#102012" font-size="18" font-weight="700">Q · 4096</text><text x="867" y="267" text-anchor="middle" fill="#102012" font-size="18" font-weight="700">K · 1024</text><text x="1032" y="267" text-anchor="middle" fill="#22170d" font-size="18" font-weight="700">V · 1024</text><path d="M435 305V380" stroke="#70e6ff" stroke-width="6"/><path d="M423 368L435 392 447 368Z" fill="#70e6ff"/><rect x="100" y="405" width="420" height="125" rx="20" fill="#14263b" stroke="#70e6ff" stroke-width="3"/><text x="310" y="445" text-anchor="middle" fill="#70e6ff" font-size="22" font-weight="700">Q VIEW</text><text x="310" y="482" text-anchor="middle" fill="#eef7ff" font-size="18">shape [M,4096]</text><text x="310" y="512" text-anchor="middle" fill="#ff927f" font-size="18" font-weight="700">stride [6144,1]</text><rect x="600" y="405" width="500" height="125" rx="20" fill="#361c21" stroke="#ff927f" stroke-width="3"/><text x="850" y="445" text-anchor="middle" fill="#ff927f" font-size="22" font-weight="700">COMPACT-ONLY RESHAPE</text><text x="850" y="482" text-anchor="middle" fill="#eef7ff" font-size="18">expects row stride 4096</text><text x="850" y="512" text-anchor="middle" fill="#ff927f" font-size="18" font-weight="700">materialize / copy</text><path d="M520 467H590" stroke="#ff927f" stroke-width="6"/><path d="M578 454L602 467 578 480Z" fill="#ff927f"/><rect x="185" y="580" width="830" height="55" rx="15" fill="#183125" stroke="#a8ff60" stroke-width="2"/><text x="600" y="615" text-anchor="middle" fill="#a8ff60" font-size="20" font-weight="700">LAST-DIM CONTIGUOUS ≠ FLATTENED ROWS COMPACT</text></g></svg>
