<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Named barrier ownership contract</title><desc id="desc">Independent tz warp groups can use separate named barriers, while batch-decode groups with cross-group shared-memory reads require wider synchronization.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/><g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">Named Barrier 的前提是独立 Ownership</text><text x="65" y="104" fill="#9aacbf" font-size="16">先画谁写、谁读、谁复用，再决定同步参与者。</text><g transform="translate(65 160)"><rect width="500" height="390" rx="23" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="28" y="44" fill="#b8ff5b" font-size="21" font-weight="700">SINGLE DECODE · LEGAL</text><text x="28" y="77" fill="#9aacbf" font-size="14">16 warps → 4 independent tz groups</text><g transform="translate(38 115)" text-anchor="middle" font-size="14"><g><rect width="92" height="96" rx="14" fill="#244335" stroke="#b8ff5b"/><text x="46" y="34" fill="#eef7ff">tz0</text><text x="46" y="61" fill="#9aacbf">slice 0</text><text x="46" y="82" fill="#b8ff5b">bar 1</text></g><g transform="translate(105)"><rect width="92" height="96" rx="14" fill="#244335" stroke="#b8ff5b"/><text x="46" y="34" fill="#eef7ff">tz1</text><text x="46" y="61" fill="#9aacbf">slice 1</text><text x="46" y="82" fill="#b8ff5b">bar 2</text></g><g transform="translate(210)"><rect width="92" height="96" rx="14" fill="#244335" stroke="#b8ff5b"/><text x="46" y="34" fill="#eef7ff">tz2</text><text x="46" y="61" fill="#9aacbf">slice 2</text><text x="46" y="82" fill="#b8ff5b">bar 3</text></g><g transform="translate(315)"><rect width="92" height="96" rx="14" fill="#244335" stroke="#b8ff5b"/><text x="46" y="34" fill="#eef7ff">tz3</text><text x="46" y="61" fill="#9aacbf">slice 3</text><text x="46" y="82" fill="#b8ff5b">bar 4</text></g></g><text x="38" y="265" fill="#d9e7f5" font-size="16">✓ group 内 producer / consumer 完整</text><text x="38" y="300" fill="#d9e7f5" font-size="16">✓ 循环内 slice 不跨组读取</text><text x="38" y="335" fill="#d9e7f5" font-size="16">✓ 循环外复用前仍保留 full barrier</text></g><g transform="translate(635 160)"><rect width="500" height="390" rx="23" fill="#2b2020" stroke="#ff927f" stroke-width="3"/><text x="28" y="44" fill="#ff927f" font-size="21" font-weight="700">BATCH DECODE · INVALID</text><text x="28" y="77" fill="#9aacbf" font-size="14">4 warps · bdz=1 · consumer cross-reads slots</text><g transform="translate(52 125)" text-anchor="middle"><rect width="160" height="82" rx="14" fill="#3a2929" stroke="#ff927f"/><text x="80" y="35" fill="#eef7ff" font-size="15">producer A</text><text x="80" y="61" fill="#9aacbf" font-size="13">slot 0 / 1</text><g transform="translate(235)"><rect width="160" height="82" rx="14" fill="#3a2929" stroke="#ff927f"/><text x="80" y="35" fill="#eef7ff" font-size="15">consumer B</text><text x="80" y="61" fill="#9aacbf" font-size="13">reads all slots</text></g><path d="M160 28C210 2 225 2 235 28M160 55C210 82 225 82 235 55" fill="none" stroke="#ff927f" stroke-width="4"/></g><text x="38" y="265" fill="#d9e7f5" font-size="16">✗ 没有四个独立 tz ownership domain</text><text x="38" y="300" fill="#d9e7f5" font-size="16">✗ 按 ty 分组会漏掉跨 slot 依赖</text><text x="38" y="335" fill="#d9e7f5" font-size="16">→ 静态停止，不进入 GPU timing</text></g><text x="600" y="612" text-anchor="middle" fill="#eef7ff" font-size="20" font-weight="700">同步范围由数据依赖决定，不由“想让多少 warp 独立”决定。</text></g></svg>
