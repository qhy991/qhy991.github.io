<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">Isolated node win, joined DAG loss</title><desc id="desc">A gate kernel becomes much faster in isolation but remains hidden by branch slack and the joined boundary regresses; a fusion also saves local time while losing end to end.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b10"/><stop offset="1" stop-color="#111c30"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1024" height="1024" fill="url(#bg)"/><g opacity=".12" stroke="#8fa2bd"><path d="M0 170H1024M0 340H1024M0 510H1024M0 680H1024M0 850H1024"/><path d="M170 0V1024M340 0V1024M510 0V1024M680 0V1024M850 0V1024"/></g><g font-family="Inter,Arial,'PingFang SC',sans-serif" text-anchor="middle"><text x="512" y="72" fill="#eef7ff" font-size="35" font-weight="700">ISOLATED WIN. JOINED LOSS.</text><text x="512" y="110" fill="#8fa2bd" font-size="17" letter-spacing="2">SLACK · MAX-JOIN · FUSION · PROFILER AUTHORITY</text><g transform="translate(105 180)"><rect width="814" height="190" rx="25" fill="#183125" stroke="#b8ff5b" stroke-width="3"/><text x="407" y="45" fill="#b8ff5b" font-size="23" font-weight="700">R99 GATE NODE</text><text x="160" y="100" fill="#eef7ff" font-size="18">NCU</text><path d="M225 93H520" stroke="#b8ff5b" stroke-width="9"/><path d="M508 77L538 93 508 109Z" fill="#b8ff5b"/><text x="620" y="102" fill="#b8ff5b" font-size="28" font-weight="700">−46.74%</text><text x="407" y="158" fill="#9aacbf" font-size="16">one launch replaces split-K + reduction</text></g><path d="M512 390V455" stroke="#b699ff" stroke-width="8"/><polygon points="512,475 498,449 526,449" fill="#b699ff"/><g transform="translate(105 475)"><rect width="814" height="200" rx="25" fill="#361c21" stroke="#ff927f" stroke-width="3"/><text x="407" y="45" fill="#ff927f" font-size="23" font-weight="700">REAL JOINED BOUNDARY</text><g transform="translate(45 80)" font-size="17" font-weight="700"><rect width="210" height="58" rx="14" fill="#2c2540" stroke="#b699ff"/><text x="105" y="36" fill="#b699ff">GATE · SHORTER</text><rect x="255" width="210" height="58" rx="14" fill="#34271b" stroke="#ffb15c"/><text x="360" y="36" fill="#ffb15c">ROUTED · LONGER</text><rect x="510" width="210" height="58" rx="14" fill="#361c21" stroke="#ff927f"/><text x="615" y="36" fill="#ff927f">MAX JOIN</text></g><text x="407" y="170" fill="#ff927f" font-size="22" font-weight="700">+0.2293 μs / boundary</text></g><g filter="url(#g)"><rect x="185" y="770" width="654" height="115" rx="25" fill="#24243a" stroke="#b699ff" stroke-width="4"/><text x="512" y="815" fill="#b699ff" font-size="25" font-weight="700">LOCAL SAVING ≠ EXPOSED SAVING</text><text x="512" y="854" fill="#eef7ff" font-size="17">the slowest branch owns completion</text></g><text x="512" y="953" fill="#b8ff5b" font-size="23" font-weight="700">MEASURE AFTER THE REAL JOIN</text></g></svg>
