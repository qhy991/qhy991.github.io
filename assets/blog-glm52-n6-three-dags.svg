<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Compute, communication, and control DAGs affected by N6</title>
  <desc id="desc">N6 aligns the router compute path, DeepEP communication ownership, and guarded control path before they join at TTFT.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#121d30"/></linearGradient><marker id="m1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#70e6ff"/></marker><marker id="m2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#b8ff5b"/></marker><marker id="m3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#ffb15c"/></marker></defs>
  <rect width="1200" height="675" fill="url(#bg)" rx="24"/>
  <g font-family="Inter,Arial,'PingFang SC',sans-serif">
    <text x="70" y="66" fill="#eef7ff" font-size="29" font-weight="700">N6 改变的不是一个节点，而是三张对齐的执行图</text>
    <text x="70" y="101" fill="#9aacbf" font-size="16">Data dependency 决定正确性；resource contention 决定同一条依赖链要走多久。</text>
    <g transform="translate(70 145)">
      <rect width="880" height="120" rx="18" fill="#12253a" stroke="#70e6ff" stroke-width="2"/>
      <text x="28" y="34" fill="#70e6ff" font-size="18" font-weight="700">COMPUTE DAG</text>
      <g transform="translate(190 34)" text-anchor="middle" font-size="15"><rect width="160" height="54" rx="12" fill="#1c334d"/><text x="80" y="33" fill="#eef7ff">Router / Top-K</text><path d="M160 27H218" stroke="#70e6ff" stroke-width="3" marker-end="url(#m1)"/><g transform="translate(230)"><rect width="180" height="54" rx="12" fill="#1c334d"/><text x="90" y="33" fill="#eef7ff">final physical ID</text></g><path d="M410 27H468" stroke="#70e6ff" stroke-width="3" marker-end="url(#m1)"/><g transform="translate(480)"><rect width="160" height="54" rx="12" fill="#1c334d"/><text x="80" y="33" fill="#eef7ff">expert GEMM</text></g></g>
      <text x="690" y="104" fill="#9aacbf" font-size="14">删除 remap / mask / cast materialization</text>
    </g>
    <g transform="translate(70 290)">
      <rect width="880" height="120" rx="18" fill="#182d24" stroke="#b8ff5b" stroke-width="2"/>
      <text x="28" y="34" fill="#b8ff5b" font-size="18" font-weight="700">COMMUNICATION DAG</text>
      <g transform="translate(190 34)" text-anchor="middle" font-size="15"><rect width="160" height="54" rx="12" fill="#244335"/><text x="80" y="33" fill="#eef7ff">balanced owner</text><path d="M160 27H218" stroke="#b8ff5b" stroke-width="3" marker-end="url(#m2)"/><g transform="translate(230)"><rect width="180" height="54" rx="12" fill="#244335"/><text x="90" y="33" fill="#eef7ff">DeepEP dispatch</text></g><path d="M410 27H468" stroke="#b8ff5b" stroke-width="3" marker-end="url(#m2)"/><g transform="translate(480)"><rect width="160" height="54" rx="12" fill="#244335"/><text x="80" y="33" fill="#eef7ff">combine / join</text></g></g>
      <text x="690" y="104" fill="#9aacbf" font-size="14">优化最慢 rank 与 notify tail，而非平均值</text>
    </g>
    <g transform="translate(70 435)">
      <rect width="880" height="120" rx="18" fill="#34271b" stroke="#ffb15c" stroke-width="2"/>
      <text x="28" y="34" fill="#ffb15c" font-size="18" font-weight="700">CONTROL DAG</text>
      <g transform="translate(190 34)" text-anchor="middle" font-size="15"><rect width="160" height="54" rx="12" fill="#4a3420"/><text x="80" y="33" fill="#eef7ff">strict gate</text><path d="M160 27H218" stroke="#ffb15c" stroke-width="3" marker-end="url(#m3)"/><g transform="translate(230)"><rect width="180" height="54" rx="12" fill="#4a3420"/><text x="90" y="33" fill="#eef7ff">path marker</text></g><path d="M410 27H468" stroke="#ffb15c" stroke-width="3" marker-end="url(#m3)"/><g transform="translate(480)"><rect width="160" height="54" rx="12" fill="#4a3420"/><text x="80" y="33" fill="#eef7ff">120-SM budget</text></g></g>
      <text x="690" y="104" fill="#9aacbf" font-size="14">证明 path hit，并重分配全图资源</text>
    </g>
    <g transform="translate(1000 215)" text-anchor="middle"><circle cx="65" cy="115" r="88" fill="#15263a" stroke="#eef7ff" stroke-width="3"/><text x="65" y="99" fill="#eef7ff" font-size="20" font-weight="700">FIRST TOKEN</text><text x="65" y="130" fill="#b8ff5b" font-size="28" font-weight="700">TTFT</text><text x="65" y="159" fill="#9aacbf" font-size="14">critical-path join</text></g>
    <path d="M950 205C1010 205 995 284 1005 304" fill="none" stroke="#70e6ff" stroke-width="4" marker-end="url(#m1)"/><path d="M950 350H1000" fill="none" stroke="#b8ff5b" stroke-width="4" marker-end="url(#m2)"/><path d="M950 495C1010 495 995 416 1005 396" fill="none" stroke="#ffb15c" stroke-width="4" marker-end="url(#m3)"/>
    <text x="600" y="625" text-anchor="middle" fill="#eef7ff" font-size="19" font-weight="700">关键路径 = 三张 DAG 的依赖 + 同一硬件上的资源竞争</text>
  </g>
</svg>
