<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">R92 fusion removes launches but can remove overlap</title><desc id="desc">Separate finalize, RMSNorm and quant nodes can overlap with sibling work through streams and PDL; fusing them into one owner shortens an isolated event but may extend the critical owner interval.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="31" font-weight="700">FUSION CAN DELETE NODES—AND SCHEDULING FREEDOM</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">R92 finalize + exact RMSNorm + group-FP8 quant</text><g font-family="Arial, sans-serif"><text x="65" y="185" fill="#a8ff60" font-size="22" font-weight="700">CONTROL · SEPARATE NODES</text><rect x="65" y="210" width="280" height="60" rx="13" fill="#14263b" stroke="#56d8ff" stroke-width="2"/><text x="205" y="248" text-anchor="middle" fill="#56d8ff" font-size="17" font-weight="700">TP2 FINALIZE</text><rect x="365" y="210" width="220" height="60" rx="13" fill="#2c2540" stroke="#bc9cff" stroke-width="2"/><text x="475" y="248" text-anchor="middle" fill="#bc9cff" font-size="17" font-weight="700">RMSNORM</text><rect x="605" y="210" width="240" height="60" rx="13" fill="#34271b" stroke="#ffad4d" stroke-width="2"/><text x="725" y="248" text-anchor="middle" fill="#ffad4d" font-size="17" font-weight="700">GROUP-FP8</text><rect x="285" y="300" width="660" height="50" rx="12" fill="#183125" stroke="#a8ff60" stroke-width="2"/><text x="615" y="332" text-anchor="middle" fill="#a8ff60" font-size="17" font-weight="700">SIBLING ROUTED / SHARED / COMM WORK CAN OVERLAP</text><path d="M205 270V300M475 270V300M725 270V300" stroke="#546a87" stroke-width="3" stroke-dasharray="8 6"/><text x="65" y="425" fill="#ff927f" font-size="22" font-weight="700">CANDIDATE · SINGLE OWNER</text><rect x="65" y="450" width="780" height="80" rx="16" fill="#361c21" stroke="#ff927f" stroke-width="3"/><text x="455" y="498" text-anchor="middle" fill="#ff927f" font-size="20" font-weight="700">FINALIZE + RMSNORM + QUANT · −1.327 μs LOCAL</text><rect x="865" y="450" width="270" height="80" rx="16" fill="#34271b" stroke="#ffad4d" stroke-width="3"/><text x="1000" y="483" text-anchor="middle" fill="#ffad4d" font-size="17" font-weight="700">CONSUMER WAITS</text><text x="1000" y="510" text-anchor="middle" fill="#eef7ff" font-size="15">for full owner</text><path d="M845 490H855" stroke="#ffad4d" stroke-width="7"/><path d="M845 478L865 490 845 502Z" fill="#ffad4d"/><rect x="240" y="590" width="720" height="50" rx="14" fill="#24243a" stroke="#bc9cff" stroke-width="2"/><text x="600" y="622" text-anchor="middle" fill="#bc9cff" font-size="19" font-weight="700">TP2: EXACT TOKENS · 0/2 · WALL +0.124882 ms</text></g></svg>
