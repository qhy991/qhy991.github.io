<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Vector width trades memory instructions for thread and warp parallelism</title><desc id="desc">Scalar uses 128 threads for one element each, while vector two and four use 64 and 32 threads with longer per-thread compute chains and slower operator times.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">WIDER TRANSACTIONS CAN SHRINK THE ISSUE POOL</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">D038 activation dequant → SwiGLU → group-FP8 quant</text><g font-family="Arial, sans-serif"><g transform="translate(65 165)"><rect width="330" height="380" rx="24" fill="#183125" stroke="#a8ff60" stroke-width="3"/><text x="165" y="45" text-anchor="middle" fill="#a8ff60" font-size="24" font-weight="700">SCALAR U8</text><text x="165" y="92" text-anchor="middle" fill="#eef7ff" font-size="21">128 threads</text><g fill="#a8ff60"><rect x="40" y="130" width="18" height="90" rx="7"/><rect x="70" y="130" width="18" height="90" rx="7"/><rect x="100" y="130" width="18" height="90" rx="7"/><rect x="130" y="130" width="18" height="90" rx="7"/><rect x="160" y="130" width="18" height="90" rx="7"/><rect x="190" y="130" width="18" height="90" rx="7"/><rect x="220" y="130" width="18" height="90" rx="7"/><rect x="250" y="130" width="18" height="90" rx="7"/></g><text x="165" y="260" text-anchor="middle" fill="#c9d5e5" font-size="16">1 element / thread</text><text x="165" y="310" text-anchor="middle" fill="#a8ff60" font-size="25" font-weight="700">2.5285 μs</text><text x="165" y="345" text-anchor="middle" fill="#eef7ff" font-size="16">baseline</text></g><g transform="translate(435 165)"><rect width="330" height="380" rx="24" fill="#34271b" stroke="#ffad4d" stroke-width="3"/><text x="165" y="45" text-anchor="middle" fill="#ffad4d" font-size="24" font-weight="700">VEC2 U16</text><text x="165" y="92" text-anchor="middle" fill="#eef7ff" font-size="21">64 threads</text><g fill="#ffad4d"><rect x="60" y="130" width="35" height="90" rx="7"/><rect x="115" y="130" width="35" height="90" rx="7"/><rect x="170" y="130" width="35" height="90" rx="7"/><rect x="225" y="130" width="35" height="90" rx="7"/></g><text x="165" y="260" text-anchor="middle" fill="#c9d5e5" font-size="16">2 serial chains / thread</text><text x="165" y="310" text-anchor="middle" fill="#ffad4d" font-size="25" font-weight="700">2.5616 μs</text><text x="165" y="345" text-anchor="middle" fill="#ff927f" font-size="16">+1.31% · 0/30</text></g><g transform="translate(805 165)"><rect width="330" height="380" rx="24" fill="#2c2540" stroke="#bc9cff" stroke-width="3"/><text x="165" y="45" text-anchor="middle" fill="#bc9cff" font-size="24" font-weight="700">VEC4 U32</text><text x="165" y="92" text-anchor="middle" fill="#eef7ff" font-size="21">32 threads</text><g fill="#bc9cff"><rect x="90" y="130" width="60" height="90" rx="7"/><rect x="180" y="130" width="60" height="90" rx="7"/></g><text x="165" y="260" text-anchor="middle" fill="#c9d5e5" font-size="16">4 serial chains / thread</text><text x="165" y="310" text-anchor="middle" fill="#bc9cff" font-size="25" font-weight="700">2.5772 μs</text><text x="165" y="345" text-anchor="middle" fill="#ff927f" font-size="16">+1.92% · 0/30</text></g><text x="600" y="620" text-anchor="middle" fill="#56d8ff" font-size="21" font-weight="700">VECTOR I/O SURVIVED TO SASS; COMPUTE-ISSUE PARALLELISM DID NOT</text></g></svg>
