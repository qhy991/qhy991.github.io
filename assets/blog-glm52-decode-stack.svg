<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">GLM-5.2 decode winner stack</title><desc id="desc">FlashMLA P1+c2, fixed-NK indexer and output projections, and bounded MoE M-tile alignment shorten parts of a larger decode critical path.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#8fa2bd"/></marker></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/>
  <g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">四类 Winner，只覆盖完整 Decode 图的一部分</text><text x="65" y="103" fill="#9aacbf" font-size="16">局部百分比不能相加；通信、未修改节点、同步和最慢 rank 仍在关键路径上。</text>
    <g transform="translate(65 175)" text-anchor="middle" font-size="16">
      <g><rect width="160" height="105" rx="16" fill="#121b29" stroke="#6f829a" stroke-width="2"/><text x="80" y="44" fill="#d9e7f5" font-weight="700">Router / Norm</text><text x="80" y="73" fill="#9aacbf" font-size="13">stock</text></g>
      <path d="M160 52H205" stroke="#8fa2bd" stroke-width="3" marker-end="url(#a)"/>
      <g transform="translate(215)"><rect width="160" height="105" rx="16" fill="#13283c" stroke="#70e6ff" stroke-width="3"/><text x="80" y="38" fill="#70e6ff" font-weight="700">Indexer Q</text><text x="80" y="66" fill="#d9e7f5" font-size="13">fixed N/K</text><text x="80" y="88" fill="#9aacbf" font-size="12">M16 bucket</text></g>
      <path d="M375 52H420" stroke="#8fa2bd" stroke-width="3" marker-end="url(#a)"/>
      <g transform="translate(430)"><rect width="160" height="105" rx="16" fill="#24243a" stroke="#b699ff" stroke-width="3"/><text x="80" y="38" fill="#b699ff" font-weight="700">FlashMLA</text><text x="80" y="66" fill="#d9e7f5" font-size="13">P1 + c2</text><text x="80" y="88" fill="#9aacbf" font-size="12">sparse decode</text></g>
      <path d="M590 52H635" stroke="#8fa2bd" stroke-width="3" marker-end="url(#a)"/>
      <g transform="translate(645)"><rect width="160" height="105" rx="16" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="80" y="38" fill="#b8ff5b" font-weight="700">O Projection</text><text x="80" y="66" fill="#d9e7f5" font-size="13">fixed N/K</text><text x="80" y="88" fill="#9aacbf" font-size="12">graph-only</text></g>
      <path d="M805 52H850" stroke="#8fa2bd" stroke-width="3" marker-end="url(#a)"/>
      <g transform="translate(860)"><rect width="160" height="105" rx="16" fill="#34271b" stroke="#ffb15c" stroke-width="3"/><text x="80" y="38" fill="#ffb15c" font-weight="700">MoE GEMMs</text><text x="80" y="66" fill="#d9e7f5" font-size="13">M align 16/32</text><text x="80" y="88" fill="#9aacbf" font-size="12">bounded buckets</text></g>
      <path d="M1020 52H1065" stroke="#8fa2bd" stroke-width="3" marker-end="url(#a)"/>
      <g transform="translate(1075)"><rect width="60" height="105" rx="16" fill="#121b29" stroke="#6f829a" stroke-width="2"/><text x="30" y="47" fill="#d9e7f5" font-size="13">JOIN</text><text x="30" y="72" fill="#9aacbf" font-size="12">next</text></g>
    </g>
    <g transform="translate(90 365)"><rect width="1020" height="170" rx="22" fill="#121b29" stroke="#34475c" stroke-width="2"/><text x="30" y="42" fill="#eef7ff" font-size="20" font-weight="700">仍未消失的时间</text><g transform="translate(30 70)" font-size="15" text-anchor="middle"><rect width="210" height="58" rx="12" fill="#24303f"/><text x="105" y="35" fill="#d9e7f5">DeepEP / NCCL</text><g transform="translate(230)"><rect width="210" height="58" rx="12" fill="#24303f"/><text x="105" y="35" fill="#d9e7f5">其他 projections</text></g><g transform="translate(460)"><rect width="210" height="58" rx="12" fill="#24303f"/><text x="105" y="35" fill="#d9e7f5">KV / page control</text></g><g transform="translate(690)"><rect width="240" height="58" rx="12" fill="#24303f"/><text x="120" y="35" fill="#d9e7f5">rank tail / synchronization</text></g></g></g>
    <text x="600" y="608" text-anchor="middle" fill="#b8ff5b" font-size="24" font-weight="700">局部 1.1–1.4× → 完整 ITL 1.0599×</text><text x="600" y="641" text-anchor="middle" fill="#9aacbf" font-size="15">系统只为落在关键路径上的那部分局部收益买单。</text>
  </g>
</svg>
