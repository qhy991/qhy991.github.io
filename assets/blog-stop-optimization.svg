<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">GPU optimization stop and promotion gates</title><desc id="desc">Candidates progress through applicability, build, correctness, materiality, operator, end-to-end and formal holdout gates, with explicit stop states at each level.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b10"/><stop offset="1" stop-color="#111c30"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1024" height="1024" fill="url(#bg)"/><g opacity=".12" stroke="#8fa2bd"><path d="M0 170H1024M0 340H1024M0 510H1024M0 680H1024M0 850H1024"/><path d="M170 0V1024M340 0V1024M510 0V1024M680 0V1024M850 0V1024"/></g><g font-family="Inter,Arial,'PingFang SC',sans-serif" text-anchor="middle"><text x="512" y="72" fill="#eef7ff" font-size="36" font-weight="700">KNOW WHEN TO STOP</text><text x="512" y="108" fill="#8fa2bd" font-size="17" letter-spacing="2">EVIDENCE PRUNES THE SEARCH TREE</text><g transform="translate(165 160)" font-size="15" font-weight="700"><g><rect width="694" height="65" rx="15" fill="#13283c" stroke="#70e6ff" stroke-width="2"/><text x="347" y="40" fill="#70e6ff">G0 · APPLICABILITY / PATH HIT</text></g><g transform="translate(0 82)"><rect width="694" height="65" rx="15" fill="#182d24" stroke="#b8ff5b" stroke-width="2"/><text x="347" y="40" fill="#b8ff5b">G1 · BUILD / ABI / BINARY</text></g><g transform="translate(0 164)"><rect width="694" height="65" rx="15" fill="#24243a" stroke="#b699ff" stroke-width="2"/><text x="347" y="40" fill="#b699ff">G2 · CORRECTNESS / STATE / TOKEN</text></g><g transform="translate(0 246)"><rect width="694" height="65" rx="15" fill="#34271b" stroke="#ffb15c" stroke-width="2"/><text x="347" y="40" fill="#ffb15c">G3 · NOISE / MATERIALITY / CEILING</text></g><g transform="translate(0 328)"><rect width="694" height="65" rx="15" fill="#13283c" stroke="#70e6ff" stroke-width="2"/><text x="347" y="40" fill="#70e6ff">G4 · OPERATOR / BOUNDARY</text></g><g transform="translate(0 410)"><rect width="694" height="65" rx="15" fill="#182d24" stroke="#b8ff5b" stroke-width="2"/><text x="347" y="40" fill="#b8ff5b">G5 · MODEL / GRAPH / SERVING E2E</text></g><g transform="translate(0 492)"><rect width="694" height="65" rx="15" fill="#24243a" stroke="#b699ff" stroke-width="2"/><text x="347" y="40" fill="#b699ff">G6 · FORMAL PAIRS / HOLDOUT / CAUSAL</text></g></g><g filter="url(#g)"><path d="M512 717V785" stroke="#b8ff5b" stroke-width="9"/><polygon points="512,805 498,779 526,779" fill="#b8ff5b"/><rect x="260" y="810" width="504" height="108" rx="22" fill="#182d24" stroke="#b8ff5b" stroke-width="4"/><text x="512" y="852" fill="#b8ff5b" font-size="24" font-weight="700">ACCEPTED BOUNDED</text><text x="512" y="888" fill="#eef7ff" font-size="16">exact tested cell · explicit rollback</text></g><text x="512" y="970" fill="#ffb15c" font-size="21" font-weight="700">EVERY STOP PRESERVES PROOF + REOPEN CONDITION</text></g></svg>
