<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Merged, split and forced-copy QKV micro counterfactual</title><desc id="desc">Merged QKV without a copy is slightly faster than split QKV, while adding a contiguous materialization dominates both.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">THE COPY DOMINATES THE MERGED-VS-SPLIT GEMM DIFFERENCE</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">Micro counterfactual · lower is better</text><g font-family="Arial, sans-serif"><text x="65" y="205" fill="#c9d5e5" font-size="20">Merged · no copy</text><rect x="330" y="173" width="720" height="52" rx="12" fill="#233147"/><rect x="330" y="173" width="418" height="52" rx="12" fill="#a8ff60"/><text x="768" y="207" fill="#a8ff60" font-size="20" font-weight="700">0.1615 ms</text><text x="65" y="325" fill="#c9d5e5" font-size="20">Split Q / K / V</text><rect x="330" y="293" width="720" height="52" rx="12" fill="#233147"/><rect x="330" y="293" width="434" height="52" rx="12" fill="#70e6ff"/><text x="784" y="327" fill="#70e6ff" font-size="20" font-weight="700">0.1677 ms</text><text x="65" y="445" fill="#c9d5e5" font-size="20">Merged + contiguous</text><rect x="330" y="413" width="720" height="52" rx="12" fill="#233147"/><rect x="330" y="413" width="720" height="52" rx="12" fill="#ff927f"/><text x="1070" y="447" fill="#ff927f" font-size="20" font-weight="700">0.2783 ms</text><path d="M748 520H1050" stroke="#ff927f" stroke-width="5"/><path d="M760 507L736 520 760 533Z" fill="#ff927f"/><text x="895" y="555" text-anchor="middle" fill="#ff927f" font-size="19" font-weight="700">materialization +0.1168 ms</text><rect x="180" y="590" width="840" height="50" rx="14" fill="#183125" stroke="#a8ff60" stroke-width="2"/><text x="600" y="622" text-anchor="middle" fill="#a8ff60" font-size="19" font-weight="700">FIRST REMOVE THE COPY; THEN CHOOSE ONE GEMM OR THREE</text></g></svg>
