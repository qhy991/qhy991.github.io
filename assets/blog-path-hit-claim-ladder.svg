<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Six evidence levels from implementation to serving promotion</title><desc id="desc">Implementation, standalone correctness, model admission, path identity, same-path performance and end-to-end serving promotion answer different questions and cannot be skipped.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">A SPEED CLAIM HAS SIX DIFFERENT GATES</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">Each level answers a new question; none substitutes for the next</text><g font-family="Arial, sans-serif"><g transform="translate(85 520)"><rect width="165" height="72" rx="15" fill="#14263b" stroke="#56d8ff" stroke-width="2"/><text x="20" y="30" fill="#56d8ff" font-size="18" font-weight="700">L0 · EXISTS</text><text x="20" y="54" fill="#f5f7fb" font-size="14">ABI · symbol</text></g><g transform="translate(250 440)"><rect width="165" height="152" rx="15" fill="#183125" stroke="#a8ff60" stroke-width="2"/><text x="20" y="32" fill="#a8ff60" font-size="18" font-weight="700">L1 · ORACLE</text><text x="20" y="58" fill="#f5f7fb" font-size="14">shape · state</text><text x="20" y="82" fill="#f5f7fb" font-size="14">fallback</text></g><g transform="translate(415 360)"><rect width="165" height="232" rx="15" fill="#2c2540" stroke="#bc9cff" stroke-width="2"/><text x="20" y="32" fill="#bc9cff" font-size="18" font-weight="700">L2 · MODEL</text><text x="20" y="58" fill="#f5f7fb" font-size="14">token · state</text><text x="20" y="82" fill="#f5f7fb" font-size="14">negative control</text></g><g transform="translate(580 280)"><rect width="165" height="312" rx="15" fill="#3b291a" stroke="#ffad4d" stroke-width="2"/><text x="20" y="32" fill="#ffad4d" font-size="18" font-weight="700">L3 · PATH</text><text x="20" y="58" fill="#f5f7fb" font-size="14">dispatch count</text><text x="20" y="82" fill="#f5f7fb" font-size="14">phase · graph</text></g><g transform="translate(745 200)"><rect width="165" height="392" rx="15" fill="#14263b" stroke="#56d8ff" stroke-width="2"/><text x="20" y="32" fill="#56d8ff" font-size="18" font-weight="700">L4 · TIMING</text><text x="20" y="58" fill="#f5f7fb" font-size="14">same path</text><text x="20" y="82" fill="#f5f7fb" font-size="14">paired raw</text></g><g transform="translate(910 120)"><rect width="205" height="472" rx="15" fill="#183125" stroke="#a8ff60" stroke-width="3"/><text x="20" y="34" fill="#a8ff60" font-size="18" font-weight="700">L5 · PROMOTE</text><text x="20" y="62" fill="#f5f7fb" font-size="14">E2E / serving</text><text x="20" y="86" fill="#f5f7fb" font-size="14">formal · holdout</text><text x="20" y="110" fill="#f5f7fb" font-size="14">rollback boundary</text></g><path d="M85 615H1115" stroke="#546a87" stroke-width="3"/><text x="600" y="650" text-anchor="middle" fill="#9fb1c8" font-size="17">“Correct native library” is not shorthand for “deployment-wide win”</text></g></svg>
