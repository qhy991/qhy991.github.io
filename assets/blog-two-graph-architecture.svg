<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Two phase-specific CUDA graphs and a fail-closed fallback</title><desc id="desc">A dispatcher sends singleton prompts in the T64 envelope to Graph A, B16 K256 decode steps to Graph B, and all contract misses to the previous generic path.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">PHASE-SPECIFIC LEAVES, NOT ONE UNIVERSAL GRAPH</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">Qwen3-4B BF16 · one B200 · capacity 16</text><g font-family="Arial, sans-serif"><rect x="65" y="165" width="260" height="100" rx="20" fill="#24243a" stroke="#bc9cff" stroke-width="3"/><text x="195" y="205" text-anchor="middle" fill="#bc9cff" font-size="22" font-weight="700">DISPATCHER</text><text x="195" y="238" text-anchor="middle" fill="#eef7ff" font-size="16">phase + shape + slot</text><path d="M325 215H445" stroke="#a8ff60" stroke-width="6"/><path d="M433 202L457 215 433 228Z" fill="#a8ff60"/><path d="M325 215C385 215 390 420 445 420" fill="none" stroke="#70e6ff" stroke-width="6"/><path d="M433 407L457 420 433 433Z" fill="#70e6ff"/><g transform="translate(460 145)"><rect width="675" height="175" rx="22" fill="#183125" stroke="#a8ff60" stroke-width="3"/><text x="35" y="43" fill="#a8ff60" font-size="23" font-weight="700">GRAPH A · ADMIT / PREFILL</text><text x="35" y="82" fill="#eef7ff" font-size="18">B1 · prompt 1–62 · T64 envelope</text><text x="35" y="115" fill="#c9d5e5" font-size="16">fixed addresses · real length · slot id · append padding</text><text x="35" y="145" fill="#c9d5e5" font-size="16">persistent KV write · gather real-last logits</text></g><g transform="translate(460 350)"><rect width="675" height="175" rx="22" fill="#14263b" stroke="#70e6ff" stroke-width="3"/><text x="35" y="43" fill="#70e6ff" font-size="23" font-weight="700">GRAPH B · DECODE</text><text x="35" y="82" fill="#eef7ff" font-size="18">B16 · live-context K256 leaf</text><text x="35" y="115" fill="#c9d5e5" font-size="16">device lengths / slots · persistent KV · one-token step</text><text x="35" y="145" fill="#c9d5e5" font-size="16">other K buckets or full-max fallback when needed</text></g><path d="M195 265V560" stroke="#ffb15c" stroke-width="5" stroke-dasharray="9 7"/><path d="M183 548L195 572 207 548Z" fill="#ffb15c"/><rect x="65" y="575" width="1070" height="60" rx="15" fill="#34271b" stroke="#ffb15c" stroke-width="2"/><text x="600" y="613" text-anchor="middle" fill="#ffb15c" font-size="20" font-weight="700">ANY CONTRACT MISS → PREVIOUS GENERIC EAGER / OTHER-BUCKET PATH</text></g></svg>
