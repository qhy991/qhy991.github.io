<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Batched all-role and B1 down-only FP8 evidence</title><desc id="desc">Block-scaled DeepGEMM wins for large-M batched prefill and for B1 down-only, while B1 all-role fails the model correctness gate.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">PERFORMANCE AND CORRECTNESS JOINTLY DEFINE THE SCOPE</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">Historical Qwen3-4B FP8 prefill evidence</text><g font-family="Arial, sans-serif"><g transform="translate(65 165)"><rect width="500" height="350" rx="24" fill="#183125" stroke="#a8ff60" stroke-width="3"/><text x="250" y="45" text-anchor="middle" fill="#a8ff60" font-size="24" font-weight="700">BATCHED · ALL PROJECTIONS</text><text x="55" y="105" fill="#eef7ff" font-size="18">B16×T512</text><text x="445" y="105" text-anchor="end" fill="#a8ff60" font-size="20" font-weight="700">38.939 → 33.680 ms</text><text x="55" y="160" fill="#eef7ff" font-size="18">B16×T128</text><text x="445" y="160" text-anchor="end" fill="#a8ff60" font-size="20" font-weight="700">10.587 → 9.753 ms</text><text x="250" y="230" text-anchor="middle" fill="#a8ff60" font-size="27" font-weight="700">−13.5% / −7.9%</text><text x="250" y="275" text-anchor="middle" fill="#eef7ff" font-size="17">stage-4 502/512</text><text x="250" y="310" text-anchor="middle" fill="#c9d5e5" font-size="15">qualified batched scope</text></g><g transform="translate(635 165)"><rect width="500" height="350" rx="24" fill="#14263b" stroke="#70e6ff" stroke-width="3"/><text x="250" y="45" text-anchor="middle" fill="#70e6ff" font-size="24" font-weight="700">B1 · DOWN ONLY</text><text x="55" y="105" fill="#eef7ff" font-size="18">PP@4K</text><text x="445" y="105" text-anchor="end" fill="#a8ff60" font-size="20" font-weight="700">26.194 → 23.672 ms</text><text x="55" y="160" fill="#eef7ff" font-size="18">PP@8K</text><text x="445" y="160" text-anchor="end" fill="#a8ff60" font-size="20" font-weight="700">58.076 → 52.953 ms</text><text x="250" y="230" text-anchor="middle" fill="#a8ff60" font-size="27" font-weight="700">−9.63% / −8.82%</text><text x="250" y="275" text-anchor="middle" fill="#eef7ff" font-size="17">stage-1 126/128 · parity 512/512</text><text x="250" y="310" text-anchor="middle" fill="#c9d5e5" font-size="15">role-scoped WIN</text></g><rect x="185" y="570" width="830" height="65" rx="16" fill="#361c21" stroke="#ff927f" stroke-width="3"/><text x="600" y="598" text-anchor="middle" fill="#ff927f" font-size="19" font-weight="700">B1 ALL-ROLE: 124/128</text><text x="600" y="622" text-anchor="middle" fill="#eef7ff" font-size="15">correctness rejects scope expansion even if individual kernels look attractive</text></g></svg>
