<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Numerical seams in FP8 and BF16 fusion</title><desc id="desc">Reciprocal rounding can change discrete FP8 codes, BF16 materialization fixes the add rounding point, and reduction order changes RMSNorm output.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/><g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">三个不能被 Fusion 悄悄跨越的数值 Seam</text><text x="65" y="104" fill="#9aacbf" font-size="16">公式相同不等于 byte、state 和 token 相同。</text><g transform="translate(65 160)"><g><rect width="330" height="370" rx="22" fill="#13283c" stroke="#70e6ff" stroke-width="3"/><text x="25" y="43" fill="#70e6ff" font-size="20" font-weight="700">1 · RECIPROCAL ROUNDING</text><text x="25" y="83" fill="#d9e7f5" font-size="15">scale reciprocal 的末位</text><text x="25" y="112" fill="#d9e7f5" font-size="15">决定 E4M3 tie 落在哪一侧</text><g transform="translate(38 158)" text-anchor="middle"><rect width="95" height="72" rx="12" fill="#24303f"/><text x="47" y="32" fill="#eef7ff" font-size="14">0x4A</text><text x="47" y="55" fill="#9aacbf" font-size="12">left code</text><text x="145" y="46" fill="#ffb15c" font-size="28">|</text><g transform="translate(190)"><rect width="95" height="72" rx="12" fill="#24303f"/><text x="47" y="32" fill="#eef7ff" font-size="14">0x4B</text><text x="47" y="55" fill="#9aacbf" font-size="12">right code</text></g></g><text x="25" y="280" fill="#b8ff5b" font-size="16" font-weight="700">rcp.rn.f32</text><text x="25" y="312" fill="#9aacbf" font-size="14">固定精确舍入合同</text></g><g transform="translate(370)"><rect width="330" height="370" rx="22" fill="#24243a" stroke="#b699ff" stroke-width="3"/><text x="25" y="43" fill="#b699ff" font-size="20" font-weight="700">2 · BF16 MATERIALIZATION</text><text x="25" y="83" fill="#d9e7f5" font-size="15">residual + delta 必须先</text><text x="25" y="112" fill="#d9e7f5" font-size="15">round BF16，再进入 norm</text><rect x="45" y="160" width="240" height="62" rx="12" fill="#343450"/><text x="165" y="198" text-anchor="middle" fill="#eef7ff" font-size="15">FP32 add</text><path d="M165 222V258" stroke="#b699ff" stroke-width="5"/><polygon points="165,275 154,254 176,254" fill="#b699ff"/><rect x="45" y="277" width="240" height="54" rx="12" fill="#343450"/><text x="165" y="310" text-anchor="middle" fill="#eef7ff" font-size="15">BF16 RNE state</text></g><g transform="translate(740)"><rect width="330" height="370" rx="22" fill="#34271b" stroke="#ffb15c" stroke-width="3"/><text x="25" y="43" fill="#ffb15c" font-size="20" font-weight="700">3 · REDUCTION TREE</text><text x="25" y="83" fill="#d9e7f5" font-size="15">相同 sum of squares</text><text x="25" y="112" fill="#d9e7f5" font-size="15">不同 grouping → 不同末位</text><g transform="translate(45 155)" text-anchor="middle" fill="#eef7ff" font-size="14"><circle cx="30" cy="20" r="20" fill="#4a3420"/><text x="30" y="25">a</text><circle cx="100" cy="20" r="20" fill="#4a3420"/><text x="100" y="25">b</text><circle cx="170" cy="20" r="20" fill="#4a3420"/><text x="170" y="25">c</text><path d="M30 40L65 85M100 40L65 85M65 85L120 135M170 40L120 135" stroke="#ffb15c" stroke-width="3"/><circle cx="65" cy="88" r="20" fill="#4a3420"/><text x="65" y="93">+</text><circle cx="120" cy="138" r="20" fill="#4a3420"/><text x="120" y="143">+</text></g><text x="25" y="325" fill="#9aacbf" font-size="14">修复前 output mismatch 22 / 36</text></g></g><text x="600" y="608" text-anchor="middle" fill="#eef7ff" font-size="20" font-weight="700">被删除的中间 tensor 可能同时固定了数值语义。</text></g></svg>
