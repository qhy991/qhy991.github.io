<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">FP8 traffic saving versus online decode tax</title><desc id="desc">Weight compression halves DRAM reads but adds unpack, scale, conversion and scheduling work before the same GEMV result.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">COMPRESSION MOVES COST; IT DOES NOT DELETE COST</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">Llama-3.2-1B B1 QKV GEMV</text><g font-family="Arial, sans-serif"><g transform="translate(65 165)"><rect width="500" height="390" rx="24" fill="#183125" stroke="#a8ff60" stroke-width="3"/><text x="250" y="45" text-anchor="middle" fill="#a8ff60" font-size="24" font-weight="700">MEMORY SAVING</text><text x="50" y="105" fill="#eef7ff" font-size="18">BF16 weights</text><rect x="50" y="125" width="390" height="45" rx="11" fill="#56d8ff"/><text x="450" y="155" fill="#56d8ff" font-size="17" font-weight="700">12.59 MB</text><text x="50" y="215" fill="#eef7ff" font-size="18">FP8 weights</text><rect x="50" y="235" width="195" height="45" rx="11" fill="#a8ff60"/><text x="260" y="265" fill="#a8ff60" font-size="17" font-weight="700">6.32 MB</text><text x="250" y="330" text-anchor="middle" fill="#a8ff60" font-size="27" font-weight="700">≈50% FEWER BYTES</text><text x="250" y="365" text-anchor="middle" fill="#c9d5e5" font-size="16">real profiler mechanism</text></g><g transform="translate(635 165)"><rect width="500" height="390" rx="24" fill="#34271b" stroke="#ffad4d" stroke-width="3"/><text x="250" y="45" text-anchor="middle" fill="#ffad4d" font-size="24" font-weight="700">ONLINE DECODE TAX</text><g transform="translate(45 95)"><rect width="410" height="58" rx="14" fill="#34271b" stroke="#ffad4d"/><text x="205" y="36" text-anchor="middle" fill="#ffad4d" font-size="18" font-weight="700">E4M3 UNPACK × 28 STATIC SITES</text><rect y="78" width="410" height="58" rx="14" fill="#34271b" stroke="#ffad4d"/><text x="205" y="114" text-anchor="middle" fill="#ffad4d" font-size="18" font-weight="700">FP32 SCALE + CONVERSION</text><rect y="156" width="410" height="58" rx="14" fill="#34271b" stroke="#ffad4d"/><text x="205" y="192" text-anchor="middle" fill="#ffad4d" font-size="18" font-weight="700">LONGER DEPENDENCY / SCHEDULE</text></g><text x="250" y="345" text-anchor="middle" fill="#ff927f" font-size="27" font-weight="700">MATCHED: +5.06%</text><text x="250" y="375" text-anchor="middle" fill="#c9d5e5" font-size="16">13 / 13 slower</text></g><rect x="210" y="595" width="780" height="50" rx="14" fill="#24243a" stroke="#bc9cff" stroke-width="2"/><text x="600" y="627" text-anchor="middle" fill="#bc9cff" font-size="19" font-weight="700">WIN IFF MEMORY TIME SAVED &gt; UNPACK + SCALE + CONVERT + SCHEDULE</text></g></svg>
