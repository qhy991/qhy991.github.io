<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">TMA beats cp.async but loses to direct load for one-shot state</title><desc id="desc">Direct global-to-register load has one hop, while cp.async and TMA stage a 32 KiB tile through shared memory, adding synchronization and reducing resident CTAs.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b10"/><stop offset="1" stop-color="#111c30"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1024" height="1024" fill="url(#bg)"/><g opacity=".12" stroke="#8fa2bd"><path d="M0 170H1024M0 340H1024M0 510H1024M0 680H1024M0 850H1024"/><path d="M170 0V1024M340 0V1024M510 0V1024M680 0V1024M850 0V1024"/></g><g font-family="Inter,Arial,'PingFang SC',sans-serif" text-anchor="middle"><text x="512" y="72" fill="#eef7ff" font-size="34" font-weight="700">ADVANCED COPY ≠ SHORTER PATH</text><text x="512" y="110" fill="#8fa2bd" font-size="17" letter-spacing="2">32 KiB ONE-SHOT RECURRENT STATE · B200</text><g transform="translate(95 180)"><rect width="834" height="150" rx="24" fill="#183125" stroke="#b8ff5b" stroke-width="3"/><text x="55" y="45" text-anchor="start" fill="#b8ff5b" font-size="23" font-weight="700">DIRECT LDG</text><text x="55" y="82" text-anchor="start" fill="#eef7ff" font-size="18">GMEM</text><path d="M210 75H535" stroke="#b8ff5b" stroke-width="8"/><polygon points="555,75 525,58 525,92" fill="#b8ff5b"/><text x="630" y="82" fill="#eef7ff" font-size="18">REGISTER</text><text x="760" y="82" fill="#b8ff5b" font-size="22" font-weight="700">≈9.26 μs</text><text x="760" y="115" fill="#9aacbf" font-size="15">8 CTA / SM ceiling</text></g><g transform="translate(95 380)"><rect width="834" height="180" rx="24" fill="#361c21" stroke="#ff927f" stroke-width="3"/><text x="55" y="42" text-anchor="start" fill="#ff927f" font-size="23" font-weight="700">cp.async</text><text x="55" y="85" fill="#eef7ff" font-size="18">GMEM</text><path d="M125 78H300" stroke="#ff927f" stroke-width="7"/><polygon points="320,78 292,62 292,94" fill="#ff927f"/><rect x="330" y="45" width="180" height="66" rx="15" fill="#361c21" stroke="#ff927f" stroke-width="2"/><text x="420" y="72" fill="#ff927f" font-size="17" font-weight="700">32 KiB SMEM</text><text x="420" y="98" fill="#eef7ff" font-size="14">wait + barrier</text><path d="M510 78H620" stroke="#ff927f" stroke-width="7"/><polygon points="640,78 612,62 612,94" fill="#ff927f"/><text x="700" y="85" fill="#eef7ff" font-size="18">REG</text><text x="760" y="130" fill="#ff927f" font-size="22" font-weight="700">13.386 μs · +44.5%</text><text x="760" y="158" fill="#9aacbf" font-size="15">6 CTA / SM ceiling</text></g><g transform="translate(95 610)"><rect width="834" height="180" rx="24" fill="#34271b" stroke="#ffb15c" stroke-width="3"/><text x="55" y="42" text-anchor="start" fill="#ffb15c" font-size="23" font-weight="700">ONE 2D TMA</text><text x="55" y="85" fill="#eef7ff" font-size="18">GMEM</text><path d="M125 78H300" stroke="#ffb15c" stroke-width="7"/><polygon points="320,78 292,62 292,94" fill="#ffb15c"/><rect x="330" y="45" width="180" height="66" rx="15" fill="#34271b" stroke="#ffb15c" stroke-width="2"/><text x="420" y="72" fill="#ffb15c" font-size="17" font-weight="700">32 KiB SMEM</text><text x="420" y="98" fill="#eef7ff" font-size="14">mbarrier + LDS</text><path d="M510 78H620" stroke="#ffb15c" stroke-width="7"/><polygon points="640,78 612,62 612,94" fill="#ffb15c"/><text x="700" y="85" fill="#eef7ff" font-size="18">REG</text><text x="760" y="130" fill="#ffb15c" font-size="22" font-weight="700">11.317 μs · +22.2%</text><text x="760" y="158" fill="#9aacbf" font-size="15">copy issue reduced; hop remains</text></g><g filter="url(#g)"><rect x="185" y="865" width="654" height="95" rx="22" fill="#24243a" stroke="#b699ff" stroke-width="4"/><text x="512" y="905" fill="#b699ff" font-size="24" font-weight="700">NO REUSE → NO AMORTIZATION</text><text x="512" y="938" fill="#eef7ff" font-size="17">TMA solves issuance, not the extra data hop</text></g></g></svg>
