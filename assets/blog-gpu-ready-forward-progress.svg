<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Persistent waiter resource deadlock</title><desc id="desc">Consumer polling CTAs occupy all resident SM slots while waiting for a producer kernel that cannot launch, creating a forward-progress deadlock even with correct release acquire semantics.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/><g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">Memory Order 正确，也可能因 Residency 死锁</text><text x="65" y="104" fill="#9aacbf" font-size="16">等待者占满所有 CTA slot，producer 就没有机会发布 ready。</text><g transform="translate(70 160)"><rect width="710" height="390" rx="23" fill="#121b29" stroke="#70e6ff" stroke-width="3"/><text x="28" y="42" fill="#70e6ff" font-size="20" font-weight="700">GPU RESIDENT CAPACITY</text><g transform="translate(30 78)" text-anchor="middle" font-size="14"><g><rect width="145" height="82" rx="13" fill="#2b2020" stroke="#ff927f"/><text x="72" y="34" fill="#ff927f">poller CTA 0</text><text x="72" y="60" fill="#d9e7f5">wait ready</text></g><g transform="translate(165)"><rect width="145" height="82" rx="13" fill="#2b2020" stroke="#ff927f"/><text x="72" y="34" fill="#ff927f">poller CTA 1</text><text x="72" y="60" fill="#d9e7f5">wait ready</text></g><g transform="translate(330)"><rect width="145" height="82" rx="13" fill="#2b2020" stroke="#ff927f"/><text x="72" y="34" fill="#ff927f">poller CTA 2</text><text x="72" y="60" fill="#d9e7f5">wait ready</text></g><g transform="translate(495)"><rect width="145" height="82" rx="13" fill="#2b2020" stroke="#ff927f"/><text x="72" y="34" fill="#ff927f">poller CTA N</text><text x="72" y="60" fill="#d9e7f5">wait ready</text></g></g><text x="355" y="218" text-anchor="middle" fill="#ff927f" font-size="22" font-weight="700">ALL RESIDENT SLOTS OCCUPIED</text><path d="M355 245V310" stroke="#ff927f" stroke-width="6"/><polygon points="355,328 343,304 367,304" fill="#ff927f"/><rect x="155" y="330" width="400" height="56" rx="12" fill="#34271b" stroke="#ffb15c"/><text x="355" y="365" text-anchor="middle" fill="#eef7ff" font-size="16">queue remains empty forever</text></g><g transform="translate(850 210)"><rect width="280" height="240" rx="22" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="140" y="45" text-anchor="middle" fill="#b8ff5b" font-size="20" font-weight="700">PRODUCER KERNEL</text><text x="140" y="88" text-anchor="middle" fill="#d9e7f5" font-size="16">write payload</text><text x="140" y="122" text-anchor="middle" fill="#d9e7f5" font-size="16">release ready</text><line x1="40" y1="152" x2="240" y2="152" stroke="#40564a"/><text x="140" y="190" text-anchor="middle" fill="#ff927f" font-size="18" font-weight="700">CANNOT LAUNCH</text><text x="140" y="218" text-anchor="middle" fill="#9aacbf" font-size="13">no free SM / CTA slot</text></g><path d="M780 330H850" stroke="#ff927f" stroke-width="7" stroke-dasharray="12 9"/><text x="815" y="310" text-anchor="middle" fill="#ff927f" font-size="14">blocked</text><text x="600" y="615" text-anchor="middle" fill="#eef7ff" font-size="20" font-weight="700">修复：预留 producer capacity、分 phase、bounded poll 或 launch dependency。</text></g></svg>
