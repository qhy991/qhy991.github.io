<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Decode winner result and evidence boundary</title><desc id="desc">The BS128 N100 result shows a 5.66 percent median ITL improvement with path hits, while BS256, exact token correctness, and paired fresh-server evidence remain incomplete.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/>
  <g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">清晰的性能信号，不等于完成了 Promotion</text><text x="65" y="103" fill="#9aacbf" font-size="16">把已经证明和仍待证明分开，结果才可复用。</text>
    <g transform="translate(65 155)"><rect width="500" height="390" rx="22" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="28" y="44" fill="#b8ff5b" font-size="21" font-weight="700">已经有证据 · BS128 DEVELOPMENT</text><text x="28" y="92" fill="#9aacbf" font-size="15">Median ITL</text><text x="28" y="139" fill="#eef7ff" font-size="35" font-weight="700">33.116 → 31.243 ms</text><text x="28" y="184" fill="#b8ff5b" font-size="28" font-weight="700">−5.66%</text><line x1="28" y1="215" x2="472" y2="215" stroke="#40564a"/><text x="28" y="252" fill="#d9e7f5" font-size="16">✓ OPT0 100 runs</text><text x="28" y="284" fill="#d9e7f5" font-size="16">✓ Winners 100 runs</text><text x="28" y="316" fill="#d9e7f5" font-size="16">✓ cache hit ≈ 0.998</text><text x="28" y="348" fill="#d9e7f5" font-size="16">✓ exact op / phase / M hit counters</text></g>
    <g transform="translate(635 155)"><rect width="500" height="390" rx="22" fill="#34271b" stroke="#ffb15c" stroke-width="3"/><text x="28" y="44" fill="#ffb15c" font-size="21" font-weight="700">仍待补齐 · FORMAL PROMOTION</text><text x="28" y="91" fill="#d9e7f5" font-size="16">○ BS256 N=30 matched control</text><text x="28" y="129" fill="#d9e7f5" font-size="16">○ exact token trajectory / logprob artifact</text><text x="28" y="167" fill="#d9e7f5" font-size="16">○ fresh-server AB/BA paired order</text><text x="28" y="205" fill="#d9e7f5" font-size="16">○ independent request-seed holdout</text><text x="28" y="243" fill="#d9e7f5" font-size="16">○ all-rank matched Nsys explanation</text><line x1="28" y1="278" x2="472" y2="278" stroke="#60492f"/><text x="28" y="320" fill="#ffb15c" font-size="18" font-weight="700">正确裁决</text><text x="28" y="353" fill="#eef7ff" font-size="17">evidence-backed development result</text></g>
    <text x="600" y="612" text-anchor="middle" fill="#eef7ff" font-size="19" font-weight="700">缺少的证据不是脚注，而是结论边界的一部分。</text>
  </g>
</svg>
