<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Small grids leave most B300 streaming multiprocessors without target work</title>
  <desc id="desc">Four example kernels use 12, 16, 32, and 128 CTAs on a GPU with 148 SMs, showing that eliminating launch gaps cannot recover all unused parallel capacity.</desc>
  <rect width="1200" height="720" fill="#0b111c"/>
  <text x="70" y="78" fill="#f5f7fb" font-family="Arial, sans-serif" font-size="38" font-weight="700">A SMALL GRID CANNOT FILL A LARGE GPU</text>
  <text x="70" y="116" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="21">B300 example: 148 SMs; one CTA can occupy at most one new SM in this upper-bound view</text>
  <g font-family="Arial, sans-serif">
    <text x="70" y="193" fill="#c9d5e5" font-size="20">B1 projection</text><rect x="270" y="166" width="840" height="36" rx="10" fill="#1b2637"/><rect x="270" y="166" width="68" height="36" rx="10" fill="#56d8ff"/><text x="352" y="191" fill="#56d8ff" font-size="18" font-weight="700">12 CTA</text>
    <text x="70" y="273" fill="#c9d5e5" font-size="20">A0 add/norm</text><rect x="270" y="246" width="840" height="36" rx="10" fill="#1b2637"/><rect x="270" y="246" width="91" height="36" rx="10" fill="#a8ff60"/><text x="375" y="271" fill="#a8ff60" font-size="18" font-weight="700">16 CTA</text>
    <text x="70" y="353" fill="#c9d5e5" font-size="20">D1 projection</text><rect x="270" y="326" width="840" height="36" rx="10" fill="#1b2637"/><rect x="270" y="326" width="182" height="36" rx="10" fill="#bc9cff"/><text x="466" y="351" fill="#bc9cff" font-size="18" font-weight="700">32 CTA</text>
    <text x="70" y="433" fill="#c9d5e5" font-size="20">E1 score</text><rect x="270" y="406" width="840" height="36" rx="10" fill="#1b2637"/><rect x="270" y="406" width="727" height="36" rx="10" fill="#ffad4d"/><text x="1011" y="431" fill="#ffad4d" font-size="18" font-weight="700">128 CTA</text>
    <path d="M270 490H1110" stroke="#56667d" stroke-width="2"/><text x="270" y="520" fill="#9fb1c8" font-size="17">0 SM</text><text x="1110" y="520" text-anchor="end" fill="#9fb1c8" font-size="17">148 SM</text>
    <rect x="160" y="566" width="880" height="82" rx="20" fill="#3b291a" stroke="#ffad4d" stroke-width="2"/>
    <text x="600" y="600" text-anchor="middle" fill="#ffad4d" font-size="23" font-weight="700">LAUNCH BUBBLE ≠ PARALLELISM DEFICIT</text>
    <text x="600" y="632" text-anchor="middle" fill="#f5f7fb" font-size="19">Removing a 0.672 µs gap cannot fill SMs that have no CTA to run</text>
  </g>
</svg>
