<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Consumer stride support reverses the QKV producer verdict</title><desc id="desc">A compact-only consumer makes split QKV faster by avoiding a copy, while a stride-generic consumer makes merged QKV faster by avoiding two extra GEMM launches.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">THE PRODUCER VERDICT FLIPS WHEN THE CONSUMER CONTRACT CHANGES</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">Same QKV math · different edge cost</text><g font-family="Arial, sans-serif"><g transform="translate(65 165)"><rect width="500" height="370" rx="24" fill="#361c21" stroke="#ff927f" stroke-width="3"/><text x="250" y="45" text-anchor="middle" fill="#ff927f" font-size="24" font-weight="700">COMPACT-ONLY CONSUMER</text><rect x="55" y="90" width="390" height="60" rx="14" fill="#14263b" stroke="#70e6ff"/><text x="250" y="128" text-anchor="middle" fill="#70e6ff" font-size="18" font-weight="700">MERGED GEMM + COPY</text><text x="250" y="195" text-anchor="middle" fill="#ff927f" font-size="18">copy bucket 5.86 ms</text><path d="M250 220V260" stroke="#ff927f" stroke-width="6"/><path d="M238 248L250 272 262 248Z" fill="#ff927f"/><rect x="55" y="275" width="390" height="60" rx="14" fill="#183125" stroke="#a8ff60"/><text x="250" y="313" text-anchor="middle" fill="#a8ff60" font-size="18" font-weight="700">SPLIT Q / K / V WINS</text><text x="250" y="355" text-anchor="middle" fill="#eef7ff" font-size="17">59.8 → 56.5 ms</text></g><g transform="translate(635 165)"><rect width="500" height="370" rx="24" fill="#183125" stroke="#a8ff60" stroke-width="3"/><text x="250" y="45" text-anchor="middle" fill="#a8ff60" font-size="24" font-weight="700">STRIDE-GENERIC CONSUMER</text><rect x="55" y="90" width="390" height="60" rx="14" fill="#14263b" stroke="#70e6ff"/><text x="250" y="128" text-anchor="middle" fill="#70e6ff" font-size="18" font-weight="700">MERGED GEMM + FREE VIEWS</text><text x="250" y="195" text-anchor="middle" fill="#a8ff60" font-size="18">no materialization</text><path d="M250 220V260" stroke="#a8ff60" stroke-width="6"/><path d="M238 248L250 272 262 248Z" fill="#a8ff60"/><rect x="55" y="275" width="390" height="60" rx="14" fill="#183125" stroke="#a8ff60"/><text x="250" y="313" text-anchor="middle" fill="#a8ff60" font-size="18" font-weight="700">MERGED QKV WINS</text><text x="250" y="355" text-anchor="middle" fill="#eef7ff" font-size="17">50.834 → 50.115 ms</text></g><rect x="180" y="585" width="840" height="55" rx="15" fill="#24243a" stroke="#b699ff" stroke-width="2"/><text x="600" y="620" text-anchor="middle" fill="#b699ff" font-size="20" font-weight="700">WINNER = f(PRODUCER LAYOUT, CONSUMER STRIDE SUPPORT, M, TACTIC)</text></g></svg>
