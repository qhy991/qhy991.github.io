<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">GPU ready queue memory and forward-progress contract</title><desc id="desc">A GPU-resident queue needs release and acquire visibility, epoch and slot lifetime, exactly-once consumption, and reserved producer capacity to avoid deadlock.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b10"/><stop offset="1" stop-color="#111c30"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1024" height="1024" fill="url(#bg)"/><g opacity=".12" stroke="#8fa2bd"><path d="M0 170H1024M0 340H1024M0 510H1024M0 680H1024M0 850H1024"/><path d="M170 0V1024M340 0V1024M510 0V1024M680 0V1024M850 0V1024"/></g><g font-family="Inter,Arial,'PingFang SC',sans-serif" text-anchor="middle"><text x="512" y="72" fill="#eef7ff" font-size="36" font-weight="700">GPU-RESIDENT READY QUEUE</text><text x="512" y="108" fill="#8fa2bd" font-size="17" letter-spacing="2">VISIBILITY · EXACTLY ONCE · LIFETIME · PROGRESS</text><g transform="translate(80 175)" font-size="17" font-weight="700"><g><rect width="250" height="150" rx="21" fill="#13283c" stroke="#70e6ff" stroke-width="3"/><text x="125" y="43" fill="#70e6ff">PRODUCER</text><text x="125" y="78" fill="#eef7ff" font-size="15">write payload</text><text x="125" y="110" fill="#b8ff5b" font-size="15">release READY(epoch)</text></g><g transform="translate(614)"><rect width="250" height="150" rx="21" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="125" y="43" fill="#b8ff5b">CONSUMER</text><text x="125" y="78" fill="#eef7ff" font-size="15">acquire CLAIM</text><text x="125" y="110" fill="#70e6ff" font-size="15">read payload / retire</text></g></g><g filter="url(#g)"><path d="M330 250H412" stroke="#70e6ff" stroke-width="7"/><polygon points="430,250 404,237 404,263" fill="#70e6ff"/><path d="M694 250H612" stroke="#b8ff5b" stroke-width="7"/><polygon points="594,250 620,237 620,263" fill="#b8ff5b"/><rect x="430" y="168" width="164" height="165" rx="22" fill="#24243a" stroke="#b699ff" stroke-width="4"/><text x="512" y="208" fill="#b699ff" font-size="19" font-weight="700">QUEUE SLOT</text><text x="512" y="242" fill="#eef7ff" font-size="15">epoch · state</text><text x="512" y="271" fill="#d9e7f5" font-size="14">descriptor · tail</text><text x="512" y="300" fill="#9aacbf" font-size="13">poison / owner</text></g><g transform="translate(115 420)" font-size="16"><rect width="794" height="200" rx="24" fill="#121b29" stroke="#ffb15c" stroke-width="3"/><text x="397" y="43" text-anchor="middle" fill="#ffb15c" font-size="22" font-weight="700">FORWARD-PROGRESS BUDGET</text><g transform="translate(42 75)" text-anchor="middle"><rect width="210" height="82" rx="14" fill="#34271b"/><text x="105" y="34" fill="#eef7ff">consumer pollers</text><text x="105" y="61" fill="#9aacbf" font-size="13">must not fill all CTAs</text><g transform="translate(250)"><rect width="210" height="82" rx="14" fill="#182d24"/><text x="105" y="34" fill="#b8ff5b">reserved producer</text><text x="105" y="61" fill="#9aacbf" font-size="13">guaranteed SM slot</text></g><g transform="translate(500)"><rect width="210" height="82" rx="14" fill="#13283c"/><text x="105" y="34" fill="#70e6ff">bounded wait</text><text x="105" y="61" fill="#9aacbf" font-size="13">abort / yield / poison</text></g></g></g><path d="M512 620V710" stroke="#b8ff5b" stroke-width="9"/><polygon points="512,730 498,704 526,704" fill="#b8ff5b"/><rect x="165" y="740" width="694" height="145" rx="24" fill="#15263a" stroke="#b8ff5b" stroke-width="3"/><text x="330" y="790" fill="#8fa2bd" font-size="16">MEMORY CORRECTNESS</text><text x="330" y="830" fill="#eef7ff" font-size="23" font-weight="700">happens-before</text><text x="695" y="790" fill="#8fa2bd" font-size="16">EXECUTION CORRECTNESS</text><text x="695" y="830" fill="#b8ff5b" font-size="23" font-weight="700">forward progress</text><text x="512" y="955" fill="#ffb15c" font-size="22" font-weight="700">A QUEUE IS A PROTOCOL, NOT JUST HEAD + TAIL</text></g></svg>
