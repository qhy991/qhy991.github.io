<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">CTA topology is numerical semantics</title><desc id="desc">Q-head tile legality, KV split count and reduction carrier jointly determine launch validity, numerical exactness and performance.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b10"/><stop offset="1" stop-color="#111c30"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1024" height="1024" fill="url(#bg)"/><g opacity=".12" stroke="#8fa2bd"><path d="M0 170H1024M0 340H1024M0 510H1024M0 680H1024M0 850H1024"/><path d="M170 0V1024M340 0V1024M510 0V1024M680 0V1024M850 0V1024"/></g><g font-family="Inter,Arial,'PingFang SC',sans-serif" text-anchor="middle"><text x="512" y="76" fill="#eef7ff" font-size="34" font-weight="700">CTA COUNT IS NUMERICAL SEMANTICS</text><text x="512" y="113" fill="#8fa2bd" font-size="17" letter-spacing="2">FMHA · GQA · KV SPLIT · REDUCTION TREE</text><g transform="translate(100 185)"><rect width="824" height="150" rx="24" fill="#111b29" stroke="#34475c" stroke-width="3"/><text x="412" y="37" fill="#eef7ff" font-size="20" font-weight="700">LOCAL GQA: Q16 / KV1</text><g transform="translate(45 65)" font-size="18" font-weight="700"><rect width="210" height="55" rx="14" fill="#361c21" stroke="#ff927f" stroke-width="2"/><text x="105" y="35" fill="#ff927f">Q8 · INVALID</text><rect x="262" width="210" height="55" rx="14" fill="#183125" stroke="#b8ff5b" stroke-width="2"/><text x="367" y="35" fill="#b8ff5b">Q16 · EXACT</text><rect x="524" width="210" height="55" rx="14" fill="#34271b" stroke="#ffb15c" stroke-width="2"/><text x="629" y="35" fill="#ffb15c">Q32 · SLOWER</text></g></g><path d="M512 346V410" stroke="#b699ff" stroke-width="8"/><polygon points="512,430 498,404 526,404" fill="#b699ff"/><g transform="translate(100 430)"><rect width="824" height="205" rx="24" fill="#111b29" stroke="#34475c" stroke-width="3"/><text x="412" y="42" fill="#eef7ff" font-size="20" font-weight="700">KV SPLIT / REDUCTION</text><g transform="translate(38 80)" font-size="17" font-weight="700"><rect width="168" height="72" rx="14" fill="#361c21" stroke="#ff927f" stroke-width="2"/><text x="84" y="31" fill="#ff927f">1 CTA</text><text x="84" y="55" fill="#eef7ff" font-size="14">different tree</text><rect x="190" width="168" height="72" rx="14" fill="#361c21" stroke="#ff927f" stroke-width="2"/><text x="274" y="31" fill="#ff927f">2 CTA</text><text x="274" y="55" fill="#eef7ff" font-size="14">different tree</text><rect x="380" width="168" height="72" rx="14" fill="#183125" stroke="#b8ff5b" stroke-width="2"/><text x="464" y="31" fill="#b8ff5b">CGA4</text><text x="464" y="55" fill="#eef7ff" font-size="14">exact baseline</text><rect x="570" width="168" height="72" rx="14" fill="#34271b" stroke="#ffb15c" stroke-width="2"/><text x="654" y="31" fill="#ffb15c">GMEM4</text><text x="654" y="55" fill="#eef7ff" font-size="14">exact · slower</text></g></g><g filter="url(#g)"><rect x="190" y="735" width="644" height="120" rx="25" fill="#24243a" stroke="#b699ff" stroke-width="4"/><text x="512" y="780" fill="#b699ff" font-size="25" font-weight="700">LEGALITY → EXACTNESS → TIME</text><text x="512" y="820" fill="#eef7ff" font-size="18">never time an invalid numerical protocol</text></g><text x="512" y="942" fill="#b8ff5b" font-size="23" font-weight="700">FEWER CTAs CAN MEAN A DIFFERENT ANSWER</text></g></svg>
