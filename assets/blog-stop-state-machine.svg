<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Optimization candidate decision state machine</title><desc id="desc">A candidate branches to distinct stop states at path, build, correctness, materiality, operator, end-to-end and formal gates, or reaches bounded acceptance.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#70e6ff"/></marker></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/><g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">候选状态机：每个分支都留下 Receipt</text><text x="65" y="104" fill="#9aacbf" font-size="16">STOP 不删除历史；它冻结当前 claim，并定义重新打开所需的新证据。</text><g transform="translate(65 150)" font-size="14" text-anchor="middle"><g><rect width="150" height="72" rx="14" fill="#13283c" stroke="#70e6ff" stroke-width="2"/><text x="75" y="43" fill="#eef7ff">CANDIDATE</text></g><path d="M150 36H200" stroke="#70e6ff" stroke-width="4" marker-end="url(#a)"/><g transform="translate(215)"><rect width="150" height="72" rx="14" fill="#182d24" stroke="#b8ff5b" stroke-width="2"/><text x="75" y="43" fill="#eef7ff">PATH / BUILD</text></g><path d="M365 36H415" stroke="#70e6ff" stroke-width="4" marker-end="url(#a)"/><g transform="translate(430)"><rect width="150" height="72" rx="14" fill="#24243a" stroke="#b699ff" stroke-width="2"/><text x="75" y="43" fill="#eef7ff">CORRECTNESS</text></g><path d="M580 36H630" stroke="#70e6ff" stroke-width="4" marker-end="url(#a)"/><g transform="translate(645)"><rect width="150" height="72" rx="14" fill="#34271b" stroke="#ffb15c" stroke-width="2"/><text x="75" y="43" fill="#eef7ff">VALUE / NOISE</text></g><path d="M795 36H845" stroke="#70e6ff" stroke-width="4" marker-end="url(#a)"/><g transform="translate(860)"><rect width="150" height="72" rx="14" fill="#13283c" stroke="#70e6ff" stroke-width="2"/><text x="75" y="43" fill="#eef7ff">OPERATOR</text></g><path d="M1010 36H1060" stroke="#70e6ff" stroke-width="4" marker-end="url(#a)"/></g><g transform="translate(955 260)"><rect width="180" height="75" rx="15" fill="#182d24" stroke="#b8ff5b" stroke-width="2"/><text x="90" y="45" text-anchor="middle" fill="#eef7ff" font-size="14">E2E / FORMAL</text></g><path d="M1125 222V255" stroke="#70e6ff" stroke-width="4" marker-end="url(#a)"/><g transform="translate(900 410)"><rect width="235" height="90" rx="18" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="117" y="38" text-anchor="middle" fill="#b8ff5b" font-size="18" font-weight="700">ACCEPT BOUNDED</text><text x="117" y="66" text-anchor="middle" fill="#d9e7f5" font-size="13">formal + holdout + causal</text></g><path d="M1045 335V403" stroke="#b8ff5b" stroke-width="5" marker-end="url(#a)"/><g transform="translate(65 300)" font-size="13" text-anchor="middle"><g><rect width="170" height="95" rx="16" fill="#2b2020" stroke="#ff927f" stroke-width="2"/><text x="85" y="35" fill="#ff927f">NOT APPLICABLE</text><text x="85" y="63" fill="#9aacbf">path mismatch</text></g><g transform="translate(190)"><rect width="170" height="95" rx="16" fill="#2b2020" stroke="#ff927f" stroke-width="2"/><text x="85" y="35" fill="#ff927f">ABI STOP</text><text x="85" y="63" fill="#9aacbf">no legal binary</text></g><g transform="translate(380)"><rect width="170" height="95" rx="16" fill="#2b2020" stroke="#ff927f" stroke-width="2"/><text x="85" y="35" fill="#ff927f">CORRECTNESS</text><text x="85" y="63" fill="#9aacbf">no timing claim</text></g><g transform="translate(570)"><rect width="170" height="95" rx="16" fill="#34271b" stroke="#ffb15c" stroke-width="2"/><text x="85" y="35" fill="#ffb15c">LOW VALUE</text><text x="85" y="63" fill="#9aacbf">noise / ceiling</text></g><g transform="translate(760)"><rect width="170" height="95" rx="16" fill="#2b2020" stroke="#ff927f" stroke-width="2"/><text x="85" y="35" fill="#ff927f">PERFORMANCE</text><text x="85" y="63" fill="#9aacbf">operator / E2E</text></g></g><g transform="translate(130 500)"><rect width="700" height="105" rx="20" fill="#121b29" stroke="#34475c" stroke-width="2"/><text x="350" y="35" text-anchor="middle" fill="#eef7ff" font-size="18" font-weight="700">EVERY STOP STORES</text><text x="350" y="69" text-anchor="middle" fill="#d9e7f5" font-size="14">proved facts · raw/source identity · unrun levels · rollback · reopen condition</text></g><text x="600" y="647" text-anchor="middle" fill="#eef7ff" font-size="19" font-weight="700">Search becomes efficient when evidence removes branches permanently.</text></g></svg>
