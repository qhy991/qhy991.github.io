<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Scalar BF16 I/O versus vector I/O</title><desc id="desc">The same BF16 payload is moved with many 16-bit instructions in the control and fewer 64 or 128 bit instructions in the candidate, reducing LSU instructions and excessive sectors without reducing DRAM bytes.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/><g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">相同的 32 Byte，用更少、更宽的指令搬运</text><text x="65" y="104" fill="#9aacbf" font-size="16">DRAM payload 不变；LSU/MIO 指令数和 sector efficiency 改变。</text><g transform="translate(70 170)"><rect width="490" height="320" rx="22" fill="#2b2020" stroke="#ff927f" stroke-width="3"/><text x="28" y="45" fill="#ff927f" font-size="20" font-weight="700">CONTROL · 16-BIT SCALAR</text><g transform="translate(30 85)" fill="#ff927f"><rect width="18" height="72"/><rect x="27" width="18" height="72"/><rect x="54" width="18" height="72"/><rect x="81" width="18" height="72"/><rect x="108" width="18" height="72"/><rect x="135" width="18" height="72"/><rect x="162" width="18" height="72"/><rect x="189" width="18" height="72"/><rect x="216" width="18" height="72"/><rect x="243" width="18" height="72"/><rect x="270" width="18" height="72"/><rect x="297" width="18" height="72"/><rect x="324" width="18" height="72"/><rect x="351" width="18" height="72"/><rect x="378" width="18" height="72"/><rect x="405" width="18" height="72"/></g><text x="30" y="205" fill="#d9e7f5" font-size="16">16 scalar load/store instructions</text><text x="30" y="242" fill="#9aacbf" font-size="14">LDG/STG.E.U16 dominates</text><text x="30" y="275" fill="#9aacbf" font-size="14">more instruction issue + wasted sectors</text></g><g transform="translate(640 170)"><rect width="490" height="320" rx="22" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="28" y="45" fill="#b8ff5b" font-size="20" font-weight="700">CANDIDATE · VECTOR I/O</text><g transform="translate(30 85)"><rect width="200" height="72" rx="8" fill="#70e6ff"/><rect x="220" width="200" height="72" rx="8" fill="#b8ff5b"/></g><text x="30" y="205" fill="#d9e7f5" font-size="16">2×128-bit or 4×64-bit instructions</text><text x="30" y="242" fill="#9aacbf" font-size="14">same addresses · predicates · arithmetic</text><text x="30" y="275" fill="#9aacbf" font-size="14">fewer LSU ops · lower MIO throttle</text></g><g transform="translate(190 535)" text-anchor="middle"><text x="0" y="0" fill="#9aacbf" font-size="15">dynamic global loads</text><text x="0" y="37" fill="#70e6ff" font-size="27" font-weight="700">−40.79%</text><text x="410" y="0" fill="#9aacbf" font-size="15">dynamic global stores</text><text x="410" y="37" fill="#b8ff5b" font-size="27" font-weight="700">−37.5%</text><text x="820" y="0" fill="#9aacbf" font-size="15">excessive sectors</text><text x="820" y="37" fill="#ffb15c" font-size="27" font-weight="700">≈ −90%</text></g><text x="600" y="628" text-anchor="middle" fill="#eef7ff" font-size="18" font-weight="700">宽访存减少的是搬运指令和无效事务，不是模型必须读取的数据。</text></g></svg>
