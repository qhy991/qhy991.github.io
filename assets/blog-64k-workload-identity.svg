<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Three different 64K workload identities</title><desc id="desc">Cold prefill builds the full KV cache, cached incremental prefill processes only new suffix tokens, and long decode scans existing KV per step. They use different metrics and critical paths.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/><g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">“64K”不是一个 Workload</text><text x="65" y="104" fill="#9aacbf" font-size="16">相同 context 标签下，计时边界、输入分解和瓶颈可以完全不同。</text><g transform="translate(65 160)"><g><rect width="330" height="390" rx="22" fill="#34271b" stroke="#ffb15c" stroke-width="3"/><text x="25" y="43" fill="#ffb15c" font-size="20" font-weight="700">COLD 64K PREFILL</text><text x="25" y="82" fill="#d9e7f5" font-size="15">cache = 0</text><text x="25" y="112" fill="#d9e7f5" font-size="15">new ≈ 65K</text><g transform="translate(30 155)"><rect width="270" height="54" rx="10" fill="#ffb15c"/><text x="135" y="34" text-anchor="middle" fill="#0a0d0f" font-size="15" font-weight="700">build entire KV</text><rect y="72" width="70" height="42" rx="9" fill="#70e6ff"/><text x="35" y="99" text-anchor="middle" fill="#eef7ff" font-size="12">decode</text></g><text x="25" y="315" fill="#9aacbf" font-size="15">Primary metric</text><text x="25" y="350" fill="#eef7ff" font-size="22" font-weight="700">TTFT</text></g><g transform="translate(370)"><rect width="330" height="390" rx="22" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="25" y="43" fill="#b8ff5b" font-size="20" font-weight="700">CACHED INCREMENTAL</text><text x="25" y="82" fill="#d9e7f5" font-size="15">cache ≈ 64K</text><text x="25" y="112" fill="#d9e7f5" font-size="15">new = 1K / 2K</text><g transform="translate(30 155)"><rect width="220" height="54" rx="10" fill="#40564a"/><text x="110" y="34" text-anchor="middle" fill="#eef7ff" font-size="14">cached prefix</text><rect x="230" width="40" height="54" rx="8" fill="#b8ff5b"/><rect y="72" width="270" height="42" rx="9" fill="#24303f"/><text x="135" y="99" text-anchor="middle" fill="#eef7ff" font-size="12">increment + first token</text></g><text x="25" y="315" fill="#9aacbf" font-size="15">Primary metric</text><text x="25" y="350" fill="#eef7ff" font-size="22" font-weight="700">incremental TTFT</text></g><g transform="translate(740)"><rect width="330" height="390" rx="22" fill="#13283c" stroke="#70e6ff" stroke-width="3"/><text x="25" y="43" fill="#70e6ff" font-size="20" font-weight="700">LONG-KV DECODE</text><text x="25" y="82" fill="#d9e7f5" font-size="15">cache ≈ 64K</text><text x="25" y="112" fill="#d9e7f5" font-size="15">new = 1 token / step</text><g transform="translate(30 155)"><rect width="250" height="54" rx="10" fill="#405064"/><text x="125" y="34" text-anchor="middle" fill="#eef7ff" font-size="14">scan / index long KV</text><rect x="255" width="15" height="54" rx="5" fill="#70e6ff"/><path d="M0 85H270" stroke="#70e6ff" stroke-width="5" stroke-dasharray="12 8"/></g><text x="25" y="315" fill="#9aacbf" font-size="15">Primary metric</text><text x="25" y="350" fill="#eef7ff" font-size="22" font-weight="700">TPOT / ITL</text></g></g><text x="600" y="615" text-anchor="middle" fill="#eef7ff" font-size="20" font-weight="700">不写每请求 cached/new/output，就无法判断两个“64K”数字是否可比。</text></g></svg>
