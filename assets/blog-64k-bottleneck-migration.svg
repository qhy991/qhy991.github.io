<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">Kernel wins disappear as context bottlenecks migrate</title><desc id="desc">A projection GEMM winner is visible at 2K context, but at 64K attention, index score, DeepEP, and rank-tail work dominate the critical path.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b10"/><stop offset="1" stop-color="#111c30"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1024" height="1024" fill="url(#bg)"/><g opacity=".12" stroke="#8fa2bd"><path d="M0 170H1024M0 340H1024M0 510H1024M0 680H1024M0 850H1024"/><path d="M170 0V1024M340 0V1024M510 0V1024M680 0V1024M850 0V1024"/></g><g font-family="Inter,Arial,'PingFang SC',sans-serif" text-anchor="middle"><text x="512" y="72" fill="#eef7ff" font-size="36" font-weight="700">WHEN A WINNER DISAPPEARS</text><text x="512" y="108" fill="#8fa2bd" font-size="17" letter-spacing="2">CONTEXT CHANGES THE DENOMINATOR</text><g transform="translate(75 175)"><rect width="390" height="285" rx="24" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="195" y="43" fill="#b8ff5b" font-size="22" font-weight="700">2K PREFILL</text><text x="195" y="80" fill="#eef7ff" font-size="17">projection GEMM visible</text><g transform="translate(45 120)"><rect width="300" height="52" rx="10" fill="#70e6ff"/><text x="150" y="33" text-anchor="middle" fill="#0a0d0f" font-size="15" font-weight="700">swappable GEMM share</text><rect y="68" width="180" height="42" rx="9" fill="#b699ff"/><rect x="190" y="68" width="110" height="42" rx="9" fill="#ffb15c"/></g><text x="195" y="250" fill="#b8ff5b" font-size="30" font-weight="700">TTFT −7–9%</text><g transform="translate(484)"><rect width="390" height="285" rx="24" fill="#34271b" stroke="#ffb15c" stroke-width="3"/><text x="195" y="43" fill="#ffb15c" font-size="22" font-weight="700">64K MULTI-GPU</text><text x="195" y="80" fill="#eef7ff" font-size="17">bottleneck migrated</text><g transform="translate(45 120)"><rect width="300" height="52" rx="10" fill="#ffb15c"/><text x="150" y="33" text-anchor="middle" fill="#0a0d0f" font-size="15" font-weight="700">DeepEP / communication</text><rect y="68" width="210" height="42" rx="9" fill="#b699ff"/><text x="105" y="95" text-anchor="middle" fill="#eef7ff" font-size="13">DSA / score</text><rect x="220" y="68" width="80" height="42" rx="9" fill="#70e6ff"/></g><text x="195" y="250" fill="#ff927f" font-size="30" font-weight="700">GEMM gain ≈ noise</text></g></g><g filter="url(#g)"><path d="M465 318H550" stroke="#70e6ff" stroke-width="7"/><polygon points="570,318 542,304 542,332" fill="#70e6ff"/></g><rect x="250" y="560" width="524" height="185" rx="25" fill="#15263a" stroke="#70e6ff" stroke-width="4"/><text x="512" y="608" fill="#70e6ff" font-size="24" font-weight="700">MIGRATION AUDIT</text><text x="512" y="650" fill="#eef7ff" font-size="17">cold / cached / decode · local M · ABI · graph</text><text x="512" y="688" fill="#b8ff5b" font-size="17">recompute Amdahl ceiling before coding</text><path d="M512 745V820" stroke="#b8ff5b" stroke-width="9"/><polygon points="512,840 498,814 526,814" fill="#b8ff5b"/><rect x="155" y="850" width="714" height="80" rx="19" fill="#121b29" stroke="#b8ff5b" stroke-width="3"/><text x="512" y="901" fill="#eef7ff" font-size="23" font-weight="700">MOVE THE OPTIMIZATION WHEN THE BOTTLENECK MOVES</text><text x="512" y="966" fill="#ffb15c" font-size="20" font-weight="700">THE KERNEL DID NOT FAIL · THE WORKLOAD CHANGED</text></g></svg>
