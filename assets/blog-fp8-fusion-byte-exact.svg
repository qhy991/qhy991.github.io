<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">Byte-exact FP8 fusion</title><desc id="desc">FP8 payload, scale layout, BF16 rounding, reduction tree, and state side effects pass through a fusion gate before end-to-end speedups are accepted.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b10"/><stop offset="1" stop-color="#111c30"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1024" height="1024" fill="url(#bg)"/><g opacity=".12" stroke="#8fa2bd"><path d="M0 170H1024M0 340H1024M0 510H1024M0 680H1024M0 850H1024"/><path d="M170 0V1024M340 0V1024M510 0V1024M680 0V1024M850 0V1024"/></g><g font-family="Inter,Arial,'PingFang SC',sans-serif" text-anchor="middle"><text x="512" y="72" fill="#eef7ff" font-size="36" font-weight="700">BYTE-EXACT FUSION</text><text x="512" y="108" fill="#8fa2bd" font-size="17" letter-spacing="2">ROUNDING · LAYOUT · TREE · STATE · FREQUENCY</text><g transform="translate(80 175)" font-size="16" font-weight="700"><g><rect width="200" height="145" rx="20" fill="#13283c" stroke="#70e6ff" stroke-width="3"/><text x="100" y="40" fill="#70e6ff">FP8 PAYLOAD</text><g fill="#70e6ff"><rect x="38" y="68" width="24" height="32"/><rect x="70" y="68" width="24" height="32"/><rect x="102" y="68" width="24" height="32"/><rect x="134" y="68" width="24" height="32"/></g><text x="100" y="125" fill="#9aacbf" font-size="13">byte exact</text></g><g transform="translate(220)"><rect width="200" height="145" rx="20" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="100" y="40" fill="#b8ff5b">SCALE ABI</text><text x="100" y="77" fill="#eef7ff" font-size="15">[K/128, M]</text><text x="100" y="104" fill="#d9e7f5" font-size="14">shape · stride · bits</text><text x="100" y="125" fill="#9aacbf" font-size="13">consumer exact</text></g><g transform="translate(440)"><rect width="200" height="145" rx="20" fill="#24243a" stroke="#b699ff" stroke-width="3"/><text x="100" y="40" fill="#b699ff">BF16 ROUND</text><text x="100" y="77" fill="#eef7ff" font-size="15">materialization seam</text><text x="100" y="104" fill="#d9e7f5" font-size="14">RNE before norm</text><text x="100" y="125" fill="#9aacbf" font-size="13">state exact</text></g><g transform="translate(660)"><rect width="200" height="145" rx="20" fill="#34271b" stroke="#ffb15c" stroke-width="3"/><text x="100" y="40" fill="#ffb15c">REDUCTION TREE</text><text x="100" y="77" fill="#eef7ff" font-size="15">same grouping</text><text x="100" y="104" fill="#d9e7f5" font-size="14">same rounding order</text><text x="100" y="125" fill="#9aacbf" font-size="13">token exact</text></g></g><g filter="url(#g)"><path d="M180 320C180 425 430 395 470 500M400 320C400 425 475 415 495 500M620 320C620 425 549 415 529 500M840 320C840 425 594 395 554 500" fill="none" stroke="#70e6ff" stroke-width="5"/><rect x="330" y="500" width="364" height="176" rx="25" fill="#15263a" stroke="#b8ff5b" stroke-width="4"/><text x="512" y="548" fill="#b8ff5b" font-size="25" font-weight="700">FUSION ADMISSION</text><text x="512" y="590" fill="#eef7ff" font-size="18">producer writes final consumer format</text><text x="512" y="626" fill="#ffb15c" font-size="17">all bytes + side effects + graph path</text></g><path d="M512 676V755" stroke="#b8ff5b" stroke-width="9"/><polygon points="512,775 498,749 526,749" fill="#b8ff5b"/><rect x="160" y="785" width="704" height="124" rx="23" fill="#121b29" stroke="#b8ff5b" stroke-width="3"/><text x="310" y="833" fill="#8fa2bd" font-size="16">LOCAL WIN</text><text x="310" y="870" fill="#eef7ff" font-size="28" font-weight="700">× call frequency</text><text x="690" y="833" fill="#8fa2bd" font-size="16">SYSTEM WIN</text><text x="690" y="870" fill="#b8ff5b" font-size="28" font-weight="700">critical path</text><text x="512" y="960" fill="#ffb15c" font-size="23" font-weight="700">SAME MODEL FIRST · FASTER MODEL SECOND</text></g></svg>
