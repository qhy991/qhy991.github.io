<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">FP8 backend selector by phase, M regime and projection role</title><desc id="desc">Large-M batched prefill uses block-scaled DeepGEMM for all projection roles, while B1 prefill enables it only for down projection and keeps rowwise FP8 elsewhere.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">BACKEND SELECTION IS A PHASE × M × ROLE MATRIX</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">Green = block-scaled DeepGEMM · blue = rowwise FP8</text><g font-family="Arial, sans-serif"><text x="65" y="190" fill="#eef7ff" font-size="20" font-weight="700">CELL</text><g transform="translate(300 155)" font-size="16" font-weight="700"><text x="65" y="35" text-anchor="middle" fill="#c9d5e5">Q/K/V</text><text x="215" y="35" text-anchor="middle" fill="#c9d5e5">O</text><text x="365" y="35" text-anchor="middle" fill="#c9d5e5">GATE_UP</text><text x="535" y="35" text-anchor="middle" fill="#c9d5e5">DOWN</text><text x="700" y="35" text-anchor="middle" fill="#c9d5e5">GATE</text></g><text x="65" y="300" fill="#a8ff60" font-size="20" font-weight="700">BATCHED LARGE-M</text><g transform="translate(300 245)" fill="#183125" stroke="#a8ff60" stroke-width="2"><rect width="130" height="70" rx="14"/><rect x="150" width="130" height="70" rx="14"/><rect x="300" width="150" height="70" rx="14"/><rect x="470" width="150" height="70" rx="14"/></g><g transform="translate(300 245)" font-size="15" font-weight="700" fill="#a8ff60" text-anchor="middle"><text x="65" y="43">DEEPGEMM</text><text x="215" y="43">DEEPGEMM</text><text x="375" y="43">DEEPGEMM</text><text x="545" y="43">DEEPGEMM</text></g><text x="65" y="430" fill="#bc9cff" font-size="20" font-weight="700">B1 PREFILL</text><g transform="translate(300 375)" stroke-width="2"><rect width="130" height="70" rx="14" fill="#14263b" stroke="#70e6ff"/><rect x="150" width="130" height="70" rx="14" fill="#14263b" stroke="#70e6ff"/><rect x="300" width="150" height="70" rx="14" fill="#14263b" stroke="#70e6ff"/><rect x="470" width="150" height="70" rx="14" fill="#183125" stroke="#a8ff60"/></g><g transform="translate(300 375)" font-size="15" font-weight="700" text-anchor="middle"><text x="65" y="43" fill="#70e6ff">ROWWISE</text><text x="215" y="43" fill="#70e6ff">ROWWISE</text><text x="375" y="43" fill="#70e6ff">ROWWISE</text><text x="545" y="43" fill="#a8ff60">DEEPGEMM</text></g><text x="65" y="555" fill="#ff927f" font-size="20" font-weight="700">B1 ALL-ROLE</text><rect x="300" y="500" width="620" height="70" rx="14" fill="#361c21" stroke="#ff927f" stroke-width="3"/><text x="610" y="543" text-anchor="middle" fill="#ff927f" font-size="19" font-weight="700">124/128 · REJECT → FALLBACK</text><rect x="190" y="605" width="820" height="45" rx="13" fill="#24243a" stroke="#b699ff"/><text x="600" y="634" text-anchor="middle" fill="#b699ff" font-size="18" font-weight="700">SELECTOR KEY: {PHASE, M BUCKET, ROLE, CONSUMER}</text></g></svg>
