<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">DRAM bytes go down while matched kernel time goes up</title><desc id="desc">FP8 QKV halves weight traffic but adds unpack and conversion instructions, making the balanced matched event slower.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b10"/><stop offset="1" stop-color="#111c30"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1024" height="1024" fill="url(#bg)"/><g opacity=".12" stroke="#8fa2bd"><path d="M0 170H1024M0 340H1024M0 510H1024M0 680H1024M0 850H1024"/><path d="M170 0V1024M340 0V1024M510 0V1024M680 0V1024M850 0V1024"/></g><g font-family="Inter,Arial,'PingFang SC',sans-serif" text-anchor="middle"><text x="512" y="73" fill="#eef7ff" font-size="35" font-weight="700">BYTES DOWN. TIME UP.</text><text x="512" y="111" fill="#8fa2bd" font-size="17" letter-spacing="2">FP8 QKV · VECTOR I/O · MLP · MATCHED EVENT</text><g transform="translate(105 180)"><rect width="814" height="190" rx="25" fill="#183125" stroke="#b8ff5b" stroke-width="3"/><text x="50" y="45" text-anchor="start" fill="#b8ff5b" font-size="22" font-weight="700">DRAM READS</text><rect x="50" y="78" width="650" height="42" rx="11" fill="#2b3b4f"/><rect x="50" y="78" width="650" height="42" rx="11" fill="#70e6ff"/><text x="735" y="106" fill="#70e6ff" font-size="18" font-weight="700">12.59 MB</text><rect x="50" y="140" width="650" height="42" rx="11" fill="#2b3b4f"/><rect x="50" y="140" width="326" height="42" rx="11" fill="#b8ff5b"/><text x="410" y="168" fill="#b8ff5b" font-size="18" font-weight="700">6.32 MB</text></g><path d="M512 385V455" stroke="#b699ff" stroke-width="8"/><polygon points="512,475 498,449 526,449" fill="#b699ff"/><g transform="translate(105 475)"><rect width="814" height="205" rx="25" fill="#34271b" stroke="#ffb15c" stroke-width="3"/><text x="407" y="45" fill="#ffb15c" font-size="23" font-weight="700">ONLINE DECODE TAX</text><g transform="translate(50 78)" font-size="17" font-weight="700"><rect width="205" height="60" rx="14" fill="#34271b" stroke="#ffb15c"/><text x="102" y="37" fill="#ffb15c">E4M3 UNPACK</text><rect x="230" width="205" height="60" rx="14" fill="#34271b" stroke="#ffb15c"/><text x="332" y="37" fill="#ffb15c">SCALE / CONVERT</text><rect x="460" width="205" height="60" rx="14" fill="#34271b" stroke="#ffb15c"/><text x="562" y="37" fill="#ffb15c">DEPENDENCY</text></g><text x="407" y="175" fill="#eef7ff" font-size="17">28 native unpack instructions + schedule cost</text></g><g filter="url(#g)"><rect x="180" y="765" width="664" height="115" rx="25" fill="#361c21" stroke="#ff927f" stroke-width="4"/><text x="512" y="810" fill="#ff927f" font-size="26" font-weight="700">MATCHED EVENT: 1.0506× SLOWER</text><text x="512" y="850" fill="#eef7ff" font-size="17">13 / 13 blocks lose despite lower traffic</text></g><text x="512" y="952" fill="#b8ff5b" font-size="23" font-weight="700">COUNTERS EXPLAIN; WALL-TIME DECIDES</text></g></svg>
