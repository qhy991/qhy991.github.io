<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">Fixing a false per-row baseline is not a 26x kernel win</title><desc id="desc">A Python row loop taking 409 milliseconds becomes a true batched eager DAG, then a CUDA Graph, then fused SwiGLU, reaching 15.5 milliseconds near the fair SGLang baseline.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b10"/><stop offset="1" stop-color="#111c30"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1024" height="1024" fill="url(#bg)"/><g opacity=".12" stroke="#8fa2bd"><path d="M0 170H1024M0 340H1024M0 510H1024M0 680H1024M0 850H1024"/><path d="M170 0V1024M340 0V1024M510 0V1024M680 0V1024M850 0V1024"/></g><g font-family="Inter,Arial,'PingFang SC',sans-serif" text-anchor="middle"><text x="512" y="72" fill="#eef7ff" font-size="34" font-weight="700">FIX THE EXECUTION MODEL FIRST</text><text x="512" y="110" fill="#8fa2bd" font-size="17" letter-spacing="2">PER-ROW LOOP · TRUE BATCH · CUDA GRAPH · FAIR BASELINE</text><g transform="translate(105 180)"><rect width="814" height="150" rx="24" fill="#361c21" stroke="#ff927f" stroke-width="3"/><text x="55" y="43" text-anchor="start" fill="#ff927f" font-size="22" font-weight="700">PYTHON PER-ROW</text><rect x="55" y="75" width="660" height="48" rx="12" fill="#ff927f"/><text x="760" y="106" fill="#ff927f" font-size="22" font-weight="700">409 ms</text></g><path d="M512 340V390" stroke="#b699ff" stroke-width="7"/><polygon points="512,410 498,384 526,384" fill="#b699ff"/><g transform="translate(105 415)"><rect width="814" height="95" rx="20" fill="#14263b" stroke="#70e6ff" stroke-width="3"/><text x="45" y="38" text-anchor="start" fill="#70e6ff" font-size="20" font-weight="700">TRUE BATCHED EAGER</text><text x="730" y="60" fill="#70e6ff" font-size="23" font-weight="700">37.4 ms</text></g><path d="M512 520V555" stroke="#b699ff" stroke-width="7"/><polygon points="512,575 498,549 526,549" fill="#b699ff"/><g transform="translate(105 580)"><rect width="814" height="95" rx="20" fill="#24243a" stroke="#b699ff" stroke-width="3"/><text x="45" y="38" text-anchor="start" fill="#b699ff" font-size="20" font-weight="700">WHOLE-PREFILL GRAPH</text><text x="730" y="60" fill="#b699ff" font-size="23" font-weight="700">17.8 ms</text></g><path d="M512 685V720" stroke="#b699ff" stroke-width="7"/><polygon points="512,740 498,714 526,714" fill="#b699ff"/><g transform="translate(105 745)"><rect width="814" height="95" rx="20" fill="#183125" stroke="#a8ff60" stroke-width="3"/><text x="45" y="38" text-anchor="start" fill="#a8ff60" font-size="20" font-weight="700">+ FUSED SWIGLU</text><text x="730" y="60" fill="#a8ff60" font-size="23" font-weight="700">15.5 ms</text></g><g filter="url(#g)"><rect x="180" y="890" width="664" height="72" rx="20" fill="#34271b" stroke="#ffb15c" stroke-width="3"/><text x="512" y="920" fill="#ffb15c" font-size="20" font-weight="700">FAIR SGLANG ONE_BATCH: 15.03 ms</text><text x="512" y="946" fill="#eef7ff" font-size="15">structure repaired · no 26× mature-baseline claim</text></g></g></svg>
