<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Occupancy and instruction-level parallelism hide latency differently</title><desc id="desc">Occupancy uses more resident warps, while ILP uses more independent per-thread state. Different kernels prefer different positions between them.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/><g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">GPU 隐藏延迟的两条路：更多 Warps 或更多在途状态</text><text x="65" y="104" fill="#9aacbf" font-size="16">寄存器预算决定 occupancy 与 ILP 的位置，不存在全局最优点。</text><g transform="translate(75 165)"><rect width="480" height="365" rx="23" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="28" y="43" fill="#b8ff5b" font-size="20" font-weight="700">OCCUPANCY PATH</text><text x="28" y="80" fill="#d9e7f5" font-size="16">more resident warps / CTAs</text><g transform="translate(40 120)" fill="#b8ff5b"><rect width="88" height="55" rx="10"/><rect x="105" width="88" height="55" rx="10"/><rect x="210" width="88" height="55" rx="10"/><rect x="315" width="88" height="55" rx="10"/><rect y="75" width="88" height="55" rx="10"/><rect x="105" y="75" width="88" height="55" rx="10"/><rect x="210" y="75" width="88" height="55" rx="10"/><rect x="315" y="75" width="88" height="55" rx="10"/></g><text x="28" y="290" fill="#9aacbf" font-size="15">Best fit:</text><text x="28" y="320" fill="#eef7ff" font-size="15">large grid · streaming memory</text><text x="28" y="345" fill="#eef7ff" font-size="15">simple per-thread state</text></g><g transform="translate(645 165)"><rect width="480" height="365" rx="23" fill="#13283c" stroke="#70e6ff" stroke-width="3"/><text x="28" y="43" fill="#70e6ff" font-size="20" font-weight="700">ILP PATH</text><text x="28" y="80" fill="#d9e7f5" font-size="16">more independent work per thread</text><g transform="translate(55 125)" stroke="#70e6ff" stroke-width="8" fill="none"><path d="M0 0H310"/><path d="M0 45H250"/><path d="M0 90H360"/><path d="M0 135H285"/></g><g transform="translate(355 118)" fill="#70e6ff"><circle cx="25" cy="10" r="12"/><circle cx="25" cy="55" r="12"/><circle cx="25" cy="100" r="12"/><circle cx="25" cy="145" r="12"/></g><text x="28" y="290" fill="#9aacbf" font-size="15">Best fit:</text><text x="28" y="320" fill="#eef7ff" font-size="15">long loop · addresses / partials</text><text x="28" y="345" fill="#eef7ff" font-size="15">load-use dependency</text></g><text x="600" y="607" text-anchor="middle" fill="#eef7ff" font-size="20" font-weight="700">Occupancy 下降并不自动变慢；ILP 上升也不自动抵消 residency cliff。</text></g></svg>
