<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Large optimization boundary versus monolithic kernel</title><desc id="desc">A dataflow rewrite first deletes materialization and redundant control, then chooses among epilogue fusion, combined library kernels, or persistent execution.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#b8ff5b"/></marker></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/><g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">先扩大思考边界，再选择物理实现</text><text x="65" y="104" fill="#9aacbf" font-size="16">MegaKernel 是 dataflow 设计问题，不是“文件里只能有一个 __global__”。</text><g transform="translate(90 165)" text-anchor="middle"><rect width="1020" height="130" rx="22" fill="#172334" stroke="#70e6ff" stroke-width="3"/><text x="510" y="42" fill="#70e6ff" font-size="20" font-weight="700">STEP 1 · DATAFLOW REWRITE</text><g transform="translate(60 68)" font-size="15"><rect width="240" height="42" rx="10" fill="#24303f"/><text x="120" y="27" fill="#eef7ff">delete materialization</text><g transform="translate(330)"><rect width="240" height="42" rx="10" fill="#24303f"/><text x="120" y="27" fill="#eef7ff">write consumer layout</text></g><g transform="translate(660)"><rect width="240" height="42" rx="10" fill="#24303f"/><text x="120" y="27" fill="#eef7ff">move the wait later</text></g></g></g><path d="M600 295V365" stroke="#b8ff5b" stroke-width="6" marker-end="url(#a)"/><text x="600" y="347" text-anchor="middle" fill="#b8ff5b" font-size="16">then choose</text><g transform="translate(90 395)" text-anchor="middle" font-size="16"><g><rect width="300" height="130" rx="20" fill="#13283c" stroke="#70e6ff" stroke-width="3"/><text x="150" y="43" fill="#70e6ff" font-weight="700">EPILOGUE FUSION</text><text x="150" y="75" fill="#d9e7f5" font-size="14">producer writes final layout</text><text x="150" y="101" fill="#9aacbf" font-size="13">may remain two GEMMs</text></g><g transform="translate(360)"><rect width="300" height="130" rx="20" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="150" y="43" fill="#b8ff5b" font-weight="700">COMBINED LIBRARY KERNEL</text><text x="150" y="75" fill="#d9e7f5" font-size="14">one launch / shared metadata</text><text x="150" y="101" fill="#9aacbf" font-size="13">narrow stable primitive</text></g><g transform="translate(720)"><rect width="300" height="130" rx="20" fill="#34271b" stroke="#ffb15c" stroke-width="3"/><text x="150" y="43" fill="#ffb15c" font-weight="700">PERSISTENT EXECUTOR</text><text x="150" y="75" fill="#d9e7f5" font-size="14">tile tasks / events / pages</text><text x="150" y="101" fill="#9aacbf" font-size="13">only when complexity pays</text></g></g><text x="600" y="605" text-anchor="middle" fill="#eef7ff" font-size="20" font-weight="700">更大的边界可以由多个高效 kernel 表达；不要为了“一个”而牺牲资源形态。</text></g></svg>
