<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Multidimensional kernel winner oracle</title><desc id="desc">A candidate is selected by operation, phase, local shape, ABI, execution mode, backend, and GPU rather than operation name alone.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/>
  <g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="67" fill="#eef7ff" font-size="30" font-weight="700">“Winner” 必须绑定完整执行坐标</text><text x="65" y="103" fill="#9aacbf" font-size="16">只用 op name 选择 kernel，会把不同 phase、shape、ABI 和执行模式混在一起。</text>
    <g transform="translate(65 150)" font-size="17" text-anchor="middle">
      <g><rect width="150" height="90" rx="16" fill="#13283c" stroke="#70e6ff" stroke-width="2"/><text x="75" y="37" fill="#70e6ff" font-weight="700">OP</text><text x="75" y="66" fill="#d9e7f5" font-size="14">o_proj</text></g>
      <g transform="translate(165)"><rect width="150" height="90" rx="16" fill="#182d24" stroke="#b8ff5b" stroke-width="2"/><text x="75" y="37" fill="#b8ff5b" font-weight="700">PHASE</text><text x="75" y="66" fill="#d9e7f5" font-size="14">decode</text></g>
      <g transform="translate(330)"><rect width="150" height="90" rx="16" fill="#24243a" stroke="#b699ff" stroke-width="2"/><text x="75" y="37" fill="#b699ff" font-weight="700">LOCAL M</text><text x="75" y="66" fill="#d9e7f5" font-size="14">16 / 32</text></g>
      <g transform="translate(495)"><rect width="150" height="90" rx="16" fill="#34271b" stroke="#ffb15c" stroke-width="2"/><text x="75" y="37" fill="#ffb15c" font-weight="700">N / K</text><text x="75" y="66" fill="#d9e7f5" font-size="14">exact dims</text></g>
      <g transform="translate(660)"><rect width="150" height="90" rx="16" fill="#13283c" stroke="#70e6ff" stroke-width="2"/><text x="75" y="37" fill="#70e6ff" font-weight="700">ABI</text><text x="75" y="66" fill="#d9e7f5" font-size="14">packed UE8M0</text></g>
      <g transform="translate(825)"><rect width="150" height="90" rx="16" fill="#182d24" stroke="#b8ff5b" stroke-width="2"/><text x="75" y="37" fill="#b8ff5b" font-weight="700">MODE</text><text x="75" y="66" fill="#d9e7f5" font-size="14">CUDA Graph</text></g>
      <g transform="translate(990)"><rect width="80" height="90" rx="16" fill="#24243a" stroke="#b699ff" stroke-width="2"/><text x="40" y="37" fill="#b699ff" font-weight="700">GPU</text><text x="40" y="66" fill="#d9e7f5" font-size="14">B300</text></g>
    </g>
    <g transform="translate(120 320)"><text x="0" y="0" fill="#9aacbf" font-size="16">错误的 registry</text><rect x="0" y="25" width="380" height="90" rx="18" fill="#2b2020" stroke="#ff927f" stroke-width="3"/><text x="190" y="61" text-anchor="middle" fill="#ff927f" font-size="21" font-weight="700">winner["o_proj"]</text><text x="190" y="91" text-anchor="middle" fill="#d9e7f5" font-size="14">范围过宽，静默接管错误 workload</text></g>
    <g transform="translate(660 320)"><text x="0" y="0" fill="#9aacbf" font-size="16">可证伪的 registry</text><rect x="0" y="25" width="420" height="90" rx="18" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="210" y="61" text-anchor="middle" fill="#b8ff5b" font-size="20" font-weight="700">lookup(full coordinate)</text><text x="210" y="91" text-anchor="middle" fill="#d9e7f5" font-size="14">exact hit · explicit miss · fail closed</text></g>
    <path d="M500 390H635" stroke="#b8ff5b" stroke-width="6"/><polygon points="650,390 626,378 626,402" fill="#b8ff5b"/>
    <rect x="245" y="515" width="710" height="84" rx="18" fill="#121b29" stroke="#70e6ff" stroke-width="2"/><text x="600" y="552" text-anchor="middle" fill="#eef7ff" font-size="20" font-weight="700">candidate = f(op, phase, M, N, K, dtype, ABI, mode, backend, arch)</text><text x="600" y="580" text-anchor="middle" fill="#9aacbf" font-size="14">坐标之外走 stock；坐标之内的错误必须可见。</text>
  </g>
</svg>
