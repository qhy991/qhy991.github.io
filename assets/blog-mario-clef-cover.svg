<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Mario × Clef: a 9B decision model running on Apple Silicon through ApxInf Metal</title>
  <desc id="desc">Technical note by Haiyan Qin on running the Clef decision model natively on Metal for a Super Mario demo, with one-command setup and measured numbers.</desc>
  <rect width="1200" height="675" fill="#f3f6fa"/>
  <path d="M75 75h1050M75 580h1050" stroke="#ced9e6"/>
  <text x="75" y="125" fill="#234e86" font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing="3">APXINF METAL / APPLE SILICON</text>
  <g font-family="Georgia,Times New Roman,serif" font-weight="400">
    <text x="70" y="250" fill="#234e86" font-size="76" letter-spacing="-2">Mario × Clef</text>
    <g fill="#1c2735" font-size="51" letter-spacing="-1"><text x="75" y="330">A 9B decision model on Metal,</text><text x="75" y="397">one command from zero</text></g>
  </g>
  <text x="75" y="486" fill="#63718a" font-family="Arial,Helvetica,sans-serif" font-size="21">Three visual questions per step. No cloud, no keys.</text>
  <g font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="1">
    <rect x="75" y="515" width="150" height="38" rx="4" fill="#e3ebf5" stroke="#c2d2e6"/>
    <text x="150" y="539" fill="#33465f" text-anchor="middle">3 CROPS</text>
    <path d="M240 534h55" stroke="#8aa4c2" stroke-width="2"/>
    <path d="M289 529l9 5-9 5z" fill="#8aa4c2"/>
    <rect x="315" y="515" width="250" height="38" rx="4" fill="#e3ebf5" stroke="#c2d2e6"/>
    <text x="440" y="539" fill="#33465f" text-anchor="middle">APXINF-DECIDE-SERVER</text>
    <path d="M580 534h55" stroke="#8aa4c2" stroke-width="2"/>
    <path d="M629 529l9 5-9 5z" fill="#8aa4c2"/>
    <rect x="655" y="515" width="190" height="38" rx="4" fill="#e3ebf5" stroke="#c2d2e6"/>
    <text x="750" y="539" fill="#33465f" text-anchor="middle">3 NOUL PROBABILITIES</text>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" fill="#6c7785" font-size="17"><text x="75" y="625">Haiyan Qin · Beihang University</text><text x="1125" y="625" text-anchor="end">qhy991.github.io</text></g>
</svg>
