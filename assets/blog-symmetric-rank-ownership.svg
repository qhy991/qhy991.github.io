<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">TP2 symmetric memory rank ownership</title><desc id="desc">Push-all publishes duplicate payloads to both symmetric buffers, while source-owned pull keeps only the copies actually consumed. The isolated boundary improves strongly but full TP2 improves only slightly.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b10"/><stop offset="1" stop-color="#111c30"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1024" height="1024" fill="url(#bg)"/><g opacity=".12" stroke="#8fa2bd"><path d="M0 170H1024M0 340H1024M0 510H1024M0 680H1024M0 850H1024"/><path d="M170 0V1024M340 0V1024M510 0V1024M680 0V1024M850 0V1024"/></g><g font-family="Inter,Arial,'PingFang SC',sans-serif" text-anchor="middle"><text x="512" y="72" fill="#eef7ff" font-size="36" font-weight="700">OWN THE BYTES YOU PUBLISH</text><text x="512" y="108" fill="#8fa2bd" font-size="17" letter-spacing="2">TP2 · SYMMETRIC PULL · SLOW-RANK WALL</text><g transform="translate(85 170)" font-size="16"><g><rect width="260" height="150" rx="21" fill="#13283c" stroke="#70e6ff" stroke-width="3"/><text x="130" y="43" fill="#70e6ff" font-weight="700">RANK 0 INPUT</text><text x="130" y="80" fill="#eef7ff">payload 0</text><text x="130" y="112" fill="#9aacbf" font-size="13">source owner</text></g><g transform="translate(594)"><rect width="260" height="150" rx="21" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="130" y="43" fill="#b8ff5b" font-weight="700">RANK 1 INPUT</text><text x="130" y="80" fill="#eef7ff">payload 1</text><text x="130" y="112" fill="#9aacbf" font-size="13">source owner</text></g></g><g filter="url(#g)"><path d="M215 320C215 420 410 390 450 470" stroke="#70e6ff" stroke-width="6" fill="none"/><path d="M809 320C809 420 615 390 574 470" stroke="#b8ff5b" stroke-width="6" fill="none"/><rect x="360" y="470" width="304" height="180" rx="24" fill="#24243a" stroke="#b699ff" stroke-width="4"/><text x="512" y="513" fill="#b699ff" font-size="22" font-weight="700">SOURCE-OWNED SLOTS</text><text x="512" y="553" fill="#eef7ff" font-size="17">buffer0 ← payload0</text><text x="512" y="586" fill="#eef7ff" font-size="17">buffer1 ← payload1</text><text x="512" y="620" fill="#b8ff5b" font-size="15">delete 2 unused stores</text></g><path d="M512 650V730" stroke="#b8ff5b" stroke-width="9"/><polygon points="512,750 498,724 526,724" fill="#b8ff5b"/><rect x="150" y="760" width="724" height="140" rx="24" fill="#121b29" stroke="#b8ff5b" stroke-width="3"/><text x="310" y="808" fill="#8fa2bd" font-size="16">ISOLATED BOUNDARY</text><text x="310" y="850" fill="#b8ff5b" font-size="30" font-weight="700">−7.6775%</text><text x="705" y="808" fill="#8fa2bd" font-size="16">FULL TP2</text><text x="705" y="850" fill="#eef7ff" font-size="30" font-weight="700">+0.019912%</text><text x="512" y="960" fill="#ffb15c" font-size="23" font-weight="700">DELETE REDUNDANT OWNERSHIP BEFORE CHANGING TRANSPORT</text></g></svg>
