<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Internal two-graph evidence and missing same-epoch external comparison</title><desc id="desc">The internal rollback versus two-graph comparison has opposite-order wins and low drift, but the older SGLang board is from another epoch and cannot be used as the current denominator.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">STRONG INTERNAL A/B; MISSING CURRENT EXTERNAL ARM</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">Evidence level and denominator identity stay separate</text><g font-family="Arial, sans-serif"><g transform="translate(65 165)"><rect width="500" height="370" rx="24" fill="#183125" stroke="#a8ff60" stroke-width="3"/><text x="250" y="45" text-anchor="middle" fill="#a8ff60" font-size="24" font-weight="700">2026-07-28 INTERNAL</text><text x="55" y="105" fill="#eef7ff" font-size="18">Rollback</text><rect x="55" y="125" width="230" height="45" rx="11" fill="#56d8ff"/><text x="305" y="155" fill="#56d8ff" font-size="16">3078.559</text><text x="55" y="220" fill="#eef7ff" font-size="18">Two-graph</text><rect x="55" y="240" width="350" height="45" rx="11" fill="#a8ff60"/><text x="420" y="270" fill="#a8ff60" font-size="16">4654.812</text><text x="250" y="325" text-anchor="middle" fill="#a8ff60" font-size="25" font-weight="700">+51.20%</text><text x="250" y="355" text-anchor="middle" fill="#c9d5e5" font-size="15">pairs +50.25 / +51.70 · drift 0.54%</text></g><g transform="translate(635 165)"><rect width="500" height="370" rx="24" fill="#34271b" stroke="#ffb15c" stroke-width="3"/><text x="250" y="45" text-anchor="middle" fill="#ffb15c" font-size="24" font-weight="700">2026-07-26 EXTERNAL</text><text x="55" y="105" fill="#eef7ff" font-size="18">Old OMoE</text><rect x="55" y="125" width="180" height="45" rx="11" fill="#56d8ff"/><text x="250" y="155" fill="#56d8ff" font-size="16">2882.1</text><text x="55" y="220" fill="#eef7ff" font-size="18">Old SGLang</text><rect x="55" y="240" width="350" height="45" rx="11" fill="#ffad4d"/><text x="420" y="270" fill="#ffad4d" font-size="16">5579.2</text><text x="250" y="325" text-anchor="middle" fill="#ff927f" font-size="22" font-weight="700">DIFFERENT EPOCH / SEMANTICS</text><text x="250" y="355" text-anchor="middle" fill="#c9d5e5" font-size="15">cannot provide the new denominator</text></g><rect x="180" y="585" width="840" height="55" rx="15" fill="#24243a" stroke="#b699ff" stroke-width="2"/><text x="600" y="620" text-anchor="middle" fill="#b699ff" font-size="20" font-weight="700">NEXT: ROLLBACK · TWO-GRAPH · SGLANG IN ONE FRESH, MATCHED BOARD</text></g></svg>
