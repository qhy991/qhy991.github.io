<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Workload matrix for kernel winner migration</title><desc id="desc">A candidate must bind model, request decomposition, KV, parallelism, execution mode, path identity, timing and evidence rather than a broad 64K or decode label.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/><g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">Winner 的有效范围是一张多维 Workload Matrix</text><text x="65" y="104" fill="#9aacbf" font-size="16">任何一个轴变化，都可能改变 path、bottleneck、numerics 或 scheduler。</text><g transform="translate(65 150)" font-size="15" text-anchor="middle"><g><rect width="250" height="165" rx="20" fill="#13283c" stroke="#70e6ff" stroke-width="3"/><text x="125" y="38" fill="#70e6ff" font-size="18" font-weight="700">REQUEST</text><text x="125" y="75" fill="#eef7ff">cached / new / output</text><text x="125" y="106" fill="#d9e7f5">global / local batch</text><text x="125" y="136" fill="#9aacbf">cold · incremental · decode</text></g><g transform="translate(270)"><rect width="250" height="165" rx="20" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="125" y="38" fill="#b8ff5b" font-size="18" font-weight="700">KV / PARALLEL</text><text x="125" y="75" fill="#eef7ff">length distribution · page</text><text x="125" y="106" fill="#d9e7f5">TP / DP / EP / CP</text><text x="125" y="136" fill="#9aacbf">rank mapping · backend</text></g><g transform="translate(540)"><rect width="250" height="165" rx="20" fill="#24243a" stroke="#b699ff" stroke-width="3"/><text x="125" y="38" fill="#b699ff" font-size="18" font-weight="700">PATH IDENTITY</text><text x="125" y="75" fill="#eef7ff">op · M/N/K · dtype</text><text x="125" y="106" fill="#d9e7f5">scale ABI · layout</text><text x="125" y="136" fill="#9aacbf">hit / miss / fallback</text></g><g transform="translate(810)"><rect width="250" height="165" rx="20" fill="#34271b" stroke="#ffb15c" stroke-width="3"/><text x="125" y="38" fill="#ffb15c" font-size="18" font-weight="700">EXECUTION</text><text x="125" y="75" fill="#eef7ff">eager / graph / bucket</text><text x="125" y="106" fill="#d9e7f5">streams · scheduler</text><text x="125" y="136" fill="#9aacbf">toolchain · arch</text></g><g transform="translate(135 225)"><rect width="330" height="165" rx="20" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="165" y="38" fill="#b8ff5b" font-size="18" font-weight="700">TIMING</text><text x="165" y="75" fill="#eef7ff">TTFT / TPOT / wall</text><text x="165" y="106" fill="#d9e7f5">samples · pair order</text><text x="165" y="136" fill="#9aacbf">no-profiler authority</text></g><g transform="translate(565 225)"><rect width="330" height="165" rx="20" fill="#13283c" stroke="#70e6ff" stroke-width="3"/><text x="165" y="38" fill="#70e6ff" font-size="18" font-weight="700">EVIDENCE</text><text x="165" y="75" fill="#eef7ff">operator · model · HTTP</text><text x="165" y="106" fill="#d9e7f5">tokens · state · profile</text><text x="165" y="136" fill="#9aacbf">raw · replay · gap</text></g></g><text x="600" y="615" text-anchor="middle" fill="#eef7ff" font-size="20" font-weight="700">“支持 64K”不是合同；完整 cell 才是可比较的事实。</text></g></svg>
