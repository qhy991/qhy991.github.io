<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Phase fusion can extend the critical dependency window</title><desc id="desc">The original batch decode starts QK as soon as K is ready, while the fused phase waits for both K and V, reducing barrier count but delaying useful computation.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/><g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">少一个 Barrier，不等于更早开始 Useful Work</text><text x="65" y="104" fill="#9aacbf" font-size="16">Batch decode 的 phase fusion 推迟了 QK 的最早开始时刻。</text><g transform="translate(80 165)"><text x="0" y="0" fill="#b8ff5b" font-size="20" font-weight="700">BEFORE · SPLIT PHASES</text><line x1="0" y1="80" x2="1000" y2="80" stroke="#405064" stroke-width="4"/><rect x="0" y="48" width="220" height="64" rx="12" fill="#13283c" stroke="#70e6ff" stroke-width="2"/><text x="110" y="86" text-anchor="middle" fill="#eef7ff" font-size="16">load K</text><rect x="220" y="48" width="310" height="64" rx="12" fill="#182d24" stroke="#b8ff5b" stroke-width="2"/><text x="375" y="86" text-anchor="middle" fill="#eef7ff" font-size="16">QK compute starts</text><rect x="220" y="127" width="420" height="44" rx="10" fill="#24243a" stroke="#b699ff"/><text x="430" y="155" text-anchor="middle" fill="#eef7ff" font-size="14">V continues loading in parallel</text><rect x="640" y="48" width="260" height="64" rx="12" fill="#34271b" stroke="#ffb15c"/><text x="770" y="86" text-anchor="middle" fill="#eef7ff" font-size="16">state / value update</text><text x="220" y="34" fill="#b8ff5b" font-size="14">K ready</text></g><g transform="translate(80 390)"><text x="0" y="0" fill="#ff927f" font-size="20" font-weight="700">AFTER · FUSED PHASE</text><line x1="0" y1="80" x2="1000" y2="80" stroke="#405064" stroke-width="4"/><rect x="0" y="48" width="390" height="64" rx="12" fill="#2b2020" stroke="#ff927f" stroke-width="2"/><text x="195" y="86" text-anchor="middle" fill="#eef7ff" font-size="16">wait for K + V</text><rect x="390" y="48" width="510" height="64" rx="12" fill="#34271b" stroke="#ffb15c" stroke-width="2"/><text x="645" y="86" text-anchor="middle" fill="#eef7ff" font-size="16">QK + state/value fused work</text><text x="220" y="34" fill="#9aacbf" font-size="14">K ready, but QK cannot start</text><text x="390" y="34" fill="#ff927f" font-size="14">V ready</text><path d="M220 125V160H390V125" fill="none" stroke="#ff927f" stroke-width="3"/><text x="305" y="187" text-anchor="middle" fill="#ff927f" font-size="15">dependency extension</text></g><text x="600" y="625" text-anchor="middle" fill="#eef7ff" font-size="20" font-weight="700">优化目标是缩短完整 envelope，而不是最小化同步指令数量。</text></g></svg>
