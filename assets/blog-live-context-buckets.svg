<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">Masking is not pruning</title><desc id="desc">A full K2048 decode graph masks a long unused KV tail, while a K256 graph physically slices the attention workload and preserves a full fallback.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b10"/><stop offset="1" stop-color="#111c30"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1024" height="1024" fill="url(#bg)"/><g opacity=".12" stroke="#8fa2bd"><path d="M0 170H1024M0 340H1024M0 510H1024M0 680H1024M0 850H1024"/><path d="M170 0V1024M340 0V1024M510 0V1024M680 0V1024M850 0V1024"/></g><g font-family="Inter,Arial,'PingFang SC',sans-serif" text-anchor="middle"><text x="512" y="72" fill="#eef7ff" font-size="38" font-weight="700">MASKING IS NOT PRUNING</text><text x="512" y="110" fill="#8fa2bd" font-size="17" letter-spacing="2">LIVE CONTEXT · KV EXTENT · CUDA GRAPH BUCKETS</text><g transform="translate(105 180)"><rect width="814" height="200" rx="25" fill="#361c21" stroke="#ff927f" stroke-width="3"/><text x="407" y="43" fill="#ff927f" font-size="23" font-weight="700">FULL K2048 GRAPH</text><rect x="50" y="80" width="714" height="62" rx="15" fill="#2b3b4f"/><rect x="50" y="80" width="88" height="62" rx="15" fill="#56d8ff"/><text x="94" y="119" fill="#102012" font-size="16" font-weight="700">190</text><text x="450" y="119" fill="#9aacbf" font-size="18" font-weight="700">MASKED TAIL STILL IN SHAPE</text><text x="407" y="175" fill="#eef7ff" font-size="17">correct output · excess load / score / reduction</text></g><path d="M512 395V465" stroke="#b699ff" stroke-width="8"/><polygon points="512,485 498,459 526,459" fill="#b699ff"/><g transform="translate(105 490)"><rect width="814" height="195" rx="25" fill="#183125" stroke="#b8ff5b" stroke-width="3"/><text x="407" y="43" fill="#b8ff5b" font-size="23" font-weight="700">K256 BUCKET GRAPH</text><rect x="50" y="80" width="714" height="62" rx="15" fill="#2b3b4f"/><rect x="50" y="80" width="714" height="62" rx="15" fill="#a8ff60"/><text x="407" y="119" fill="#102012" font-size="18" font-weight="700">ONLY THE 256-POSITION EXTENT ENTERS ATTENTION</text><text x="407" y="172" fill="#eef7ff" font-size="17">same valid math · less physical work</text></g><g filter="url(#g)"><rect x="170" y="780" width="684" height="110" rx="25" fill="#183125" stroke="#b8ff5b" stroke-width="4"/><text x="512" y="824" fill="#b8ff5b" font-size="26" font-weight="700">2803.6 → 3191.3 tok/s</text><text x="512" y="862" fill="#eef7ff" font-size="18">+13.83% C16 Serving</text></g><text x="512" y="956" fill="#ffb15c" font-size="20" font-weight="700">FULL-MAX GRAPH REMAINS THE ALWAYS-VALID FALLBACK</text></g></svg>
