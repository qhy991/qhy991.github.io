<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Symmetric communication boundary outcomes</title><desc id="desc">Source-owned symmetric pull is a tiny end-to-end win, while direct symmetric producer output, third-stream overlap, and alternate all-reduce geometry fail performance or correctness.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/><g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">删除 Copy、改 Transport、加 Stream：不是同一种优化</text><text x="65" y="104" fill="#9aacbf" font-size="16">Ownership、数值协议和资源竞争分别决定结果。</text><g transform="translate(65 155)" font-size="15"><g><rect width="250" height="390" rx="21" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="24" y="42" fill="#b8ff5b" font-size="18" font-weight="700">D064 SYMMETRIC PULL</text><text x="24" y="78" fill="#d9e7f5">delete unused stores</text><text x="24" y="118" fill="#9aacbf">Isolated</text><text x="24" y="150" fill="#eef7ff" font-size="25" font-weight="700">−7.6775%</text><text x="24" y="194" fill="#9aacbf">TP2 E2E</text><text x="24" y="226" fill="#b8ff5b" font-size="24" font-weight="700">+0.019912%</text><line x1="24" y1="260" x2="226" y2="260" stroke="#40564a"/><text x="24" y="302" fill="#d9e7f5">5/5 · exact</text><text x="24" y="336" fill="#d9e7f5">EXPERIMENTAL WIN</text></g><g transform="translate(270)"><rect width="250" height="390" rx="21" fill="#2b2020" stroke="#ff927f" stroke-width="3"/><text x="24" y="42" fill="#ff927f" font-size="18" font-weight="700">DIRECT SYMMETRIC</text><text x="24" y="78" fill="#d9e7f5">GEMM output → special store</text><text x="24" y="118" fill="#9aacbf">P2P</text><text x="24" y="150" fill="#ff927f" font-size="25" font-weight="700">+71.1% slower</text><text x="24" y="194" fill="#9aacbf">MNNVL</text><text x="24" y="226" fill="#ff927f" font-size="24" font-weight="700">+103.5%</text><line x1="24" y1="260" x2="226" y2="260" stroke="#604040"/><text x="24" y="302" fill="#d9e7f5">MNNVL non-exact</text><text x="24" y="336" fill="#d9e7f5">REJECT</text></g><g transform="translate(540)"><rect width="250" height="390" rx="21" fill="#34271b" stroke="#ffb15c" stroke-width="3"/><text x="24" y="42" fill="#ffb15c" font-size="18" font-weight="700">THIRD STREAM</text><text x="24" y="78" fill="#d9e7f5">logical independent branch</text><text x="24" y="118" fill="#9aacbf">Joined boundary</text><text x="24" y="150" fill="#ffb15c" font-size="25" font-weight="700">+1.438 μs</text><text x="24" y="194" fill="#9aacbf">Graph projection</text><text x="24" y="226" fill="#ff927f" font-size="24" font-weight="700">−8.836 ms</text><line x1="24" y1="260" x2="226" y2="260" stroke="#60492f"/><text x="24" y="302" fill="#d9e7f5">resource contention</text><text x="24" y="336" fill="#d9e7f5">STOP OPERATOR</text></g><g transform="translate(810)"><rect width="250" height="390" rx="21" fill="#2b2020" stroke="#ff927f" stroke-width="3"/><text x="24" y="42" fill="#ff927f" font-size="18" font-weight="700">ALLREDUCE 192×2</text><text x="24" y="78" fill="#d9e7f5">new reduction geometry</text><text x="24" y="118" fill="#9aacbf">Operator</text><text x="24" y="150" fill="#eef7ff" font-size="25" font-weight="700">−13.25%</text><text x="24" y="194" fill="#9aacbf">Model gate</text><text x="24" y="226" fill="#ff927f" font-size="24" font-weight="700">token mismatch</text><line x1="24" y1="260" x2="226" y2="260" stroke="#604040"/><text x="24" y="302" fill="#d9e7f5">timing not started</text><text x="24" y="336" fill="#d9e7f5">REJECT CORRECTNESS</text></g></g><text x="600" y="607" text-anchor="middle" fill="#eef7ff" font-size="20" font-weight="700">通信优化必须同时通过 ownership、transport semantics、slow-rank wall 与 token gate。</text></g></svg>
