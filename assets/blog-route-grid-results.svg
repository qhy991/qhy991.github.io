<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Four-cell operator verdict for exact route-grid bounds</title><desc id="desc">Exact 84 and 90 row bounds win zero of thirty blocks on both ranks and both route profiles; TP0 regresses beyond A/A while TP1 shows no gain within its envelope.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">67% FEWER NOMINAL ROWS; ZERO OPERATOR WINS</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">30 randomized blocks × 100 CUDA Graph replays per cell</text><g font-family="Arial, sans-serif"><g transform="translate(65 165)"><rect width="520" height="165" rx="22" fill="#361c21" stroke="#ff927f" stroke-width="3"/><text x="35" y="42" fill="#ff927f" font-size="22" font-weight="700">LAYER0 · TP0 · 84 ROWS</text><text x="35" y="85" fill="#eef7ff" font-size="18">76.292 → 77.782 μs</text><text x="35" y="122" fill="#ff927f" font-size="26" font-weight="700">+1.9519% · 0/30</text><text x="480" y="122" text-anchor="end" fill="#ff927f" font-size="16">BEYOND A/A</text></g><g transform="translate(615 165)"><rect width="520" height="165" rx="22" fill="#14263b" stroke="#56d8ff" stroke-width="3"/><text x="35" y="42" fill="#56d8ff" font-size="22" font-weight="700">LAYER0 · TP1 · 84 ROWS</text><text x="35" y="85" fill="#eef7ff" font-size="18">77.948 → 78.110 μs</text><text x="35" y="122" fill="#56d8ff" font-size="26" font-weight="700">+0.2077% · 0/30</text><text x="480" y="122" text-anchor="end" fill="#56d8ff" font-size="16">INSIDE A/A</text></g><g transform="translate(65 365)"><rect width="520" height="165" rx="22" fill="#361c21" stroke="#ff927f" stroke-width="3"/><text x="35" y="42" fill="#ff927f" font-size="22" font-weight="700">MIN-HHI · TP0 · 90 ROWS</text><text x="35" y="85" fill="#eef7ff" font-size="18">84.757 → 85.676 μs</text><text x="35" y="122" fill="#ff927f" font-size="26" font-weight="700">+1.0847% · 0/30</text><text x="480" y="122" text-anchor="end" fill="#ff927f" font-size="16">BEYOND A/A</text></g><g transform="translate(615 365)"><rect width="520" height="165" rx="22" fill="#14263b" stroke="#56d8ff" stroke-width="3"/><text x="35" y="42" fill="#56d8ff" font-size="22" font-weight="700">MIN-HHI · TP1 · 90 ROWS</text><text x="35" y="85" fill="#eef7ff" font-size="18">85.633 → 85.888 μs</text><text x="35" y="122" fill="#56d8ff" font-size="26" font-weight="700">+0.2975% · 0/30</text><text x="480" y="122" text-anchor="end" fill="#56d8ff" font-size="16">INSIDE A/A</text></g><rect x="250" y="580" width="700" height="55" rx="15" fill="#183125" stroke="#a8ff60" stroke-width="2"/><text x="600" y="615" text-anchor="middle" fill="#a8ff60" font-size="20" font-weight="700">TP0: CLEAR REGRESSION · TP1: NO MEASURABLE GAIN</text></g></svg>
