<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Release acquire publication and retirement protocol</title><desc id="desc">The producer writes payload before release publishing a ready epoch. The consumer acquire-claims the slot, reads payload, and release-retires it before the next epoch reuses storage.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#70e6ff"/></marker></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/><g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">Ready Publication 必须形成完整 Happens-Before</text><text x="65" y="104" fill="#9aacbf" font-size="16">flag、payload、epoch 和 storage reuse 是同一协议。</text><g transform="translate(85 165)"><text x="0" y="0" fill="#70e6ff" font-size="20" font-weight="700">PRODUCER</text><text x="930" y="0" fill="#b8ff5b" font-size="20" font-weight="700">CONSUMER</text><line x1="0" y1="45" x2="0" y2="400" stroke="#70e6ff" stroke-width="3"/><line x1="980" y1="45" x2="980" y2="400" stroke="#b8ff5b" stroke-width="3"/><g transform="translate(0 65)"><rect width="290" height="64" rx="13" fill="#13283c" stroke="#70e6ff"/><text x="145" y="39" text-anchor="middle" fill="#eef7ff" font-size="16">write payload / descriptor</text></g><path d="M290 97H690" stroke="#70e6ff" stroke-width="4"/><g transform="translate(0 165)"><rect width="290" height="64" rx="13" fill="#182d24" stroke="#b8ff5b"/><text x="145" y="39" text-anchor="middle" fill="#b8ff5b" font-size="16">release READY(epoch=8)</text></g><path d="M290 197H930" stroke="#b8ff5b" stroke-width="5" marker-end="url(#a)"/><g transform="translate(690 240)"><rect width="290" height="64" rx="13" fill="#182d24" stroke="#b8ff5b"/><text x="145" y="39" text-anchor="middle" fill="#eef7ff" font-size="16">acquire + claim epoch 8</text></g><path d="M690 272H350" stroke="#b8ff5b" stroke-width="4"/><g transform="translate(690 330)"><rect width="290" height="64" rx="13" fill="#13283c" stroke="#70e6ff"/><text x="145" y="39" text-anchor="middle" fill="#eef7ff" font-size="16">read payload / compute</text></g><path d="M690 362H350" stroke="#70e6ff" stroke-width="4"/><g transform="translate(330 425)"><rect width="320" height="66" rx="13" fill="#34271b" stroke="#ffb15c"/><text x="160" y="40" text-anchor="middle" fill="#ffb15c" font-size="16">release DONE → safe slot reuse</text></g></g><g transform="translate(85 560)"><rect width="1030" height="62" rx="14" fill="#2b2020" stroke="#ff927f" stroke-width="2"/><text x="515" y="38" text-anchor="middle" fill="#eef7ff" font-size="17">ready=1 without release/acquire can expose stale payload; slot index without epoch can trigger ABA.</text></g></g></svg>
