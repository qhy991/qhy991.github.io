<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">KV split count determines the softmax partial reduction tree</title><desc id="desc">One and two splits produce different numerical trees, while four-split CGA and GMEM share the exact tree but use different communication carriers.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">SPLIT COUNT CHANGES THE TREE; CARRIER CHANGES THE COST</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">Each leaf is a softmax partial (m, l, o)</text><g font-family="Arial, sans-serif" text-anchor="middle"><g transform="translate(70 165)"><rect width="300" height="380" rx="22" fill="#361c21" stroke="#ff927f" stroke-width="3"/><text x="150" y="42" fill="#ff927f" font-size="23" font-weight="700">1 / 2 SPLITS</text><rect x="35" y="85" width="100" height="52" rx="12" fill="#14263b"/><rect x="165" y="85" width="100" height="52" rx="12" fill="#14263b"/><text x="85" y="117" fill="#56d8ff" font-size="16">partial 0</text><text x="215" y="117" fill="#56d8ff" font-size="16">partial 1</text><path d="M85 137L150 210M215 137L150 210" stroke="#ff927f" stroke-width="4"/><rect x="90" y="210" width="120" height="58" rx="14" fill="#361c21" stroke="#ff927f" stroke-width="2"/><text x="150" y="246" fill="#ff927f" font-size="17" font-weight="700">NEW MERGE</text><text x="150" y="310" fill="#eef7ff" font-size="17">different partitions</text><text x="150" y="340" fill="#eef7ff" font-size="17">different rescale</text><text x="150" y="370" fill="#ff927f" font-size="18" font-weight="700">NON-EXACT</text></g><g transform="translate(450 165)"><rect width="300" height="380" rx="22" fill="#183125" stroke="#a8ff60" stroke-width="3"/><text x="150" y="42" fill="#a8ff60" font-size="23" font-weight="700">CGA4</text><g fill="#14263b"><rect x="20" y="85" width="55" height="45" rx="10"/><rect x="88" y="85" width="55" height="45" rx="10"/><rect x="156" y="85" width="55" height="45" rx="10"/><rect x="224" y="85" width="55" height="45" rx="10"/></g><g stroke="#a8ff60" stroke-width="3"><path d="M48 130L90 190M116 130L90 190M184 130L210 190M252 130L210 190M90 215L150 270M210 215L150 270"/></g><rect x="55" y="185" width="70" height="35" rx="9" fill="#183125" stroke="#a8ff60"/><rect x="175" y="185" width="70" height="35" rx="9" fill="#183125" stroke="#a8ff60"/><rect x="85" y="270" width="130" height="48" rx="12" fill="#183125" stroke="#a8ff60" stroke-width="2"/><text x="150" y="300" fill="#a8ff60" font-size="15" font-weight="700">EXACT TREE</text><text x="150" y="347" fill="#eef7ff" font-size="17">cluster SMEM</text><text x="150" y="376" fill="#a8ff60" font-size="18" font-weight="700">BASELINE</text></g><g transform="translate(830 165)"><rect width="300" height="380" rx="22" fill="#3b291a" stroke="#ffad4d" stroke-width="3"/><text x="150" y="42" fill="#ffad4d" font-size="23" font-weight="700">GMEM4</text><g fill="#14263b"><rect x="20" y="85" width="55" height="45" rx="10"/><rect x="88" y="85" width="55" height="45" rx="10"/><rect x="156" y="85" width="55" height="45" rx="10"/><rect x="224" y="85" width="55" height="45" rx="10"/></g><path d="M48 130V185M116 130V185M184 130V185M252 130V185" stroke="#ffad4d" stroke-width="3"/><rect x="25" y="185" width="250" height="55" rx="12" fill="#3b291a" stroke="#ffad4d" stroke-width="2"/><text x="150" y="219" fill="#ffad4d" font-size="16" font-weight="700">GLOBAL SCRATCH + COUNTER</text><path d="M150 240V285" stroke="#ffad4d" stroke-width="3"/><rect x="85" y="285" width="130" height="48" rx="12" fill="#3b291a" stroke="#ffad4d" stroke-width="2"/><text x="150" y="315" fill="#ffad4d" font-size="15" font-weight="700">SAME TREE</text><text x="150" y="350" fill="#eef7ff" font-size="17">byte-exact</text><text x="150" y="378" fill="#ffad4d" font-size="18" font-weight="700">0/30 · SLOWER</text></g><text x="600" y="620" fill="#bc9cff" font-size="21" font-weight="700">NUMERICAL PROTOCOL = PARTITIONS + TREE + ROUNDING</text></g></svg>
