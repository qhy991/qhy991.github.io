<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">Register count, occupancy, and ILP cliffs</title><desc id="desc">RMSNorm gets faster when registers drop from 40 to 32 and occupancy doubles, while single decode gets faster when registers rise from 56 to 80 and ILP improves despite lower occupancy.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b10"/><stop offset="1" stop-color="#111c30"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1024" height="1024" fill="url(#bg)"/><g opacity=".12" stroke="#8fa2bd"><path d="M0 170H1024M0 340H1024M0 510H1024M0 680H1024M0 850H1024"/><path d="M170 0V1024M340 0V1024M510 0V1024M680 0V1024M850 0V1024"/></g><g font-family="Inter,Arial,'PingFang SC',sans-serif" text-anchor="middle"><text x="512" y="72" fill="#eef7ff" font-size="36" font-weight="700">REGISTERS CHANGE DIRECTION</text><text x="512" y="108" fill="#8fa2bd" font-size="17" letter-spacing="2">OCCUPANCY · ILP · SPILL · SHAPE</text><g transform="translate(75 175)"><rect width="390" height="250" rx="24" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="195" y="45" fill="#b8ff5b" font-size="22" font-weight="700">RMSNORM · OCCUPANCY</text><text x="195" y="85" fill="#eef7ff" font-size="18">40 → 32 registers</text><text x="195" y="122" fill="#d9e7f5" font-size="16">1 → 2 CTA / SM</text><text x="195" y="157" fill="#9aacbf" font-size="15">47.4% → 88.2% occupancy</text><text x="195" y="207" fill="#b8ff5b" font-size="32" font-weight="700">−29.77%</text><g transform="translate(484)"><rect width="390" height="250" rx="24" fill="#13283c" stroke="#70e6ff" stroke-width="3"/><text x="195" y="45" fill="#70e6ff" font-size="22" font-weight="700">SINGLE DECODE · ILP</text><text x="195" y="85" fill="#eef7ff" font-size="18">56 → 80 registers</text><text x="195" y="122" fill="#d9e7f5" font-size="16">38.0% → 24.9% occupancy</text><text x="195" y="157" fill="#9aacbf" font-size="15">8.53 → 5.66 cycles/instruction</text><text x="195" y="207" fill="#70e6ff" font-size="32" font-weight="700">−6.56%</text></g></g><g filter="url(#g)"><path d="M270 425C270 520 430 500 470 575" fill="none" stroke="#b8ff5b" stroke-width="6"/><path d="M754 425C754 520 594 500 554 575" fill="none" stroke="#70e6ff" stroke-width="6"/><rect x="325" y="575" width="374" height="180" rx="25" fill="#24243a" stroke="#b699ff" stroke-width="4"/><text x="512" y="625" fill="#b699ff" font-size="24" font-weight="700">SHAPE-SPECIFIC CONTRACT</text><text x="512" y="668" fill="#eef7ff" font-size="18">block · grid · live state · toolchain</text><text x="512" y="706" fill="#ffb15c" font-size="17">avoid residency cliff and spill</text></g><path d="M512 755V825" stroke="#b8ff5b" stroke-width="9"/><polygon points="512,845 498,819 526,819" fill="#b8ff5b"/><rect x="165" y="855" width="694" height="82" rx="20" fill="#121b29" stroke="#b8ff5b" stroke-width="3"/><text x="512" y="907" fill="#eef7ff" font-size="23" font-weight="700">TUNE THE RESOURCE SHAPE, NOT THE NUMBER</text><text x="512" y="970" fill="#ffb15c" font-size="20" font-weight="700">LESS CAN WIN · MORE CAN WIN · SPILL ALWAYS SENDS A BILL</text></g></svg>
