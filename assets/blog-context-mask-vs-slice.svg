<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Logical masking versus physical KV slicing</title><desc id="desc">A K2048 graph computes a large shape and masks invalid outputs, while a K256 bucket graph prevents the tail from entering the kernel at all.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">ZERO CONTRIBUTION DOES NOT MEAN ZERO EXECUTION</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">Live context ≈190 · captured maximum 2048</text><g font-family="Arial, sans-serif"><g transform="translate(65 165)"><rect width="500" height="390" rx="24" fill="#361c21" stroke="#ff927f" stroke-width="3"/><text x="250" y="45" text-anchor="middle" fill="#ff927f" font-size="24" font-weight="700">LOGICAL MASK</text><rect x="50" y="90" width="400" height="60" rx="14" fill="#2b3b4f"/><rect x="50" y="90" width="38" height="60" rx="14" fill="#56d8ff"/><text x="250" y="180" text-anchor="middle" fill="#eef7ff" font-size="18">shape = K2048</text><text x="250" y="220" text-anchor="middle" fill="#c9d5e5" font-size="16">tail score → −∞</text><text x="250" y="255" text-anchor="middle" fill="#c9d5e5" font-size="16">softmax contribution → 0</text><text x="250" y="315" text-anchor="middle" fill="#ff927f" font-size="21" font-weight="700">LOAD / SCORE / REDUCE MAY REMAIN</text></g><g transform="translate(635 165)"><rect width="500" height="390" rx="24" fill="#183125" stroke="#a8ff60" stroke-width="3"/><text x="250" y="45" text-anchor="middle" fill="#a8ff60" font-size="24" font-weight="700">PHYSICAL SLICE</text><rect x="50" y="90" width="400" height="60" rx="14" fill="#a8ff60"/><text x="250" y="180" text-anchor="middle" fill="#eef7ff" font-size="18">shape = K256</text><text x="250" y="220" text-anchor="middle" fill="#c9d5e5" font-size="16">tail excluded from tensor extent</text><text x="250" y="255" text-anchor="middle" fill="#c9d5e5" font-size="16">same valid positions / math</text><text x="250" y="315" text-anchor="middle" fill="#a8ff60" font-size="21" font-weight="700">PHYSICAL ATTENTION WORK SHRINKS</text></g><rect x="190" y="595" width="820" height="50" rx="14" fill="#24243a" stroke="#b699ff" stroke-width="2"/><text x="600" y="627" text-anchor="middle" fill="#b699ff" font-size="19" font-weight="700">PROVE MASK EQUIVALENCE FIRST; THEN CHANGE THE EXECUTION SHAPE</text></g></svg>
