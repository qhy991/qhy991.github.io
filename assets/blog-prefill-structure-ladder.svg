<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Structural prefill optimization ladder from serial loop to fused graph</title><desc id="desc">The largest gain comes from replacing the Python row loop with true batching, followed by graph capture and then a smaller fused SwiGLU gain.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">409→15.5 ms CONTAINS THREE DIFFERENT MECHANISMS</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">B16×T128 · lower is better</text><g font-family="Arial, sans-serif"><text x="65" y="205" fill="#c9d5e5" font-size="20">Per-row serial</text><rect x="300" y="173" width="800" height="52" rx="12" fill="#ff927f"/><text x="1120" y="207" fill="#ff927f" font-size="20" font-weight="700">409 ms</text><text x="65" y="315" fill="#c9d5e5" font-size="20">True batched eager</text><rect x="300" y="283" width="800" height="52" rx="12" fill="#233147"/><rect x="300" y="283" width="73" height="52" rx="12" fill="#70e6ff"/><text x="393" y="317" fill="#70e6ff" font-size="20" font-weight="700">37.4 ms</text><text x="65" y="425" fill="#c9d5e5" font-size="20">Whole-prefill Graph</text><rect x="300" y="393" width="800" height="52" rx="12" fill="#233147"/><rect x="300" y="393" width="35" height="52" rx="12" fill="#bc9cff"/><text x="355" y="427" fill="#bc9cff" font-size="20" font-weight="700">17.8 ms</text><text x="65" y="535" fill="#c9d5e5" font-size="20">+ fused SwiGLU</text><rect x="300" y="503" width="800" height="52" rx="12" fill="#233147"/><rect x="300" y="503" width="30" height="52" rx="12" fill="#a8ff60"/><text x="350" y="537" fill="#a8ff60" font-size="20" font-weight="700">15.5 ms</text><rect x="185" y="595" width="830" height="50" rx="14" fill="#34271b" stroke="#ffb15c" stroke-width="2"/><text x="600" y="627" text-anchor="middle" fill="#ffb15c" font-size="19" font-weight="700">LARGEST GAIN = FIX SERIAL EXECUTION, NOT A SINGLE KERNEL</text></g></svg>
