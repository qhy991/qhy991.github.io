<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">Two CUDA graphs for prefill and decode serving contracts</title><desc id="desc">Graph A captures singleton T64 admission and prefill, Graph B captures B16 K256 decode, with a fail-closed fallback for contract misses.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b10"/><stop offset="1" stop-color="#111c30"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1024" height="1024" fill="url(#bg)"/><g opacity=".12" stroke="#8fa2bd"><path d="M0 170H1024M0 340H1024M0 510H1024M0 680H1024M0 850H1024"/><path d="M170 0V1024M340 0V1024M510 0V1024M680 0V1024M850 0V1024"/></g><g font-family="Inter,Arial,'PingFang SC',sans-serif" text-anchor="middle"><text x="512" y="72" fill="#eef7ff" font-size="35" font-weight="700">ONE MODEL. TWO GRAPH CONTRACTS.</text><text x="512" y="110" fill="#8fa2bd" font-size="17" letter-spacing="2">PREFILL · DECODE · STATIC ADDRESS · DYNAMIC STATE</text><g transform="translate(100 180)"><rect width="365" height="250" rx="25" fill="#183125" stroke="#b8ff5b" stroke-width="3"/><text x="182" y="45" fill="#b8ff5b" font-size="24" font-weight="700">GRAPH A</text><text x="182" y="82" fill="#eef7ff" font-size="19">B1 · T64 PREFILL</text><g transform="translate(35 115)" font-size="16"><rect width="295" height="42" rx="11" fill="#183125" stroke="#b8ff5b"/><text x="147" y="27" fill="#b8ff5b">append-only padding</text><rect y="58" width="295" height="42" rx="11" fill="#183125" stroke="#b8ff5b"/><text x="147" y="85" fill="#b8ff5b">real-last logits + KV write</text></g></g><g transform="translate(559 180)"><rect width="365" height="250" rx="25" fill="#14263b" stroke="#70e6ff" stroke-width="3"/><text x="182" y="45" fill="#70e6ff" font-size="24" font-weight="700">GRAPH B</text><text x="182" y="82" fill="#eef7ff" font-size="19">B16 · K256 DECODE</text><g transform="translate(35 115)" font-size="16"><rect width="295" height="42" rx="11" fill="#14263b" stroke="#70e6ff"/><text x="147" y="27" fill="#70e6ff">device lengths + slots</text><rect y="58" width="295" height="42" rx="11" fill="#14263b" stroke="#70e6ff"/><text x="147" y="85" fill="#70e6ff">persistent KV replay</text></g></g><path d="M282 450V535M741 450V535" stroke="#b699ff" stroke-width="7"/><path d="M270 523L282 547 294 523ZM729 523L741 547 753 523Z" fill="#b699ff"/><g transform="translate(100 555)"><rect width="824" height="155" rx="25" fill="#24243a" stroke="#b699ff" stroke-width="3"/><text x="412" y="44" fill="#b699ff" font-size="23" font-weight="700">PHASE DISPATCHER</text><g transform="translate(45 78)" font-size="16" font-weight="700"><rect width="215" height="48" rx="12" fill="#183125" stroke="#b8ff5b"/><text x="107" y="31" fill="#b8ff5b">GRAPH A HIT</text><rect x="260" width="215" height="48" rx="12" fill="#14263b" stroke="#70e6ff"/><text x="367" y="31" fill="#70e6ff">GRAPH B HIT</text><rect x="520" width="215" height="48" rx="12" fill="#34271b" stroke="#ffb15c"/><text x="627" y="31" fill="#ffb15c">MISS → FALLBACK</text></g></g><g filter="url(#g)"><rect x="175" y="800" width="674" height="105" rx="24" fill="#183125" stroke="#b8ff5b" stroke-width="4"/><text x="512" y="842" fill="#b8ff5b" font-size="26" font-weight="700">3078.559 → 4654.812 tok/s</text><text x="512" y="878" fill="#eef7ff" font-size="18">+51.20% internal exact-scenario A/B</text></g><text x="512" y="965" fill="#ffb15c" font-size="19" font-weight="700">INTERNAL WIN ≠ CURRENT CROSS-SYSTEM RANKING</text></g></svg>
