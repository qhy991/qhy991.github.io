<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">FP8 is a role and M bucket policy</title><desc id="desc">Block-scaled DeepGEMM is enabled for large-M batched projections, only down projection for B1 prefill, and rowwise fallback elsewhere.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b10"/><stop offset="1" stop-color="#111c30"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1024" height="1024" fill="url(#bg)"/><g opacity=".12" stroke="#8fa2bd"><path d="M0 170H1024M0 340H1024M0 510H1024M0 680H1024M0 850H1024"/><path d="M170 0V1024M340 0V1024M510 0V1024M680 0V1024M850 0V1024"/></g><g font-family="Inter,Arial,'PingFang SC',sans-serif" text-anchor="middle"><text x="512" y="72" fill="#eef7ff" font-size="35" font-weight="700">FP8 IS A POLICY, NOT A SWITCH</text><text x="512" y="110" fill="#8fa2bd" font-size="17" letter-spacing="2">PHASE · M BUCKET · ROLE · SCALE · CONSUMER</text><g transform="translate(100 180)"><rect width="824" height="205" rx="25" fill="#183125" stroke="#b8ff5b" stroke-width="3"/><text x="412" y="43" fill="#b8ff5b" font-size="23" font-weight="700">BATCHED PREFILL · LARGE M</text><g transform="translate(45 82)" font-size="16" font-weight="700"><rect width="150" height="55" rx="13" fill="#183125" stroke="#b8ff5b"/><text x="75" y="35" fill="#b8ff5b">Q / K / V</text><rect x="175" width="150" height="55" rx="13" fill="#183125" stroke="#b8ff5b"/><text x="250" y="35" fill="#b8ff5b">O</text><rect x="350" width="170" height="55" rx="13" fill="#183125" stroke="#b8ff5b"/><text x="435" y="35" fill="#b8ff5b">GATE_UP</text><rect x="545" width="190" height="55" rx="13" fill="#183125" stroke="#b8ff5b"/><text x="640" y="35" fill="#b8ff5b">DOWN</text></g><text x="412" y="177" fill="#eef7ff" font-size="18">block-scaled DeepGEMM · 38.939 → 33.680 ms</text></g><g transform="translate(100 435)"><rect width="824" height="220" rx="25" fill="#24243a" stroke="#b699ff" stroke-width="3"/><text x="412" y="43" fill="#b699ff" font-size="23" font-weight="700">B1 PREFILL · ROLE SELECTOR</text><g transform="translate(45 82)" font-size="16" font-weight="700"><rect width="470" height="58" rx="14" fill="#14263b" stroke="#70e6ff"/><text x="235" y="36" fill="#70e6ff">Q / K / V / O / GATE_UP → ROWWISE</text><rect x="495" width="240" height="58" rx="14" fill="#183125" stroke="#b8ff5b"/><text x="615" y="36" fill="#b8ff5b">DOWN → DEEPGEMM</text></g><text x="412" y="185" fill="#eef7ff" font-size="18">4K −9.63% · 8K −8.82% · gate 126/128</text></g><path d="M512 680V745" stroke="#ff927f" stroke-width="8"/><polygon points="512,765 498,739 526,739" fill="#ff927f"/><g filter="url(#g)"><rect x="180" y="775" width="664" height="110" rx="25" fill="#361c21" stroke="#ff927f" stroke-width="4"/><text x="512" y="818" fill="#ff927f" font-size="25" font-weight="700">B1 ALL-ROLE: 124 / 128</text><text x="512" y="856" fill="#eef7ff" font-size="18">correctness rejects the global switch</text></g><text x="512" y="956" fill="#b8ff5b" font-size="21" font-weight="700">QUALIFY LEAVES; KEEP A FAIL-CLOSED FALLBACK</text></g></svg>
