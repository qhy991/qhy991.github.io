<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Independent verdicts for four state latency-hiding mechanisms</title><desc id="desc">cp.async and TMA staging regress, manual load retiming extends live ranges, and an evict-last cache hint is positive but below noise and engineering floors.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">FOUR MECHANISMS, FOUR SEPARATE CONTROLS, FOUR STOPS</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">Do not combine these percentages into a waterfall</text><g font-family="Arial, sans-serif"><g transform="translate(65 165)"><rect width="250" height="360" rx="22" fill="#361c21" stroke="#ff927f" stroke-width="3"/><text x="125" y="45" text-anchor="middle" fill="#ff927f" font-size="23" font-weight="700">D005</text><text x="125" y="82" text-anchor="middle" fill="#eef7ff" font-size="18">cp.async staging</text><text x="125" y="145" text-anchor="middle" fill="#ff927f" font-size="30" font-weight="700">+44.5%</text><text x="125" y="190" text-anchor="middle" fill="#c9d5e5" font-size="16">one-shot · 2 hops</text><text x="125" y="220" text-anchor="middle" fill="#c9d5e5" font-size="16">barrier · 8→6 CTA</text><rect x="45" y="280" width="160" height="52" rx="13" fill="#361c21" stroke="#ff927f"/><text x="125" y="313" text-anchor="middle" fill="#ff927f" font-size="17" font-weight="700">0/30 · STOP</text></g><g transform="translate(340 165)"><rect width="250" height="360" rx="22" fill="#34271b" stroke="#ffb15c" stroke-width="3"/><text x="125" y="45" text-anchor="middle" fill="#ffb15c" font-size="23" font-weight="700">D006</text><text x="125" y="82" text-anchor="middle" fill="#eef7ff" font-size="18">TMA staging</text><text x="125" y="145" text-anchor="middle" fill="#ffb15c" font-size="30" font-weight="700">+22.2%</text><text x="125" y="190" text-anchor="middle" fill="#c9d5e5" font-size="16">1 issue · 2 hops</text><text x="125" y="220" text-anchor="middle" fill="#c9d5e5" font-size="16">mbarrier · 8→6 CTA</text><rect x="45" y="280" width="160" height="52" rx="13" fill="#34271b" stroke="#ffb15c"/><text x="125" y="313" text-anchor="middle" fill="#ffb15c" font-size="17" font-weight="700">0/30 · STOP</text></g><g transform="translate(615 165)"><rect width="250" height="360" rx="22" fill="#2c2540" stroke="#bc9cff" stroke-width="3"/><text x="125" y="45" text-anchor="middle" fill="#bc9cff" font-size="23" font-weight="700">D001</text><text x="125" y="82" text-anchor="middle" fill="#eef7ff" font-size="18">early direct LDG</text><text x="125" y="145" text-anchor="middle" fill="#bc9cff" font-size="30" font-weight="700">+2.28%</text><text x="125" y="190" text-anchor="middle" fill="#c9d5e5" font-size="16">ptxas already interleaved</text><text x="125" y="220" text-anchor="middle" fill="#c9d5e5" font-size="16">64→71 regs / spill</text><rect x="45" y="280" width="160" height="52" rx="13" fill="#2c2540" stroke="#bc9cff"/><text x="125" y="313" text-anchor="middle" fill="#bc9cff" font-size="17" font-weight="700">0/30 · STOP</text></g><g transform="translate(890 165)"><rect width="245" height="360" rx="22" fill="#14263b" stroke="#56d8ff" stroke-width="3"/><text x="122" y="45" text-anchor="middle" fill="#56d8ff" font-size="23" font-weight="700">D017</text><text x="122" y="82" text-anchor="middle" fill="#eef7ff" font-size="18">evict-last hint</text><text x="122" y="145" text-anchor="middle" fill="#56d8ff" font-size="30" font-weight="700">−0.075%</text><text x="122" y="190" text-anchor="middle" fill="#c9d5e5" font-size="16">saving 0.00456 μs</text><text x="122" y="220" text-anchor="middle" fill="#c9d5e5" font-size="16">A/A p95 0.01428 μs</text><rect x="42" y="280" width="160" height="52" rx="13" fill="#14263b" stroke="#56d8ff"/><text x="122" y="313" text-anchor="middle" fill="#56d8ff" font-size="17" font-weight="700">BELOW FLOOR</text></g><rect x="100" y="575" width="1000" height="58" rx="16" fill="#183125" stroke="#a8ff60" stroke-width="2"/><text x="600" y="612" text-anchor="middle" fill="#a8ff60" font-size="19" font-weight="700">A REAL MECHANISM STILL NEEDS MATERIAL, NO-PROFILER WALL-TIME</text></g></svg>
