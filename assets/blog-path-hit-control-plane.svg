<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Five control-plane gates between a native library and a timed graph</title><desc id="desc">Implementation, adapter validation, selector, phase, and CUDA Graph capture all need to align before a native kernel can be attributed to a benchmark.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">CODE EXISTS ≠ TIMED PATH EXECUTES IT</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">Five gates can redirect the request before the clock starts</text><g font-family="Arial, sans-serif" text-anchor="middle"><g transform="translate(65 175)"><rect width="185" height="125" rx="20" fill="#14263b" stroke="#56d8ff" stroke-width="3"/><text x="92" y="45" fill="#56d8ff" font-size="21" font-weight="700">LIBRARY</text><text x="92" y="80" fill="#f5f7fb" font-size="17">symbol · ABI</text><text x="92" y="105" fill="#9fb1c8" font-size="15">C0</text></g><g transform="translate(285 175)"><rect width="185" height="125" rx="20" fill="#183125" stroke="#a8ff60" stroke-width="3"/><text x="92" y="45" fill="#a8ff60" font-size="21" font-weight="700">ADAPTER</text><text x="92" y="80" fill="#f5f7fb" font-size="17">dtype · stride</text><text x="92" y="105" fill="#9fb1c8" font-size="15">fallback?</text></g><g transform="translate(505 175)"><rect width="185" height="125" rx="20" fill="#2c2540" stroke="#bc9cff" stroke-width="3"/><text x="92" y="45" fill="#bc9cff" font-size="21" font-weight="700">SELECTOR</text><text x="92" y="80" fill="#f5f7fb" font-size="17">backend · flag</text><text x="92" y="105" fill="#9fb1c8" font-size="15">same path?</text></g><g transform="translate(725 175)"><rect width="185" height="125" rx="20" fill="#3b291a" stroke="#ffad4d" stroke-width="3"/><text x="92" y="45" fill="#ffad4d" font-size="21" font-weight="700">PHASE</text><text x="92" y="80" fill="#f5f7fb" font-size="17">prefill · decode</text><text x="92" y="105" fill="#9fb1c8" font-size="15">shape bucket?</text></g><g transform="translate(945 175)"><rect width="185" height="125" rx="20" fill="#14263b" stroke="#56d8ff" stroke-width="3"/><text x="92" y="45" fill="#56d8ff" font-size="21" font-weight="700">GRAPH</text><text x="92" y="80" fill="#f5f7fb" font-size="17">capture · replay</text><text x="92" y="105" fill="#9fb1c8" font-size="15">node identity?</text></g><g fill="#a8ff60"><path d="M250 237H275" stroke="#a8ff60" stroke-width="5"/><path d="M470 237H495" stroke="#a8ff60" stroke-width="5"/><path d="M690 237H715" stroke="#a8ff60" stroke-width="5"/><path d="M910 237H935" stroke="#a8ff60" stroke-width="5"/></g><path d="M378 300V375H600" fill="none" stroke="#ff927f" stroke-width="4" stroke-dasharray="10 8"/><path d="M818 300V375H600" fill="none" stroke="#ff927f" stroke-width="4" stroke-dasharray="10 8"/><rect x="385" y="372" width="430" height="90" rx="20" fill="#361c21" stroke="#ff927f" stroke-width="3"/><text x="600" y="408" fill="#ff927f" font-size="22" font-weight="700">SILENT FALLBACK / WRONG PHASE</text><text x="600" y="440" fill="#f5f7fb" font-size="17">program succeeds; candidate never runs</text><rect x="225" y="530" width="750" height="80" rx="20" fill="#183125" stroke="#a8ff60" stroke-width="3"/><text x="600" y="564" fill="#a8ff60" font-size="22" font-weight="700">TIMED RECEIPT</text><text x="600" y="593" fill="#f5f7fb" font-size="17">native count · fallback reason · phase · shape · binary / graph node</text></g></svg>
