<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">Capacity is not work</title><desc id="desc">A 256-row launch capacity contains an 84-row compact active prefix and a fast-drained suffix, so shrinking the bound does not remove the active MoE work.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b10"/><stop offset="1" stop-color="#111c30"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1024" height="1024" fill="url(#bg)"/><g opacity=".12" stroke="#8fa2bd"><path d="M0 170H1024M0 340H1024M0 510H1024M0 680H1024M0 850H1024"/><path d="M170 0V1024M340 0V1024M510 0V1024M680 0V1024M850 0V1024"/></g><g font-family="Inter,Arial,'PingFang SC',sans-serif" text-anchor="middle"><text x="512" y="73" fill="#eef7ff" font-size="37" font-weight="700">CAPACITY IS NOT WORK</text><text x="512" y="111" fill="#8fa2bd" font-size="17" letter-spacing="2">MOE ROUTES · PERSISTENT CTA · CLC FAST DRAIN</text><g transform="translate(105 185)"><rect width="814" height="210" rx="25" fill="#111b29" stroke="#34475c" stroke-width="3"/><text x="407" y="43" fill="#eef7ff" font-size="22" font-weight="700">BOUND = 256 ROUTE ROWS</text><rect x="50" y="82" width="714" height="70" rx="16" fill="#2b3b4f"/><rect x="50" y="82" width="234" height="70" rx="16" fill="#b8ff5b"/><text x="167" y="125" fill="#102012" font-size="20" font-weight="700">84 ACTIVE</text><text x="525" y="125" fill="#9aacbf" font-size="20" font-weight="700">172 NOMINAL SUFFIX</text><text x="407" y="185" fill="#b8ff5b" font-size="18">compact expert-major metadata prefix</text></g><path d="M512 410V485" stroke="#b699ff" stroke-width="8"/><polygon points="512,505 498,479 526,479" fill="#b699ff"/><g transform="translate(105 505)"><rect width="814" height="180" rx="25" fill="#183125" stroke="#b8ff5b" stroke-width="3"/><text x="407" y="43" fill="#b8ff5b" font-size="23" font-weight="700">PERSISTENT CONSUMER</text><g transform="translate(48 75)" font-size="17" font-weight="700"><rect width="220" height="58" rx="14" fill="#183125" stroke="#b8ff5b"/><text x="110" y="36" fill="#b8ff5b">READ REAL COUNT</text><rect x="250" width="220" height="58" rx="14" fill="#183125" stroke="#b8ff5b"/><text x="360" y="36" fill="#b8ff5b">EXECUTE 84</text><rect x="500" width="220" height="58" rx="14" fill="#34271b" stroke="#ffb15c"/><text x="610" y="36" fill="#ffb15c">DRAIN SUFFIX</text></g></g><g filter="url(#g)"><rect x="170" y="775" width="684" height="110" rx="25" fill="#361c21" stroke="#ff927f" stroke-width="4"/><text x="512" y="820" fill="#ff927f" font-size="25" font-weight="700">BOUND 256 → 84</text><text x="512" y="858" fill="#eef7ff" font-size="18">0 / 30 wins · active work unchanged</text></g><text x="512" y="955" fill="#b8ff5b" font-size="23" font-weight="700">DELETE PHYSICAL WORK, NOT A LARGE NUMBER</text></g></svg>
