<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">TP2 push-all versus symmetric pull dataflow</title><desc id="desc">The incumbent writes each source payload into both rank buffers even though consumers read only source-indexed diagonal slots. The candidate removes the off-diagonal stores.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/><g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">Push-All 写了四份，Consumer 实际只读两份</text><text x="65" y="104" fill="#9aacbf" font-size="16">先画 consumer edge，重复 publication 才会显形。</text><g transform="translate(65 155)"><rect width="500" height="410" rx="23" fill="#2b2020" stroke="#ff927f" stroke-width="3"/><text x="28" y="44" fill="#ff927f" font-size="20" font-weight="700">INCUMBENT · PUSH ALL</text><g transform="translate(40 90)" text-anchor="middle"><rect width="150" height="65" rx="12" fill="#13283c"/><text x="75" y="39" fill="#70e6ff" font-size="15">rank0 input</text><g transform="translate(270)"><rect width="150" height="65" rx="12" fill="#182d24"/><text x="75" y="39" fill="#b8ff5b" font-size="15">rank1 input</text></g><g transform="translate(0 170)"><rect width="150" height="65" rx="12" fill="#24303f"/><text x="75" y="28" fill="#eef7ff" font-size="14">buffer0 slot0</text><text x="75" y="50" fill="#b8ff5b" font-size="12">consumed</text><g transform="translate(270)"><rect width="150" height="65" rx="12" fill="#24303f"/><text x="75" y="28" fill="#eef7ff" font-size="14">buffer1 slot1</text><text x="75" y="50" fill="#b8ff5b" font-size="12">consumed</text></g></g><path d="M75 65L75 170M75 65L345 170M345 65L75 170M345 65L345 170" stroke="#ff927f" stroke-width="4" fill="none"/><text x="210" y="285" fill="#ff927f" font-size="15">off-diagonal stores have no consumer</text></g></g><g transform="translate(635 155)"><rect width="500" height="410" rx="23" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="28" y="44" fill="#b8ff5b" font-size="20" font-weight="700">CANDIDATE · SOURCE OWNED</text><g transform="translate(40 90)" text-anchor="middle"><rect width="150" height="65" rx="12" fill="#13283c"/><text x="75" y="39" fill="#70e6ff" font-size="15">rank0 input</text><g transform="translate(270)"><rect width="150" height="65" rx="12" fill="#182d24"/><text x="75" y="39" fill="#b8ff5b" font-size="15">rank1 input</text></g><g transform="translate(0 170)"><rect width="150" height="65" rx="12" fill="#24303f"/><text x="75" y="28" fill="#eef7ff" font-size="14">buffer0 slot0</text><text x="75" y="50" fill="#b8ff5b" font-size="12">pull source0</text><g transform="translate(270)"><rect width="150" height="65" rx="12" fill="#24303f"/><text x="75" y="28" fill="#eef7ff" font-size="14">buffer1 slot1</text><text x="75" y="50" fill="#b8ff5b" font-size="12">pull source1</text></g></g><path d="M75 65L75 170M345 65L345 170" stroke="#b8ff5b" stroke-width="6" fill="none"/><text x="210" y="285" fill="#b8ff5b" font-size="15">one source → one owned slot</text></g></g><text x="600" y="625" text-anchor="middle" fill="#eef7ff" font-size="20" font-weight="700">最便宜的通信优化，是删除没有 consumer 的数据。</text></g></svg>
