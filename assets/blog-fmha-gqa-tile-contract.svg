<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">GQA semantic head-group contract for Q8, Q16 and Q32 tiles</title><desc id="desc">Sixteen local query heads share one KV head; Q8 is smaller than the required complete group, Q16 is exact, and Q32 is legal but over-wide.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">ARITHMETIC TILE MUST RESPECT THE GQA SEMANTIC GROUP</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">Local shape: 16 Q heads share 1 KV head</text><g font-family="Arial, sans-serif"><text x="70" y="176" fill="#bc9cff" font-size="21" font-weight="700">ONE COMPLETE GROUP</text><rect x="70" y="195" width="960" height="58" rx="16" fill="#151f2f" stroke="#bc9cff" stroke-width="3"/><g fill="#bc9cff"><rect x="85" y="207" width="42" height="34" rx="7"/><rect x="142" y="207" width="42" height="34" rx="7"/><rect x="199" y="207" width="42" height="34" rx="7"/><rect x="256" y="207" width="42" height="34" rx="7"/><rect x="313" y="207" width="42" height="34" rx="7"/><rect x="370" y="207" width="42" height="34" rx="7"/><rect x="427" y="207" width="42" height="34" rx="7"/><rect x="484" y="207" width="42" height="34" rx="7"/><rect x="541" y="207" width="42" height="34" rx="7"/><rect x="598" y="207" width="42" height="34" rx="7"/><rect x="655" y="207" width="42" height="34" rx="7"/><rect x="712" y="207" width="42" height="34" rx="7"/><rect x="769" y="207" width="42" height="34" rx="7"/><rect x="826" y="207" width="42" height="34" rx="7"/><rect x="883" y="207" width="42" height="34" rx="7"/><rect x="940" y="207" width="42" height="34" rx="7"/></g><rect x="1045" y="195" width="90" height="58" rx="16" fill="#3b291a" stroke="#ffad4d" stroke-width="3"/><text x="1090" y="232" text-anchor="middle" fill="#ffad4d" font-size="20" font-weight="700">KV1</text><g transform="translate(70 330)"><rect width="310" height="190" rx="22" fill="#361c21" stroke="#ff927f" stroke-width="3"/><text x="155" y="45" text-anchor="middle" fill="#ff927f" font-size="25" font-weight="700">Q8</text><rect x="35" y="75" width="120" height="48" rx="12" fill="#ff927f" opacity=".75"/><rect x="155" y="75" width="120" height="48" rx="12" fill="#1b2637"/><text x="155" y="157" text-anchor="middle" fill="#eef7ff" font-size="17">half group</text><text x="155" y="181" text-anchor="middle" fill="#ff927f" font-size="17" font-weight="700">LAUNCH INVALID</text></g><g transform="translate(445 330)"><rect width="310" height="190" rx="22" fill="#183125" stroke="#a8ff60" stroke-width="3"/><text x="155" y="45" text-anchor="middle" fill="#a8ff60" font-size="25" font-weight="700">Q16</text><rect x="35" y="75" width="240" height="48" rx="12" fill="#a8ff60" opacity=".75"/><text x="155" y="157" text-anchor="middle" fill="#eef7ff" font-size="17">one complete group</text><text x="155" y="181" text-anchor="middle" fill="#a8ff60" font-size="17" font-weight="700">EXACT INCUMBENT</text></g><g transform="translate(820 330)"><rect width="310" height="190" rx="22" fill="#3b291a" stroke="#ffad4d" stroke-width="3"/><text x="155" y="45" text-anchor="middle" fill="#ffad4d" font-size="25" font-weight="700">Q32</text><rect x="35" y="75" width="240" height="48" rx="12" fill="#ffad4d" opacity=".75"/><path d="M155 75V123" stroke="#0b111c" stroke-width="4"/><text x="155" y="157" text-anchor="middle" fill="#eef7ff" font-size="17">legal but over-wide</text><text x="155" y="181" text-anchor="middle" fill="#ffad4d" font-size="17" font-weight="700">EXACT · 0/30</text></g><text x="600" y="610" text-anchor="middle" fill="#9fb1c8" font-size="19">A cubin in provider metadata is not proof that its tile satisfies this launch contract</text></g></svg>
