<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Strict live-context bucket selector</title><desc id="desc">The selector chooses the smallest bucket length strictly greater than the maximum zero-based active position, causing a correct transition from K256 to K512 at position 256.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="32" font-weight="700">BUCKET LENGTH IS EXTENT; POSITION IS ZERO-BASED</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">Choose the smallest K such that K &gt; max_position</text><g font-family="Arial, sans-serif"><g transform="translate(65 165)"><rect width="1070" height="105" rx="20" fill="#111b2a" stroke="#34475c" stroke-width="3"/><text x="35" y="42" fill="#eef7ff" font-size="21" font-weight="700">ACTIVE ROW POSITIONS</text><g transform="translate(330 25)" font-size="18" font-weight="700"><rect width="140" height="55" rx="13" fill="#14263b" stroke="#70e6ff"/><text x="70" y="35" fill="#70e6ff">190</text><rect x="165" width="140" height="55" rx="13" fill="#14263b" stroke="#70e6ff"/><text x="235" y="35" fill="#70e6ff">82</text><rect x="330" width="140" height="55" rx="13" fill="#14263b" stroke="#70e6ff"/><text x="400" y="35" fill="#70e6ff">255</text><rect x="495" width="140" height="55" rx="13" fill="#2c2540" stroke="#bc9cff"/><text x="565" y="35" fill="#bc9cff">MAX = 255</text></g></g><path d="M600 270V335" stroke="#b699ff" stroke-width="7"/><path d="M588 323L600 347 612 323Z" fill="#b699ff"/><g transform="translate(65 360)"><rect width="1070" height="170" rx="22" fill="#24243a" stroke="#b699ff" stroke-width="3"/><text x="535" y="42" text-anchor="middle" fill="#b699ff" font-size="22" font-weight="700">STRICT SELECTOR</text><g transform="translate(35 78)" font-size="17" font-weight="700"><rect width="220" height="55" rx="13" fill="#183125" stroke="#a8ff60"/><text x="110" y="35" fill="#a8ff60">p ≤255 → K256</text><rect x="250" width="220" height="55" rx="13" fill="#34271b" stroke="#ffad4d"/><text x="360" y="35" fill="#ffad4d">p=256 → K512</text><rect x="500" width="220" height="55" rx="13" fill="#14263b" stroke="#70e6ff"/><text x="610" y="35" fill="#70e6ff">p≤511 → K512</text><rect x="750" width="250" height="55" rx="13" fill="#361c21" stroke="#ff927f"/><text x="875" y="35" fill="#ff927f">miss → full fallback</text></g></g><rect x="205" y="580" width="790" height="55" rx="15" fill="#183125" stroke="#a8ff60" stroke-width="2"/><text x="600" y="615" text-anchor="middle" fill="#a8ff60" font-size="20" font-weight="700">K &gt; p GUARANTEES THE CURRENT TOKEN SLOT IS INSIDE THE SLICE</text></g></svg>
