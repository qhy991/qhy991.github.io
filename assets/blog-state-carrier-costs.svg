<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Cost decomposition for direct, cp.async and TMA state staging</title><desc id="desc">TMA removes most cooperative copy issue cost but retains the shared-memory hop, synchronization, registers and resident-CTA loss that make one-shot staging slower than direct loads.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">TMA RECOVERS ISSUE COST; THE STAGING TAX REMAINS</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">Frozen D005/D006 operator evidence · lower is better</text><g font-family="Arial, sans-serif"><text x="70" y="202" fill="#c9d5e5" font-size="20">Direct source</text><rect x="300" y="170" width="730" height="54" rx="12" fill="#233147"/><rect x="300" y="170" width="505" height="54" rx="12" fill="#a8ff60"/><text x="825" y="205" fill="#a8ff60" font-size="20" font-weight="700">≈9.26 μs</text><text x="70" y="312" fill="#c9d5e5" font-size="20">TMA staging</text><rect x="300" y="280" width="730" height="54" rx="12" fill="#233147"/><rect x="300" y="280" width="617" height="54" rx="12" fill="#ffad4d"/><text x="937" y="315" fill="#ffad4d" font-size="20" font-weight="700">11.317 μs</text><text x="70" y="422" fill="#c9d5e5" font-size="20">cp.async staging</text><rect x="300" y="390" width="730" height="54" rx="12" fill="#233147"/><rect x="300" y="390" width="730" height="54" rx="12" fill="#ff927f"/><text x="1050" y="425" fill="#ff927f" font-size="20" font-weight="700">13.386 μs</text><path d="M1030 500H918" stroke="#ffad4d" stroke-width="5"/><path d="M930 487L906 500 930 513Z" fill="#ffad4d"/><text x="970" y="540" text-anchor="middle" fill="#ffad4d" font-size="19" font-weight="700">TMA recovers 2.069 μs</text><g transform="translate(70 570)" font-size="16" font-weight="700"><rect width="245" height="55" rx="14" fill="#183125" stroke="#a8ff60"/><text x="122" y="34" text-anchor="middle" fill="#a8ff60">DIRECT: 64 REG · 8 CTA/SM</text><rect x="285" width="330" height="55" rx="14" fill="#34271b" stroke="#ffb15c"/><text x="450" y="34" text-anchor="middle" fill="#ffb15c">TMA: 72 REG · 32 KiB · 6 CTA/SM</text><rect x="655" width="405" height="55" rx="14" fill="#361c21" stroke="#ff927f"/><text x="857" y="34" text-anchor="middle" fill="#ff927f">cp.async: MANY ISSUES · 72 REG · 6 CTA/SM</text></g></g></svg>
