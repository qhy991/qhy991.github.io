<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">SubCUDA PTX vector I/O to CUDA counterfactual</title><desc id="desc">Scalar BF16 loads are widened to 64 and 128 bit vector I/O. Direct PTX improves TP2 throughput, while CUDA recovers 90.2 percent of the graph wall saving.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b10"/><stop offset="1" stop-color="#111c30"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1024" height="1024" fill="url(#bg)"/><g opacity=".12" stroke="#8fa2bd"><path d="M0 170H1024M0 340H1024M0 510H1024M0 680H1024M0 850H1024"/><path d="M170 0V1024M340 0V1024M510 0V1024M680 0V1024M850 0V1024"/></g><g font-family="Inter,Arial,'PingFang SC',sans-serif" text-anchor="middle"><text x="512" y="72" fill="#eef7ff" font-size="36" font-weight="700">PTX AS A MICROSCOPE</text><text x="512" y="108" fill="#8fa2bd" font-size="17" letter-spacing="2">SCALAR I/O → VECTOR I/O → CUDA PROOF</text><g transform="translate(98 170)"><rect width="330" height="170" rx="22" fill="#2b2020" stroke="#ff927f" stroke-width="3"/><text x="165" y="48" fill="#ff927f" font-size="21" font-weight="700">SCALAR BF16</text><g fill="#ff927f"><rect x="38" y="82" width="18" height="40"/><rect x="66" y="82" width="18" height="40"/><rect x="94" y="82" width="18" height="40"/><rect x="122" y="82" width="18" height="40"/><rect x="150" y="82" width="18" height="40"/><rect x="178" y="82" width="18" height="40"/><rect x="206" y="82" width="18" height="40"/><rect x="234" y="82" width="18" height="40"/><rect x="262" y="82" width="18" height="40"/></g><text x="165" y="148" fill="#d9e7f5" font-size="14">many 16-bit instructions</text><g transform="translate(498)"><rect width="330" height="170" rx="22" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="165" y="48" fill="#b8ff5b" font-size="21" font-weight="700">VECTOR I/O</text><rect x="44" y="82" width="116" height="40" rx="6" fill="#70e6ff"/><rect x="174" y="82" width="116" height="40" rx="6" fill="#b8ff5b"/><text x="165" y="148" fill="#d9e7f5" font-size="14">64 / 128-bit instructions</text></g></g><path d="M512 340V435" stroke="#70e6ff" stroke-width="9" filter="url(#g)"/><polygon points="512,455 498,429 526,429" fill="#70e6ff"/><rect x="290" y="460" width="444" height="150" rx="24" fill="#15263a" stroke="#70e6ff" stroke-width="4"/><text x="512" y="510" fill="#70e6ff" font-size="25" font-weight="700">ROUND93 · DIRECT PTX</text><text x="512" y="550" fill="#eef7ff" font-size="20">operator −3.60474%</text><text x="512" y="582" fill="#b8ff5b" font-size="20">TP2 throughput +0.498704%</text><path d="M512 610V700" stroke="#b8ff5b" stroke-width="9"/><polygon points="512,720 498,694 526,694" fill="#b8ff5b"/><rect x="155" y="730" width="714" height="140" rx="24" fill="#121b29" stroke="#b8ff5b" stroke-width="3"/><text x="330" y="780" fill="#8fa2bd" font-size="17">CUDA C++</text><text x="330" y="824" fill="#eef7ff" font-size="32" font-weight="700">4.535 ms</text><text x="512" y="810" fill="#b8ff5b" font-size="32">≈ 90.20%</text><text x="700" y="780" fill="#8fa2bd" font-size="17">DIRECT PTX</text><text x="700" y="824" fill="#b8ff5b" font-size="32" font-weight="700">5.028 ms</text><text x="512" y="925" fill="#ffb15c" font-size="24" font-weight="700">MECHANISM PROBE · NOT LANGUAGE MAGIC</text><text x="512" y="960" fill="#8fa2bd" font-size="15">Qwen3.5 TP2 · 2×B200 · B32 · 128-step graph</text></g></svg>
