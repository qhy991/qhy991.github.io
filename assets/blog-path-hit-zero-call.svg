<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">A prefill candidate can be path-hit while the decode graph records zero calls</title><desc id="desc">The left prefill gate dispatches the native RoPE and KV-store candidate 864 times, while the right decode graph runs the incumbent path with zero native calls, so a small timing delta is not attributable.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">SAME FLAG, DIFFERENT PHASE, DIFFERENT PATH</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">RoPE + KV-store example · Qwen3-4B · B200</text><g font-family="Arial, sans-serif"><rect x="65" y="165" width="500" height="370" rx="24" fill="#111b2a" stroke="#a8ff60" stroke-width="3"/><text x="105" y="210" fill="#a8ff60" font-size="24" font-weight="700">BATCHED PREFILL GATE</text><rect x="110" y="255" width="185" height="80" rx="17" fill="#14263b" stroke="#56d8ff" stroke-width="2"/><text x="202" y="288" text-anchor="middle" fill="#56d8ff" font-size="19" font-weight="700">SELECTOR</text><text x="202" y="315" text-anchor="middle" fill="#f5f7fb" font-size="16">candidate eligible</text><path d="M295 295H350" stroke="#a8ff60" stroke-width="5"/><path d="M340 283L362 295 340 307Z" fill="#a8ff60"/><rect x="365" y="245" width="155" height="100" rx="17" fill="#183125" stroke="#a8ff60" stroke-width="3"/><text x="442" y="283" text-anchor="middle" fill="#a8ff60" font-size="19" font-weight="700">NATIVE</text><text x="442" y="312" text-anchor="middle" fill="#f5f7fb" font-size="16">RoPE + store</text><rect x="150" y="410" width="330" height="78" rx="18" fill="#183125" stroke="#a8ff60" stroke-width="2"/><text x="315" y="442" text-anchor="middle" fill="#a8ff60" font-size="24" font-weight="700">CALL_COUNT = 864</text><text x="315" y="470" text-anchor="middle" fill="#f5f7fb" font-size="16">path identity established</text><rect x="635" y="165" width="500" height="370" rx="24" fill="#111b2a" stroke="#ff927f" stroke-width="3"/><text x="675" y="210" fill="#ff927f" font-size="24" font-weight="700">B1 DECODE GRAPH</text><rect x="680" y="255" width="185" height="80" rx="17" fill="#14263b" stroke="#56d8ff" stroke-width="2"/><text x="772" y="288" text-anchor="middle" fill="#56d8ff" font-size="19" font-weight="700">GRAPH REPLAY</text><text x="772" y="315" text-anchor="middle" fill="#f5f7fb" font-size="16">captured path</text><path d="M865 295H920" stroke="#ff927f" stroke-width="5"/><path d="M910 283L932 295 910 307Z" fill="#ff927f"/><rect x="935" y="245" width="155" height="100" rx="17" fill="#361c21" stroke="#ff927f" stroke-width="3"/><text x="1012" y="283" text-anchor="middle" fill="#ff927f" font-size="19" font-weight="700">INCUMBENT</text><text x="1012" y="312" text-anchor="middle" fill="#f5f7fb" font-size="16">native bypassed</text><rect x="720" y="410" width="330" height="78" rx="18" fill="#361c21" stroke="#ff927f" stroke-width="2"/><text x="885" y="442" text-anchor="middle" fill="#ff927f" font-size="24" font-weight="700">CALL_COUNT = 0</text><text x="885" y="470" text-anchor="middle" fill="#f5f7fb" font-size="16">delta = guardrail noise</text><rect x="240" y="575" width="720" height="58" rx="16" fill="#2c2540" stroke="#bc9cff" stroke-width="2"/><text x="600" y="612" text-anchor="middle" fill="#bc9cff" font-size="21" font-weight="700">NO PATH HIT → NO CANDIDATE ATTRIBUTION</text></g></svg>
