<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Focused Graph and serving evidence levels</title><desc id="desc">The paged KV native store is accepted on a focused S3 Graph boundary with 10.56 percent lower latency but rejected for S4 serving where throughput improves only 2.02 percent, below the 5 percent gate.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/><g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">同一个机制，两种边界，两种都正确的裁决</text><text x="65" y="104" fill="#9aacbf" font-size="16">Focused Graph 与 HTTP serving 测量的是不同 estimand。</text><g transform="translate(80 165)"><rect width="480" height="360" rx="24" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="30" y="47" fill="#b8ff5b" font-size="21" font-weight="700">S3 · FOCUSED DECODE GRAPH</text><text x="30" y="97" fill="#9aacbf" font-size="15">latency per step</text><text x="30" y="148" fill="#eef7ff" font-size="34" font-weight="700">4.9004 → 4.3829 ms</text><text x="30" y="196" fill="#b8ff5b" font-size="29" font-weight="700">−10.56%</text><line x1="30" y1="228" x2="450" y2="228" stroke="#40564a"/><text x="30" y="270" fill="#d9e7f5" font-size="16">✓ focused saving ≥ 0.50 ms</text><text x="30" y="306" fill="#d9e7f5" font-size="16">✓ bounded accept</text><text x="30" y="338" fill="#9aacbf" font-size="14">implementation remains useful</text></g><g transform="translate(640 165)"><rect width="480" height="360" rx="24" fill="#34271b" stroke="#ffb15c" stroke-width="3"/><text x="30" y="47" fill="#ffb15c" font-size="21" font-weight="700">S4 · CAPACITY-16 HTTP SERVING</text><text x="30" y="97" fill="#9aacbf" font-size="15">pooled throughput</text><text x="30" y="148" fill="#eef7ff" font-size="34" font-weight="700">2624.1 → 2677.1 tok/s</text><text x="30" y="196" fill="#ffb15c" font-size="29" font-weight="700">+2.02%</text><line x1="30" y1="228" x2="450" y2="228" stroke="#60492f"/><text x="30" y="270" fill="#d9e7f5" font-size="16">✗ primary gate requires ≥ 5%</text><text x="30" y="306" fill="#d9e7f5" font-size="16">✗ product promotion rejected</text><text x="30" y="338" fill="#9aacbf" font-size="14">default off for this contract</text></g><text x="600" y="592" text-anchor="middle" fill="#eef7ff" font-size="20" font-weight="700">S3 的真实局部收益不会被抹掉；S4 的产品停止也不会被局部收益覆盖。</text></g></svg>
