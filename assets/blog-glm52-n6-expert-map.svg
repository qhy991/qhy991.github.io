      <g transform="translate(403 724)"><rect width="104" height="122" rx="16" fill="#12253a" stroke="#70e6ff" stroke-width="2"/><text x="52" y="46" fill="#70e6ff">GPU 3</text><text x="52" y="82" fill="#d9e7f5">experts</text></g>
      <g transform="translate(517 724)"><rect width="104" height="122" rx="16" fill="#182d24" stroke="#b8ff5b" stroke-width="2"/><text x="52" y="46" fill="#b8ff5b">GPU 4</text><text x="52" y="82" fill="#d9e7f5">experts</text></g>
