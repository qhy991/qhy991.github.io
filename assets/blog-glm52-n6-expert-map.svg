<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">GLM-5.2 N6 expert placement and DeepEP routing</title>
  <desc id="desc">A router produces logical expert IDs, a static map converts them to physical owners, and DeepEP distributes tokens across eight GPU ranks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b10"/><stop offset="1" stop-color="#10182a"/></linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#70e6ff"/><stop offset="1" stop-color="#b8ff5b"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g opacity=".12" stroke="#8fa2bd"><path d="M0 156H1024M0 332H1024M0 508H1024M0 684H1024M0 860H1024"/><path d="M164 0V1024M340 0V1024M516 0V1024M692 0V1024M868 0V1024"/></g>
  <g font-family="Inter,Arial,'PingFang SC',sans-serif" text-anchor="middle">
    <text x="512" y="76" fill="#eef7ff" font-size="36" font-weight="700">ROUTER → MAP → DEEPEP</text>
    <text x="512" y="112" fill="#8fa2bd" font-size="18" letter-spacing="2">ONE CANONICAL EXPERT-ID PATH</text>
    <g filter="url(#glow)">
