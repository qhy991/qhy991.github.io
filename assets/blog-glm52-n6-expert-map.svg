      <g transform="translate(862 724)"><rect width="104" height="122" rx="16" fill="#182d24" stroke="#b8ff5b" stroke-width="2"/><text x="52" y="46" fill="#b8ff5b">GPU 7</text><text x="52" y="82" fill="#d9e7f5">experts</text></g>
    </g>
    <text x="512" y="916" fill="#ffb15c" font-size="23" font-weight="700">BALANCE THE TAIL · DELETE THE EXTRA PATH</text>
