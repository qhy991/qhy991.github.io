      <text x="512" y="205" fill="#70e6ff" font-size="22" font-weight="700">ROUTER / TOP-K</text>
      <text x="512" y="238" fill="#d9e7f5" font-size="17">logical expert IDs</text>
      <path d="M512 264V334" stroke="#70e6ff" stroke-width="8"/>
      <polygon points="512,348 500,328 524,328" fill="#70e6ff"/>
      <rect x="342" y="350" width="340" height="118" rx="22" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/>
      <text x="512" y="397" fill="#b8ff5b" font-size="22" font-weight="700">STATIC PLACEMENT MAP</text>
      <text x="512" y="430" fill="#d9e7f5" font-size="17">physical ID · padded −1 · int64</text>
    </g>
    <path d="M512 468V548" stroke="url(#route)" stroke-width="10" filter="url(#glow)"/>
    <circle cx="512" cy="557" r="18" fill="#b8ff5b" filter="url(#glow)"/>
    <text x="512" y="615" fill="#eef7ff" font-size="21" font-weight="700">DEEPEP DISPATCH</text>
    <g fill="none" stroke="url(#route)" stroke-width="5" opacity=".9">
      <path d="M512 557C512 640 110 622 110 724"/><path d="M512 557C512 650 225 630 225 724"/><path d="M512 557C512 660 340 638 340 724"/><path d="M512 557C512 670 455 646 455 724"/>
      <path d="M512 557C512 670 569 646 569 724"/><path d="M512 557C512 660 684 638 684 724"/><path d="M512 557C512 650 799 630 799 724"/><path d="M512 557C512 640 914 622 914 724"/>
    </g>
