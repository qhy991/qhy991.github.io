<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">CUDA to PTX to SASS feedback loop</title><desc id="desc">CUDA or Triton code lowers to PTX, ptxas produces SASS, B200 executes the machine code, and profiler feedback returns to source-level design.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#70e6ff"/></marker></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/><g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">最终执行的是 SASS，而不是源代码或 PTX 文本</text><text x="65" y="104" fill="#9aacbf" font-size="16">每一层都能改变性能；每一个假设都要在最终 binary 上验证。</text><g transform="translate(70 200)" text-anchor="middle" font-size="17"><g><rect width="210" height="130" rx="20" fill="#13283c" stroke="#70e6ff" stroke-width="3"/><text x="105" y="48" fill="#70e6ff" font-weight="700">CUDA / TRITON</text><text x="105" y="80" fill="#d9e7f5" font-size="14">algorithm · dataflow</text><text x="105" y="105" fill="#9aacbf" font-size="13">maintainable source</text></g><path d="M210 65H270" stroke="#70e6ff" stroke-width="4" marker-end="url(#a)"/><g transform="translate(285)"><rect width="190" height="130" rx="20" fill="#24243a" stroke="#b699ff" stroke-width="3"/><text x="95" y="48" fill="#b699ff" font-weight="700">PTX</text><text x="95" y="80" fill="#d9e7f5" font-size="14">virtual ISA</text><text x="95" y="105" fill="#9aacbf" font-size="13">mechanism probe</text></g><path d="M475 65H535" stroke="#70e6ff" stroke-width="4" marker-end="url(#a)"/><g transform="translate(550)"><rect width="190" height="130" rx="20" fill="#34271b" stroke="#ffb15c" stroke-width="3"/><text x="95" y="48" fill="#ffb15c" font-weight="700">PTXAS</text><text x="95" y="80" fill="#d9e7f5" font-size="14">register · schedule</text><text x="95" y="105" fill="#9aacbf" font-size="13">instruction select</text></g><path d="M740 65H800" stroke="#70e6ff" stroke-width="4" marker-end="url(#a)"/><g transform="translate(815)"><rect width="190" height="130" rx="20" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="95" y="48" fill="#b8ff5b" font-weight="700">SASS</text><text x="95" y="80" fill="#d9e7f5" font-size="14">actual machine code</text><text x="95" y="105" fill="#9aacbf" font-size="13">hash · resources</text></g></g><g transform="translate(380 430)"><rect width="440" height="112" rx="20" fill="#121b29" stroke="#70e6ff" stroke-width="2"/><text x="220" y="42" text-anchor="middle" fill="#eef7ff" font-size="20" font-weight="700">B200 + NSYS / NCU</text><text x="220" y="75" text-anchor="middle" fill="#9aacbf" font-size="14">wall time · stalls · sectors · spill · residency</text></g><path d="M910 330C910 430 860 486 825 486" fill="none" stroke="#b8ff5b" stroke-width="4" marker-end="url(#a)"/><path d="M380 486C250 486 175 430 175 350" fill="none" stroke="#b8ff5b" stroke-width="4" marker-end="url(#a)"/><text x="600" y="610" text-anchor="middle" fill="#eef7ff" font-size="20" font-weight="700">PTX 是反馈环中的一层，不是优化旅程的终点。</text></g></svg>
