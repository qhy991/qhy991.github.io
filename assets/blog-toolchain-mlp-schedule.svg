<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Compiler schedule changes memory-level parallelism at the same occupancy</title><desc id="desc">CUDA 13.0 and 13.2 compile the same page-copy source and launch with equal occupancy, but 13.2 keeps more load and store operations in flight and is about 33 percent faster.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">SAME SOURCE. SAME OCCUPANCY. DIFFERENT MLP.</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">sgl-kernel KV page-copy · 2 CTA × 1024 threads</text><g font-family="Arial, sans-serif"><rect x="65" y="165" width="1070" height="90" rx="20" fill="#111b2a" stroke="#34475c" stroke-width="3"/><text x="105" y="205" fill="#eef7ff" font-size="20" font-weight="700">IDENTICAL INPUT</text><text x="360" y="205" fill="#c9d5e5" font-size="18">same transfer.cu</text><text x="620" y="205" fill="#c9d5e5" font-size="18">same launch</text><text x="850" y="205" fill="#c9d5e5" font-size="18">49.5% occupancy</text><g transform="translate(65 305)"><rect width="500" height="250" rx="24" fill="#361c21" stroke="#ff927f" stroke-width="3"/><text x="250" y="45" text-anchor="middle" fill="#ff927f" font-size="24" font-weight="700">CUDA 13.0</text><text x="55" y="100" fill="#eef7ff" font-size="18">shallower schedule</text><g fill="#ff927f"><rect x="55" y="130" width="70" height="35" rx="8"/><rect x="140" y="130" width="70" height="35" rx="8"/><rect x="225" y="130" width="70" height="35" rx="8"/><rect x="310" y="130" width="70" height="35" rx="8"/></g><text x="250" y="210" text-anchor="middle" fill="#ff927f" font-size="26" font-weight="700">7.81 ms</text><text x="250" y="238" text-anchor="middle" fill="#c9d5e5" font-size="15">63.7 GB/s · issued 0.12</text></g><g transform="translate(635 305)"><rect width="500" height="250" rx="24" fill="#183125" stroke="#a8ff60" stroke-width="3"/><text x="250" y="45" text-anchor="middle" fill="#a8ff60" font-size="24" font-weight="700">CUDA 13.2</text><text x="55" y="100" fill="#eef7ff" font-size="18">deeper in-flight memory schedule</text><g fill="#a8ff60"><rect x="45" y="130" width="32" height="35" rx="7"/><rect x="87" y="130" width="32" height="35" rx="7"/><rect x="129" y="130" width="32" height="35" rx="7"/><rect x="171" y="130" width="32" height="35" rx="7"/><rect x="213" y="130" width="32" height="35" rx="7"/><rect x="255" y="130" width="32" height="35" rx="7"/><rect x="297" y="130" width="32" height="35" rx="7"/><rect x="339" y="130" width="32" height="35" rx="7"/><rect x="381" y="130" width="32" height="35" rx="7"/><rect x="423" y="130" width="32" height="35" rx="7"/></g><text x="250" y="210" text-anchor="middle" fill="#a8ff60" font-size="26" font-weight="700">5.20 ms</text><text x="250" y="238" text-anchor="middle" fill="#c9d5e5" font-size="15">95.6 GB/s · issued 0.17</text></g><text x="600" y="620" text-anchor="middle" fill="#bc9cff" font-size="21" font-weight="700">OCCUPANCY COUNTS RESIDENT WARPS; MLP COUNTS IN-FLIGHT MEMORY WORK</text></g></svg>
