<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Register allocation creates CTA residency cliffs</title><desc id="desc">A 1024-thread CTA at 40 registers consumes 40960 registers and allows one CTA per SM, while 32 registers consumes 32768 and allows two CTAs per SM.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/><g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">寄存器分配按整 CTA 形成 Residency 台阶</text><text x="65" y="104" fill="#9aacbf" font-size="16">性能变化发生在 1→2 CTA/SM 的 cliff，而不是每少一个 register 都线性变快。</text><g transform="translate(75 165)"><rect width="480" height="370" rx="23" fill="#2b2020" stroke="#ff927f" stroke-width="3"/><text x="28" y="43" fill="#ff927f" font-size="20" font-weight="700">40 REGISTERS / THREAD</text><text x="28" y="82" fill="#d9e7f5" font-size="17">40 × 1024 = 40,960 regs / CTA</text><g transform="translate(45 130)"><rect width="390" height="105" rx="16" fill="#342727" stroke="#ff927f" stroke-width="2"/><text x="195" y="46" text-anchor="middle" fill="#eef7ff" font-size="18">CTA 0 resident</text><text x="195" y="76" text-anchor="middle" fill="#9aacbf" font-size="14">CTA 1 cannot fit</text></g><text x="28" y="292" fill="#9aacbf" font-size="15">Achieved occupancy</text><text x="28" y="335" fill="#ff927f" font-size="30" font-weight="700">≈ 47.4%</text></g><g transform="translate(645 165)"><rect width="480" height="370" rx="23" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="28" y="43" fill="#b8ff5b" font-size="20" font-weight="700">32 REGISTERS / THREAD</text><text x="28" y="82" fill="#d9e7f5" font-size="17">32 × 1024 = 32,768 regs / CTA</text><g transform="translate(45 120)"><rect width="390" height="82" rx="16" fill="#244335" stroke="#b8ff5b" stroke-width="2"/><text x="195" y="49" text-anchor="middle" fill="#eef7ff" font-size="18">CTA 0 resident</text><rect y="95" width="390" height="82" rx="16" fill="#244335" stroke="#b8ff5b" stroke-width="2"/><text x="195" y="144" text-anchor="middle" fill="#eef7ff" font-size="18">CTA 1 resident</text></g><text x="28" y="315" fill="#9aacbf" font-size="15">Achieved occupancy</text><text x="28" y="355" fill="#b8ff5b" font-size="30" font-weight="700">≈ 88.2%</text></g><text x="600" y="608" text-anchor="middle" fill="#eef7ff" font-size="20" font-weight="700">相同源码，ptxas 资源决策不同，就可能跨过性能悬崖。</text></g></svg>
