<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Contract, correctness and operator gates for FMHA topology candidates</title><desc id="desc">Q8 stops at launch legality, one and two split candidates stop at byte correctness, and Q32 and GMEM4 stop after exact but slower operator timing.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">EVERY CANDIDATE STOPS AT ITS FIRST FAILED GATE</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">No profiler or E2E rescue after a stronger upstream rejection</text><g font-family="Arial, sans-serif"><g transform="translate(65 165)"><rect width="1070" height="105" rx="20" fill="#111b2a" stroke="#ff927f" stroke-width="3"/><text x="30" y="40" fill="#ff927f" font-size="21" font-weight="700">G0 · LAUNCH CONTRACT</text><rect x="340" y="25" width="190" height="55" rx="13" fill="#361c21"/><text x="435" y="60" text-anchor="middle" fill="#ff927f" font-size="18" font-weight="700">Q8 AUTO</text><rect x="555" y="25" width="190" height="55" rx="13" fill="#361c21"/><text x="650" y="60" text-anchor="middle" fill="#ff927f" font-size="18" font-weight="700">Q8 FORCED</text><text x="1040" y="60" text-anchor="end" fill="#ff927f" font-size="18" font-weight="700">LAUNCH FAIL → STOP</text></g><g transform="translate(65 300)"><rect width="1070" height="105" rx="20" fill="#111b2a" stroke="#bc9cff" stroke-width="3"/><text x="30" y="40" fill="#bc9cff" font-size="21" font-weight="700">G1 · BYTE CORRECTNESS</text><rect x="340" y="25" width="140" height="55" rx="13" fill="#361c21"/><text x="410" y="60" text-anchor="middle" fill="#ff927f" font-size="18" font-weight="700">1 SPLIT</text><rect x="500" y="25" width="140" height="55" rx="13" fill="#361c21"/><text x="570" y="60" text-anchor="middle" fill="#ff927f" font-size="18" font-weight="700">CGA2</text><rect x="660" y="25" width="140" height="55" rx="13" fill="#361c21"/><text x="730" y="60" text-anchor="middle" fill="#ff927f" font-size="18" font-weight="700">GMEM2</text><text x="1040" y="60" text-anchor="end" fill="#ff927f" font-size="18" font-weight="700">NON-EXACT → STOP</text></g><g transform="translate(65 435)"><rect width="1070" height="125" rx="20" fill="#111b2a" stroke="#a8ff60" stroke-width="3"/><text x="30" y="42" fill="#a8ff60" font-size="21" font-weight="700">G2 · OPERATOR A/B</text><rect x="340" y="30" width="210" height="65" rx="13" fill="#3b291a" stroke="#ffad4d" stroke-width="2"/><text x="445" y="58" text-anchor="middle" fill="#ffad4d" font-size="18" font-weight="700">Q32 · EXACT</text><text x="445" y="83" text-anchor="middle" fill="#eef7ff" font-size="15">+0.876% · 0/30</text><rect x="580" y="30" width="210" height="65" rx="13" fill="#3b291a" stroke="#ffad4d" stroke-width="2"/><text x="685" y="58" text-anchor="middle" fill="#ffad4d" font-size="18" font-weight="700">GMEM4 · EXACT</text><text x="685" y="83" text-anchor="middle" fill="#eef7ff" font-size="15">+1.015% · 0/30</text><text x="1040" y="72" text-anchor="end" fill="#ffad4d" font-size="18" font-weight="700">SLOWER → STOP</text></g><rect x="320" y="600" width="560" height="48" rx="14" fill="#24243a" stroke="#bc9cff" stroke-width="2"/><text x="600" y="631" text-anchor="middle" fill="#bc9cff" font-size="19" font-weight="700">NO ARM REACHES PROFILE OR E2E</text></g></svg>
