<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Four different meanings of route compaction</title><desc id="desc">Layout compaction, capacity compaction, physical work compaction and dataflow compaction affect progressively more expensive parts of the execution path; D022 changes only capacity.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">“COMPACT” CAN MEAN FOUR DIFFERENT THINGS</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">Only the last two directly remove substantial physical work</text><g font-family="Arial, sans-serif"><g transform="translate(65 165)"><rect width="250" height="360" rx="22" fill="#183125" stroke="#a8ff60" stroke-width="3"/><text x="125" y="45" text-anchor="middle" fill="#a8ff60" font-size="23" font-weight="700">1 · LAYOUT</text><text x="125" y="95" text-anchor="middle" fill="#eef7ff" font-size="18">metadata has no holes</text><rect x="40" y="135" width="170" height="45" rx="11" fill="#a8ff60"/><text x="125" y="163" text-anchor="middle" fill="#102012" font-size="15" font-weight="700">COMPACT PREFIX</text><text x="125" y="235" text-anchor="middle" fill="#c9d5e5" font-size="16">already true</text><text x="125" y="275" text-anchor="middle" fill="#a8ff60" font-size="18" font-weight="700">UNCHANGED</text></g><g transform="translate(340 165)"><rect width="250" height="360" rx="22" fill="#34271b" stroke="#ffad4d" stroke-width="3"/><text x="125" y="45" text-anchor="middle" fill="#ffad4d" font-size="23" font-weight="700">2 · CAPACITY</text><text x="125" y="95" text-anchor="middle" fill="#eef7ff" font-size="18">bound 256 → 84/90</text><rect x="40" y="135" width="170" height="45" rx="11" fill="#2b3b4f"/><rect x="40" y="135" width="58" height="45" rx="11" fill="#ffad4d"/><text x="125" y="235" text-anchor="middle" fill="#c9d5e5" font-size="16">D022 change</text><text x="125" y="275" text-anchor="middle" fill="#ffad4d" font-size="18" font-weight="700">0/30</text></g><g transform="translate(615 165)"><rect width="250" height="360" rx="22" fill="#2c2540" stroke="#bc9cff" stroke-width="3"/><text x="125" y="45" text-anchor="middle" fill="#bc9cff" font-size="23" font-weight="700">3 · WORK</text><text x="125" y="95" text-anchor="middle" fill="#eef7ff" font-size="18">fewer active tiles</text><g fill="#bc9cff"><rect x="45" y="135" width="40" height="40" rx="8"/><rect x="105" y="135" width="40" height="40" rx="8"/><rect x="165" y="135" width="40" height="40" rx="8"/></g><text x="125" y="235" text-anchor="middle" fill="#c9d5e5" font-size="16">same routes / count</text><text x="125" y="275" text-anchor="middle" fill="#bc9cff" font-size="18" font-weight="700">UNCHANGED</text></g><g transform="translate(890 165)"><rect width="245" height="360" rx="22" fill="#14263b" stroke="#56d8ff" stroke-width="3"/><text x="122" y="45" text-anchor="middle" fill="#56d8ff" font-size="23" font-weight="700">4 · DATAFLOW</text><text x="122" y="95" text-anchor="middle" fill="#eef7ff" font-size="18">remove bytes / edges</text><path d="M50 150H195" stroke="#56d8ff" stroke-width="8"/><path d="M183 136L209 150 183 164Z" fill="#56d8ff"/><path d="M75 130L175 170" stroke="#ff927f" stroke-width="5"/><path d="M175 130L75 170" stroke="#ff927f" stroke-width="5"/><text x="122" y="235" text-anchor="middle" fill="#c9d5e5" font-size="16">not attempted</text><text x="122" y="275" text-anchor="middle" fill="#56d8ff" font-size="18" font-weight="700">FUTURE VALUE</text></g><rect x="185" y="575" width="830" height="58" rx="16" fill="#361c21" stroke="#ff927f" stroke-width="2"/><text x="600" y="612" text-anchor="middle" fill="#ff927f" font-size="20" font-weight="700">A SMALLER REPRESENTATION IS NOT AUTOMATICALLY LESS EXECUTION</text></g></svg>
