<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">R99 isolated gate speedup versus joined-boundary regression</title><desc id="desc">A one-launch CUDA gate is much faster than split-K plus reduction in isolation, but the joined routed and shared boundary regresses in two no-profiler runs.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">R99: THE GATE GOT FASTER; THE JOIN DID NOT</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">Nine production route profiles · B200 TP2 boundary</text><g font-family="Arial, sans-serif"><g transform="translate(65 165)"><rect width="500" height="350" rx="24" fill="#183125" stroke="#a8ff60" stroke-width="3"/><text x="250" y="45" text-anchor="middle" fill="#a8ff60" font-size="24" font-weight="700">ISOLATED GATE</text><text x="55" y="105" fill="#eef7ff" font-size="18">cuBLASLt + reduction</text><rect x="55" y="125" width="360" height="45" rx="11" fill="#56d8ff"/><text x="430" y="155" fill="#56d8ff" font-size="16">11.776 μs</text><text x="55" y="220" fill="#eef7ff" font-size="18">R99 one launch</text><rect x="55" y="240" width="192" height="45" rx="11" fill="#a8ff60"/><text x="265" y="270" fill="#a8ff60" font-size="16">6.272 μs</text><text x="250" y="325" text-anchor="middle" fill="#a8ff60" font-size="25" font-weight="700">−46.74% NCU</text></g><g transform="translate(635 165)"><rect width="500" height="350" rx="24" fill="#361c21" stroke="#ff927f" stroke-width="3"/><text x="250" y="45" text-anchor="middle" fill="#ff927f" font-size="24" font-weight="700">JOINED NO-PROFILER</text><rect x="55" y="90" width="390" height="82" rx="16" fill="#361c21" stroke="#ff927f"/><text x="250" y="122" text-anchor="middle" fill="#eef7ff" font-size="17">Run 1</text><text x="250" y="151" text-anchor="middle" fill="#ff927f" font-size="21" font-weight="700">+0.3573 μs / boundary</text><rect x="55" y="205" width="390" height="82" rx="16" fill="#361c21" stroke="#ff927f"/><text x="250" y="237" text-anchor="middle" fill="#eef7ff" font-size="17">Run 2</text><text x="250" y="266" text-anchor="middle" fill="#ff927f" font-size="21" font-weight="700">+0.2293 μs / boundary</text><text x="250" y="325" text-anchor="middle" fill="#ff927f" font-size="25" font-weight="700">REJECTED TWICE</text></g><rect x="185" y="575" width="830" height="58" rx="16" fill="#24243a" stroke="#bc9cff" stroke-width="2"/><text x="600" y="612" text-anchor="middle" fill="#bc9cff" font-size="20" font-weight="700">PROFILER NODE SAVING IS ATTRIBUTION, NOT JOINED ADMISSION</text></g></svg>
