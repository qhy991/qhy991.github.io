<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Seven gates for GPU optimization candidates</title><desc id="desc">Applicability, build, correctness, materiality, operator, end-to-end and formal gates each have distinct stop outcomes and proof obligations.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/><g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">每一道 Gate 都能产生一个有意义的 STOP</text><text x="65" y="104" fill="#9aacbf" font-size="16">不是所有候选都应该运行 E2E，也不是所有 STOP 都表示 kernel 更慢。</text><g transform="translate(65 155)" text-anchor="middle" font-size="13"><g><rect width="135" height="210" rx="18" fill="#13283c" stroke="#70e6ff" stroke-width="2"/><text x="67" y="35" fill="#70e6ff" font-size="17" font-weight="700">G0</text><text x="67" y="66" fill="#eef7ff">PATH</text><text x="67" y="108" fill="#9aacbf">selector</text><text x="67" y="132" fill="#9aacbf">shape / ABI</text><text x="67" y="180" fill="#ffb15c">NOT APPLICABLE</text></g><g transform="translate(155)"><rect width="135" height="210" rx="18" fill="#182d24" stroke="#b8ff5b" stroke-width="2"/><text x="67" y="35" fill="#b8ff5b" font-size="17" font-weight="700">G1</text><text x="67" y="66" fill="#eef7ff">BUILD</text><text x="67" y="108" fill="#9aacbf">binary</text><text x="67" y="132" fill="#9aacbf">alignment</text><text x="67" y="180" fill="#ffb15c">ABI STOP</text></g><g transform="translate(310)"><rect width="135" height="210" rx="18" fill="#24243a" stroke="#b699ff" stroke-width="2"/><text x="67" y="35" fill="#b699ff" font-size="17" font-weight="700">G2</text><text x="67" y="66" fill="#eef7ff">CORRECT</text><text x="67" y="108" fill="#9aacbf">output/state</text><text x="67" y="132" fill="#9aacbf">token</text><text x="67" y="180" fill="#ff927f">REJECT</text></g><g transform="translate(465)"><rect width="135" height="210" rx="18" fill="#34271b" stroke="#ffb15c" stroke-width="2"/><text x="67" y="35" fill="#ffb15c" font-size="17" font-weight="700">G3</text><text x="67" y="66" fill="#eef7ff">VALUE</text><text x="67" y="108" fill="#9aacbf">A/A noise</text><text x="67" y="132" fill="#9aacbf">ceiling</text><text x="67" y="180" fill="#ffb15c">STOP</text></g><g transform="translate(620)"><rect width="135" height="210" rx="18" fill="#13283c" stroke="#70e6ff" stroke-width="2"/><text x="67" y="35" fill="#70e6ff" font-size="17" font-weight="700">G4</text><text x="67" y="66" fill="#eef7ff">OPERATOR</text><text x="67" y="108" fill="#9aacbf">paired</text><text x="67" y="132" fill="#9aacbf">material</text><text x="67" y="180" fill="#ff927f">REJECT</text></g><g transform="translate(775)"><rect width="135" height="210" rx="18" fill="#182d24" stroke="#b8ff5b" stroke-width="2"/><text x="67" y="35" fill="#b8ff5b" font-size="17" font-weight="700">G5</text><text x="67" y="66" fill="#eef7ff">E2E</text><text x="67" y="108" fill="#9aacbf">graph/model</text><text x="67" y="132" fill="#9aacbf">wall</text><text x="67" y="180" fill="#ff927f">REVERT</text></g><g transform="translate(930)"><rect width="135" height="210" rx="18" fill="#24243a" stroke="#b699ff" stroke-width="2"/><text x="67" y="35" fill="#b699ff" font-size="17" font-weight="700">G6</text><text x="67" y="66" fill="#eef7ff">FORMAL</text><text x="67" y="108" fill="#9aacbf">pairs</text><text x="67" y="132" fill="#9aacbf">holdout</text><text x="67" y="180" fill="#b8ff5b">ACCEPT</text></g></g><g transform="translate(150 415)"><rect width="900" height="125" rx="22" fill="#121b29" stroke="#34475c" stroke-width="2"/><text x="450" y="40" text-anchor="middle" fill="#eef7ff" font-size="20" font-weight="700">STOP RECEIPT</text><text x="450" y="75" text-anchor="middle" fill="#d9e7f5" font-size="15">proved facts · unrun levels · raw/source identity · rollback · reopen condition</text><text x="450" y="102" text-anchor="middle" fill="#9aacbf" font-size="13">“试过没用”不是可复用证据。</text></g><text x="600" y="615" text-anchor="middle" fill="#eef7ff" font-size="19" font-weight="700">越早用强证据剪枝，越少把 GPU 预算浪费在不可能晋级的分支。</text></g></svg>
