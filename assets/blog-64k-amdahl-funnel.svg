<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Amdahl funnel from leaf speedup to end-to-end value</title><desc id="desc">A 20 percent leaf speedup is reduced by path share, production ABI adapters, communication and overlap, leaving a small end-to-end ceiling.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/><g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">Leaf Speedup 经过四道漏斗才可能成为 E2E 收益</text><text x="65" y="104" fill="#9aacbf" font-size="16">每一层只保留真正暴露在 wall-clock critical path 上的部分。</text><g transform="translate(160 150)" text-anchor="middle"><path d="M0 0H880L750 100H130Z" fill="#70e6ff" opacity=".9"/><text x="440" y="57" fill="#0a0d0f" font-size="21" font-weight="700">LEAF CANDIDATE · 1.20×</text><path d="M130 120H750L640 220H240Z" fill="#b8ff5b" opacity=".9"/><text x="440" y="177" fill="#0a0d0f" font-size="19" font-weight="700">CRITICAL SHARE · f = 5%</text><path d="M240 240H640L560 340H320Z" fill="#b699ff" opacity=".9"/><text x="440" y="297" fill="#0a0d0f" font-size="18" font-weight="700">ABI / PATH / GRAPH</text><path d="M320 360H560L510 460H370Z" fill="#ffb15c" opacity=".9"/><text x="440" y="417" fill="#0a0d0f" font-size="17" font-weight="700">COMM / OVERLAP</text><rect x="345" y="500" width="190" height="74" rx="16" fill="#121b29" stroke="#eef7ff" stroke-width="3"/><text x="440" y="532" fill="#eef7ff" font-size="16">E2E ceiling</text><text x="440" y="558" fill="#b8ff5b" font-size="21" font-weight="700">≈ 0.84%</text></g><text x="600" y="640" text-anchor="middle" fill="#eef7ff" font-size="18" font-weight="700">低于 materiality floor 时，正确动作是 STOP，不是增加重复次数。</text></g></svg>
