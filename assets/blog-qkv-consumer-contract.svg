<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">QKV layout verdict belongs to the consumer</title><desc id="desc">Merged QKV loses when a compact-only consumer materializes strided views, then wins after a stride-generic consumer removes the copy.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b10"/><stop offset="1" stop-color="#111c30"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1024" height="1024" fill="url(#bg)"/><g opacity=".12" stroke="#8fa2bd"><path d="M0 170H1024M0 340H1024M0 510H1024M0 680H1024M0 850H1024"/><path d="M170 0V1024M340 0V1024M510 0V1024M680 0V1024M850 0V1024"/></g><g font-family="Inter,Arial,'PingFang SC',sans-serif" text-anchor="middle"><text x="512" y="72" fill="#eef7ff" font-size="35" font-weight="700">THE CONSUMER DECIDES THE LAYOUT</text><text x="512" y="110" fill="#8fa2bd" font-size="17" letter-spacing="2">MERGED QKV · STRIDE · CONTIGUOUS COPY · SIGN FLIP</text><g transform="translate(105 180)"><rect width="814" height="245" rx="25" fill="#361c21" stroke="#ff927f" stroke-width="3"/><text x="407" y="42" fill="#ff927f" font-size="23" font-weight="700">07-17 · COMPACT-ONLY CONSUMER</text><rect x="45" y="78" width="300" height="65" rx="14" fill="#14263b" stroke="#70e6ff" stroke-width="2"/><text x="195" y="118" fill="#70e6ff" font-size="18" font-weight="700">MERGED QKV VIEW</text><path d="M345 110H455" stroke="#ff927f" stroke-width="7"/><path d="M443 97L467 110 443 123Z" fill="#ff927f"/><rect x="470" y="78" width="300" height="65" rx="14" fill="#361c21" stroke="#ff927f" stroke-width="2"/><text x="620" y="105" fill="#ff927f" font-size="17" font-weight="700">CONTIGUOUS COPY</text><text x="620" y="132" fill="#eef7ff" font-size="15">5.86 ms</text><text x="407" y="195" fill="#a8ff60" font-size="24" font-weight="700">SPLIT WINS · 59.8 → 56.5 ms</text></g><path d="M512 440V500" stroke="#b699ff" stroke-width="8"/><polygon points="512,520 498,494 526,494" fill="#b699ff"/><g transform="translate(105 525)"><rect width="814" height="245" rx="25" fill="#183125" stroke="#a8ff60" stroke-width="3"/><text x="407" y="42" fill="#a8ff60" font-size="23" font-weight="700">07-20 · STRIDE-GENERIC CONSUMER</text><rect x="45" y="78" width="300" height="65" rx="14" fill="#14263b" stroke="#70e6ff" stroke-width="2"/><text x="195" y="118" fill="#70e6ff" font-size="18" font-weight="700">MERGED QKV VIEW</text><path d="M345 110H455" stroke="#a8ff60" stroke-width="7"/><path d="M443 97L467 110 443 123Z" fill="#a8ff60"/><rect x="470" y="78" width="300" height="65" rx="14" fill="#183125" stroke="#a8ff60" stroke-width="2"/><text x="620" y="105" fill="#a8ff60" font-size="17" font-weight="700">DIRECT CONSUME</text><text x="620" y="132" fill="#eef7ff" font-size="15">no materialization</text><text x="407" y="195" fill="#a8ff60" font-size="24" font-weight="700">MERGED WINS · 50.834 → 50.115 ms</text></g><g filter="url(#g)"><rect x="180" y="850" width="664" height="85" rx="22" fill="#24243a" stroke="#b699ff" stroke-width="4"/><text x="512" y="885" fill="#b699ff" font-size="20" font-weight="700">SAME VIEW · DIFFERENT CONSUMER · OPPOSITE VERDICT</text><text x="512" y="915" fill="#eef7ff" font-size="16">layout cost lives on the producer-consumer edge</text></g></g></svg>
