<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">Verify the path before the clock</title><desc id="desc">A native kernel passes through adapter, selector, phase and graph capture, while a zero-call guardrail cannot support a speed claim.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b10"/><stop offset="1" stop-color="#111c30"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1024" height="1024" fill="url(#bg)"/><g opacity=".12" stroke="#8fa2bd"><path d="M0 170H1024M0 340H1024M0 510H1024M0 680H1024M0 850H1024"/><path d="M170 0V1024M340 0V1024M510 0V1024M680 0V1024M850 0V1024"/></g><g font-family="Inter,Arial,'PingFang SC',sans-serif" text-anchor="middle"><text x="512" y="76" fill="#eef7ff" font-size="35" font-weight="700">VERIFY THE PATH</text><text x="512" y="113" fill="#8fa2bd" font-size="17" letter-spacing="2">BEFORE YOU TRUST THE CLOCK</text><g transform="translate(104 185)" font-size="15" font-weight="700"><g><rect width="180" height="78" rx="18" fill="#13283c" stroke="#70e6ff" stroke-width="3"/><text x="90" y="48" fill="#70e6ff">NATIVE LIBRARY</text></g><path d="M190 39H238" stroke="#b8ff5b" stroke-width="6"/><polygon points="248,39 230,29 230,49" fill="#b8ff5b"/><g transform="translate(258)"><rect width="150" height="78" rx="18" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="75" y="48" fill="#b8ff5b">ADAPTER</text></g><path d="M418 39H466" stroke="#b699ff" stroke-width="6"/><polygon points="476,39 458,29 458,49" fill="#b699ff"/><g transform="translate(486)"><rect width="150" height="78" rx="18" fill="#24243a" stroke="#b699ff" stroke-width="3"/><text x="75" y="48" fill="#b699ff">SELECTOR</text></g><path d="M646 39H694" stroke="#ffb15c" stroke-width="6"/><polygon points="704,39 686,29 686,49" fill="#ffb15c"/><g transform="translate(714)"><rect width="105" height="78" rx="18" fill="#34271b" stroke="#ffb15c" stroke-width="3"/><text x="52" y="48" fill="#ffb15c">GRAPH</text></g></g><g transform="translate(125 360)"><rect width="774" height="185" rx="25" fill="#111b29" stroke="#34475c" stroke-width="3"/><text x="387" y="47" fill="#eef7ff" font-size="22" font-weight="700">TIMED REGION RECEIPT</text><g transform="translate(52 82)" font-size="17" font-weight="700"><rect width="205" height="55" rx="14" fill="#182d24" stroke="#b8ff5b" stroke-width="2"/><text x="102" y="35" fill="#b8ff5b">DISPATCH = 864</text><rect x="232" width="205" height="55" rx="14" fill="#13283c" stroke="#70e6ff" stroke-width="2"/><text x="334" y="35" fill="#70e6ff">FALLBACK = 0</text><rect x="464" width="205" height="55" rx="14" fill="#24243a" stroke="#b699ff" stroke-width="2"/><text x="566" y="35" fill="#b699ff">CORRECT = YES</text></g></g><g filter="url(#g)"><rect x="205" y="635" width="614" height="146" rx="28" fill="#361c21" stroke="#ff927f" stroke-width="4"/><text x="512" y="687" fill="#ff927f" font-size="28" font-weight="700">ZERO CALLS</text><text x="512" y="730" fill="#eef7ff" font-size="20">NO CANDIDATE ATTRIBUTION</text><text x="512" y="760" fill="#9aacbf" font-size="15">a small delta is only guardrail noise</text></g><path d="M512 550V620" stroke="#ff927f" stroke-width="8"/><polygon points="512,633 499,609 525,609" fill="#ff927f"/><text x="512" y="900" fill="#b8ff5b" font-size="25" font-weight="700">PATH → CORRECTNESS → TIME → CLAIM</text><text x="512" y="940" fill="#8fa2bd" font-size="16">NEVER REVERSE THE ORDER</text></g></svg>
