<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">N6 evidence ladder</title>
  <desc id="desc">Correctness, formal paired measurements, independent holdout, and causal profile evidence for N6.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient></defs>
  <rect width="1200" height="675" fill="url(#bg)" rx="24"/>
  <g font-family="Inter,Arial,'PingFang SC',sans-serif">
    <text x="65" y="65" fill="#eef7ff" font-size="29" font-weight="700">四层证据：先证明走对路，再证明更快，最后解释为什么</text>
    <text x="65" y="101" fill="#9aacbf" font-size="16">Profiler timing 不参与正式加速百分比；四层证据回答不同问题。</text>
    <g transform="translate(65 145)">
      <rect width="250" height="420" rx="20" fill="#14263a" stroke="#70e6ff" stroke-width="2"/>
      <text x="24" y="40" fill="#70e6ff" font-size="18" font-weight="700">01 · CORRECTNESS</text>
      <text x="24" y="86" fill="#eef7ff" font-size="26" font-weight="700">PASS</text>
      <text x="24" y="122" fill="#d9e7f5" font-size="16">generated tokens exact</text>
      <text x="24" y="151" fill="#d9e7f5" font-size="16">against 2 references</text>
      <line x1="24" y1="182" x2="226" y2="182" stroke="#34475c"/>
      <text x="24" y="220" fill="#9aacbf" font-size="14">map SHA fixed</text>
      <text x="24" y="250" fill="#9aacbf" font-size="14">non-treatment args equal</text>
      <text x="24" y="280" fill="#9aacbf" font-size="14">selected marker required</text>
      <text x="24" y="355" fill="#70e6ff" font-size="42" font-weight="700">✓</text>
      <text x="78" y="352" fill="#eef7ff" font-size="16" font-weight="700">才允许比较性能</text>
    </g>
    <g transform="translate(335 145)">
      <rect width="250" height="420" rx="20" fill="#192d24" stroke="#b8ff5b" stroke-width="2"/>
      <text x="24" y="40" fill="#b8ff5b" font-size="18" font-weight="700">02 · FORMAL A/B</text>
      <text x="24" y="86" fill="#eef7ff" font-size="24" font-weight="700">5 paired runs</text>
      <text x="24" y="120" fill="#d9e7f5" font-size="16">P50 wins: 4 / 5</text>
      <text x="24" y="168" fill="#9aacbf" font-size="14">P50 TTFT</text>
      <rect x="24" y="183" width="196" height="22" rx="6" fill="#405064"/><rect x="24" y="183" width="186" height="22" rx="6" fill="#b8ff5b"/><text x="24" y="228" fill="#eef7ff" font-size="20" font-weight="700">−5.31%</text>
      <text x="24" y="273" fill="#9aacbf" font-size="14">Throughput</text>
      <rect x="24" y="288" width="182" height="22" rx="6" fill="#405064"/><rect x="24" y="288" width="196" height="22" rx="6" fill="#70e6ff"/><text x="24" y="333" fill="#eef7ff" font-size="20" font-weight="700">+7.53%</text>
      <text x="24" y="389" fill="#9aacbf" font-size="13">fresh-server · no profiler</text>
    </g>
    <g transform="translate(605 145)">
      <rect width="250" height="420" rx="20" fill="#24243a" stroke="#b699ff" stroke-width="2"/>
      <text x="24" y="40" fill="#b699ff" font-size="18" font-weight="700">03 · HOLDOUT</text>
      <text x="24" y="86" fill="#eef7ff" font-size="24" font-weight="700">new client seed</text>
      <text x="24" y="120" fill="#d9e7f5" font-size="16">P50 wins: 5 / 5</text>
      <text x="24" y="168" fill="#9aacbf" font-size="14">P50 TTFT</text>
      <rect x="24" y="183" width="196" height="22" rx="6" fill="#405064"/><rect x="24" y="183" width="185" height="22" rx="6" fill="#b699ff"/><text x="24" y="228" fill="#eef7ff" font-size="20" font-weight="700">−5.46%</text>
      <text x="24" y="273" fill="#9aacbf" font-size="14">Throughput</text>
      <rect x="24" y="288" width="182" height="22" rx="6" fill="#405064"/><rect x="24" y="288" width="195" height="22" rx="6" fill="#70e6ff"/><text x="24" y="333" fill="#eef7ff" font-size="20" font-weight="700">+7.40%</text>
      <text x="24" y="389" fill="#9aacbf" font-size="13">independent request order</text>
    </g>
    <g transform="translate(875 145)">
      <rect width="260" height="420" rx="20" fill="#34271b" stroke="#ffb15c" stroke-width="2"/>
      <text x="24" y="40" fill="#ffb15c" font-size="18" font-weight="700">04 · CAUSAL PROFILE</text>
      <text x="24" y="87" fill="#eef7ff" font-size="20" font-weight="700">progress calls</text>
      <text x="24" y="120" fill="#b8ff5b" font-size="27" font-weight="700">616 → 654</text>
      <text x="24" y="169" fill="#eef7ff" font-size="20" font-weight="700">notify wait P50</text>
      <text x="24" y="202" fill="#b8ff5b" font-size="27" font-weight="700">−43.65%</text>
      <text x="24" y="251" fill="#eef7ff" font-size="20" font-weight="700">combine P50</text>
      <text x="24" y="284" fill="#ffb15c" font-size="22" font-weight="700">≈ unchanged</text>
      <line x1="24" y1="315" x2="236" y2="315" stroke="#5a4530"/>
      <text x="24" y="348" fill="#9aacbf" font-size="13">解释机制，不作为</text>
      <text x="24" y="372" fill="#9aacbf" font-size="13">正式 TTFT 百分比</text>
    </g>
    <text x="600" y="625" text-anchor="middle" fill="#eef7ff" font-size="18" font-weight="700">四层证据不能互相替代，也不能从其中一层跳到“普遍更快”。</text>
  </g>
</svg>
