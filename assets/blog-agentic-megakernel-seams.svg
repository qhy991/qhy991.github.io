<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Three non-GEMM seams removed by LS18R</title><desc id="desc">The before path materializes RoPE output, launches two cache scatters, and materializes residual addition before RMSNorm. The after path uses in-place RoPE, one combined K/V scatter, and fused add RMSNorm.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3Z" fill="#8fa2bd"/></marker></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/><g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="66" fill="#eef7ff" font-size="30" font-weight="700">主 GEMM 不变，删除它周围反复出现的三类 Seam</text><text x="65" y="102" fill="#9aacbf" font-size="16">红色节点是可删除的 materialization / launch boundary。</text><text x="65" y="158" fill="#ff927f" font-size="20" font-weight="700">BEFORE</text><g transform="translate(65 185)" text-anchor="middle" font-size="15"><g><rect width="150" height="82" rx="14" fill="#13283c" stroke="#70e6ff" stroke-width="2"/><text x="75" y="48" fill="#eef7ff">QKV GEMM</text></g><path d="M150 41H190" stroke="#8fa2bd" stroke-width="3" marker-end="url(#a)"/><g transform="translate(200)"><rect width="150" height="82" rx="14" fill="#2b2020" stroke="#ff927f" stroke-width="2"/><text x="75" y="34" fill="#ff927f">RoPE temp</text><text x="75" y="58" fill="#d9e7f5" font-size="13">materialize</text></g><path d="M350 41H390" stroke="#8fa2bd" stroke-width="3" marker-end="url(#a)"/><g transform="translate(400)"><rect width="120" height="82" rx="14" fill="#2b2020" stroke="#ff927f" stroke-width="2"/><text x="60" y="48" fill="#ff927f">K scatter</text></g><path d="M520 41H560" stroke="#8fa2bd" stroke-width="3" marker-end="url(#a)"/><g transform="translate(570)"><rect width="120" height="82" rx="14" fill="#2b2020" stroke="#ff927f" stroke-width="2"/><text x="60" y="48" fill="#ff927f">V scatter</text></g><g transform="translate(745)"><rect width="145" height="82" rx="14" fill="#13283c" stroke="#70e6ff" stroke-width="2"/><text x="72" y="48" fill="#eef7ff">Residual add</text></g><path d="M890 41H930" stroke="#8fa2bd" stroke-width="3" marker-end="url(#a)"/><g transform="translate(940)"><rect width="145" height="82" rx="14" fill="#2b2020" stroke="#ff927f" stroke-width="2"/><text x="72" y="34" fill="#ff927f">residual temp</text><text x="72" y="58" fill="#d9e7f5" font-size="13">HBM round trip</text></g></g><line x1="65" y1="318" x2="1135" y2="318" stroke="#34475c"/><text x="65" y="378" fill="#b8ff5b" font-size="20" font-weight="700">AFTER</text><g transform="translate(130 420)" text-anchor="middle" font-size="16"><g><rect width="250" height="112" rx="18" fill="#13283c" stroke="#70e6ff" stroke-width="3"/><text x="125" y="44" fill="#70e6ff" font-weight="700">QKV GEMM + RoPE</text><text x="125" y="77" fill="#d9e7f5" font-size="14">in-place ownership</text></g><path d="M250 56H340" stroke="#b8ff5b" stroke-width="5" marker-end="url(#a)"/><g transform="translate(360)"><rect width="250" height="112" rx="18" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="125" y="44" fill="#b8ff5b" font-weight="700">ONE [K|V] SCATTER</text><text x="125" y="77" fill="#d9e7f5" font-size="14">shared index / one launch</text></g><g transform="translate(720)"><rect width="250" height="112" rx="18" fill="#34271b" stroke="#ffb15c" stroke-width="3"/><text x="125" y="44" fill="#ffb15c" font-weight="700">ADD + RMSNORM</text><text x="125" y="77" fill="#d9e7f5" font-size="14">one consumer boundary</text></g></g><text x="600" y="608" text-anchor="middle" fill="#eef7ff" font-size="19" font-weight="700">每层少一点物化，每个 decode step 都少一点固定成本。</text></g></svg>
