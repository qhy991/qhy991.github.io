<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Leaf win can reverse end to end</title><desc id="desc">A fast isolated kernel is diluted or reversed by call frequency, communication, scheduling, tail and new overhead in the full graph.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/><g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">Leaf Win 到 E2E 之间还有一整张系统图</text><text x="65" y="104" fill="#9aacbf" font-size="16">局部更快只获得进入下一门的资格，不获得 baseline 身份。</text><g transform="translate(70 165)"><rect width="300" height="210" rx="22" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="150" y="45" text-anchor="middle" fill="#b8ff5b" font-size="21" font-weight="700">LEAF KERNEL</text><text x="150" y="95" text-anchor="middle" fill="#eef7ff" font-size="35" font-weight="700">−59.1%</text><text x="150" y="135" text-anchor="middle" fill="#d9e7f5" font-size="15">correct exact-shape boundary</text><text x="150" y="170" text-anchor="middle" fill="#9aacbf" font-size="13">N40 SwiGLU + quant</text><g transform="translate(410)"><rect width="650" height="210" rx="22" fill="#121b29" stroke="#34475c" stroke-width="3"/><text x="325" y="42" text-anchor="middle" fill="#eef7ff" font-size="20" font-weight="700">FULL SYSTEM ADDS</text><g transform="translate(35 75)" text-anchor="middle" font-size="14"><rect width="130" height="62" rx="11" fill="#24303f"/><text x="65" y="38" fill="#d9e7f5">launch/adapter</text><g transform="translate(150)"><rect width="130" height="62" rx="11" fill="#24303f"/><text x="65" y="38" fill="#d9e7f5">DeepEP/NCCL</text></g><g transform="translate(300)"><rect width="130" height="62" rx="11" fill="#24303f"/><text x="65" y="38" fill="#d9e7f5">stream/graph</text></g><g transform="translate(450)"><rect width="130" height="62" rx="11" fill="#24303f"/><text x="65" y="38" fill="#d9e7f5">rank tail</text></g></g><text x="325" y="175" text-anchor="middle" fill="#ffb15c" font-size="16">new boundary can change scheduling and empty-rank behavior</text></g></g><path d="M220 375C220 490 500 450 550 520" stroke="#b8ff5b" stroke-width="6" fill="none"/><path d="M805 375C805 490 670 450 650 520" stroke="#ff927f" stroke-width="6" fill="none"/><rect x="385" y="515" width="430" height="95" rx="20" fill="#2b2020" stroke="#ff927f" stroke-width="3"/><text x="600" y="553" text-anchor="middle" fill="#ff927f" font-size="21" font-weight="700">E2E REJECT</text><text x="600" y="584" text-anchor="middle" fill="#eef7ff" font-size="15">P50 +1.56% · P90 +18.61% · throughput −6.01%</text><text x="600" y="645" text-anchor="middle" fill="#9aacbf" font-size="15">保留 leaf 机制，回滚 serving candidate；两个结论可以同时为真。</text></g></svg>
