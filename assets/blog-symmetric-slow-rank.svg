<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Slow-rank timing and join critical path</title><desc id="desc">A multi-rank stage completes at the maximum rank time, so average improvements can be irrelevant if the slow rank and join do not move.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/><g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">多 GPU 阶段结束在最慢 Rank，而不是平均 Rank</text><text x="65" y="104" fill="#9aacbf" font-size="16">只有移动 max-rank envelope 的 saving 才能推进下游 join。</text><g transform="translate(80 170)"><text x="0" y="0" fill="#70e6ff" font-size="19" font-weight="700">CONTROL</text><text x="0" y="60" fill="#d9e7f5" font-size="15">rank 0</text><rect x="100" y="34" width="610" height="42" rx="9" fill="#70e6ff"/><text x="0" y="135" fill="#d9e7f5" font-size="15">rank 1</text><rect x="100" y="109" width="760" height="42" rx="9" fill="#b8ff5b"/><line x1="860" y1="20" x2="860" y2="175" stroke="#ffb15c" stroke-width="4"/><text x="860" y="198" text-anchor="middle" fill="#ffb15c" font-size="14">join at slow rank</text></g><g transform="translate(80 390)"><text x="0" y="0" fill="#b8ff5b" font-size="19" font-weight="700">CANDIDATE A · FAST RANK ONLY</text><text x="0" y="60" fill="#d9e7f5" font-size="15">rank 0</text><rect x="100" y="34" width="470" height="42" rx="9" fill="#70e6ff"/><text x="0" y="135" fill="#d9e7f5" font-size="15">rank 1</text><rect x="100" y="109" width="760" height="42" rx="9" fill="#b8ff5b"/><line x1="860" y1="20" x2="860" y2="175" stroke="#ff927f" stroke-width="4"/><text x="860" y="198" text-anchor="middle" fill="#ff927f" font-size="14">stage unchanged</text><g transform="translate(900 30)"><rect width="210" height="120" rx="18" fill="#182d24" stroke="#b8ff5b" stroke-width="2"/><text x="105" y="40" text-anchor="middle" fill="#eef7ff" font-size="15">authority</text><text x="105" y="76" text-anchor="middle" fill="#b8ff5b" font-size="21" font-weight="700">max(T₀,T₁)</text><text x="105" y="101" text-anchor="middle" fill="#9aacbf" font-size="13">rank-max / wall</text></g></g><text x="600" y="635" text-anchor="middle" fill="#eef7ff" font-size="19" font-weight="700">单 rank、平均 rank 和 kernel-sum 都可能掩盖真正的 join tail。</text></g></svg>
