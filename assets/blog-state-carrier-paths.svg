<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Direct, cp.async and TMA state-carrier paths</title><desc id="desc">Direct loads move one-shot state from global memory to registers; cp.async and TMA add a shared-memory stage and synchronization before the same recurrence.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="34" font-weight="700">THE DESTINATION MATTERS MORE THAN THE OPCODE NAME</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">All three move the same 32 KiB state and execute the same recurrence</text><g font-family="Arial, sans-serif"><g transform="translate(65 165)"><rect width="1070" height="105" rx="20" fill="#183125" stroke="#a8ff60" stroke-width="3"/><text x="30" y="38" fill="#a8ff60" font-size="22" font-weight="700">DIRECT</text><text x="205" y="64" fill="#eef7ff" font-size="18">GMEM</text><path d="M285 56H650" stroke="#a8ff60" stroke-width="8"/><path d="M638 42L664 56 638 70Z" fill="#a8ff60"/><text x="735" y="64" fill="#eef7ff" font-size="18">REGISTER</text><path d="M820 56H870" stroke="#a8ff60" stroke-width="8"/><path d="M858 42L884 56 858 70Z" fill="#a8ff60"/><text x="1040" y="64" text-anchor="end" fill="#a8ff60" font-size="17" font-weight="700">RECURRENCE</text></g><g transform="translate(65 300)"><rect width="1070" height="125" rx="20" fill="#361c21" stroke="#ff927f" stroke-width="3"/><text x="30" y="38" fill="#ff927f" font-size="22" font-weight="700">cp.async</text><text x="205" y="74" fill="#eef7ff" font-size="18">GMEM</text><path d="M285 66H440" stroke="#ff927f" stroke-width="7"/><path d="M428 52L454 66 428 80Z" fill="#ff927f"/><rect x="465" y="28" width="200" height="76" rx="15" fill="#361c21" stroke="#ff927f" stroke-width="2"/><text x="565" y="57" text-anchor="middle" fill="#ff927f" font-size="17" font-weight="700">32 KiB SMEM</text><text x="565" y="84" text-anchor="middle" fill="#eef7ff" font-size="14">wait_group + barrier</text><path d="M665 66H800" stroke="#ff927f" stroke-width="7"/><path d="M788 52L814 66 788 80Z" fill="#ff927f"/><text x="850" y="74" fill="#eef7ff" font-size="18">REG</text><text x="1040" y="74" text-anchor="end" fill="#ff927f" font-size="17" font-weight="700">2 HOPS</text></g><g transform="translate(65 455)"><rect width="1070" height="125" rx="20" fill="#34271b" stroke="#ffb15c" stroke-width="3"/><text x="30" y="38" fill="#ffb15c" font-size="22" font-weight="700">TMA</text><text x="205" y="74" fill="#eef7ff" font-size="18">GMEM</text><path d="M285 66H440" stroke="#ffb15c" stroke-width="7"/><path d="M428 52L454 66 428 80Z" fill="#ffb15c"/><rect x="465" y="28" width="200" height="76" rx="15" fill="#34271b" stroke="#ffb15c" stroke-width="2"/><text x="565" y="57" text-anchor="middle" fill="#ffb15c" font-size="17" font-weight="700">32 KiB SMEM</text><text x="565" y="84" text-anchor="middle" fill="#eef7ff" font-size="14">mbarrier + LDS</text><path d="M665 66H800" stroke="#ffb15c" stroke-width="7"/><path d="M788 52L814 66 788 80Z" fill="#ffb15c"/><text x="850" y="74" fill="#eef7ff" font-size="18">REG</text><text x="1040" y="74" text-anchor="end" fill="#ffb15c" font-size="16" font-weight="700">1 ISSUE · 2 HOPS</text></g><text x="600" y="635" text-anchor="middle" fill="#bc9cff" font-size="21" font-weight="700">ASYNC COPY CAN HIDE ARRIVAL; IT CANNOT ERASE SMEM→REGISTER</text></g></svg>
