<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc"><title id="title">Asynchronous CUDA optimization sign reversal</title><desc id="desc">Named barriers win in a 16-warp single-decode kernel, while phase fusion, pending TMA stores, and L2 prefetch lose or fail their gates in different execution shapes.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b10"/><stop offset="1" stop-color="#111c30"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1024" height="1024" fill="url(#bg)"/><g opacity=".12" stroke="#8fa2bd"><path d="M0 170H1024M0 340H1024M0 510H1024M0 680H1024M0 850H1024"/><path d="M170 0V1024M340 0V1024M510 0V1024M680 0V1024M850 0V1024"/></g><g font-family="Inter,Arial,'PingFang SC',sans-serif" text-anchor="middle"><text x="512" y="72" fill="#eef7ff" font-size="36" font-weight="700">WHEN ASYNC CHANGES SIGN</text><text x="512" y="108" fill="#8fa2bd" font-size="17" letter-spacing="2">OWNERSHIP · OCCUPANCY · DEPENDENCY · LIVE STATE</text><g transform="translate(72 175)" font-size="17" font-weight="700"><g><rect width="205" height="170" rx="22" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="102" y="43" fill="#b8ff5b">NAMED BARRIER</text><text x="102" y="78" fill="#eef7ff" font-size="15">16 warps · 4 tz groups</text><text x="102" y="113" fill="#b8ff5b" font-size="24">−4.45%</text><text x="102" y="143" fill="#9aacbf" font-size="13">independent ownership</text></g><g transform="translate(225)"><rect width="205" height="170" rx="22" fill="#2b2020" stroke="#ff927f" stroke-width="3"/><text x="102" y="43" fill="#ff927f">PHASE FUSION</text><text x="102" y="78" fill="#eef7ff" font-size="15">4 warps · 8 blocks/SM</text><text x="102" y="113" fill="#ff927f" font-size="24">+2.9–4.5%</text><text x="102" y="143" fill="#9aacbf" font-size="13">wait K → wait K+V</text></g><g transform="translate(450)"><rect width="205" height="170" rx="22" fill="#2b2020" stroke="#ff927f" stroke-width="3"/><text x="102" y="43" fill="#ff927f">TMA PENDING1</text><text x="102" y="78" fill="#eef7f5" font-size="15">depth4 full Graph</text><text x="102" y="113" fill="#ff927f" font-size="24">+0.704%</text><text x="102" y="143" fill="#9aacbf" font-size="13">live state + waits</text></g><g transform="translate(675)"><rect width="205" height="170" rx="22" fill="#34271b" stroke="#ffb15c" stroke-width="3"/><text x="102" y="43" fill="#ffb15c">L2 PREFETCH</text><text x="102" y="78" fill="#eef7ff" font-size="15">distance 1 / 2</text><text x="102" y="113" fill="#ffb15c" font-size="24">0 / 6 pass</text><text x="102" y="143" fill="#9aacbf" font-size="13">below 1% gate</text></g></g><g filter="url(#g)"><path d="M174 345C174 455 430 420 475 510M399 345C399 455 470 440 495 510M624 345C624 455 554 440 529 510M849 345C849 455 594 420 549 510" fill="none" stroke="#70e6ff" stroke-width="5"/><rect x="327" y="510" width="370" height="180" rx="25" fill="#15263a" stroke="#70e6ff" stroke-width="4"/><text x="512" y="557" fill="#70e6ff" font-size="24" font-weight="700">NET ASYNC VALUE</text><text x="512" y="602" fill="#eef7ff" font-size="19">hidden critical stall</text><text x="512" y="638" fill="#ffb15c" font-size="19">− sync · state · resource · dependency cost</text></g><path d="M512 690V770" stroke="#b8ff5b" stroke-width="9"/><polygon points="512,790 498,764 526,764" fill="#b8ff5b"/><rect x="170" y="800" width="684" height="112" rx="23" fill="#121b29" stroke="#b8ff5b" stroke-width="3"/><text x="512" y="844" fill="#eef7ff" font-size="24" font-weight="700">OPTIMIZE THE EXPOSED WINDOW</text><text x="512" y="880" fill="#9aacbf" font-size="16">not barrier count · not overlap percentage · not pipeline depth</text><text x="512" y="963" fill="#ffb15c" font-size="22" font-weight="700">ASYNC IS A CONTRACT, NOT A FREE SPEEDUP</text></g></svg>
