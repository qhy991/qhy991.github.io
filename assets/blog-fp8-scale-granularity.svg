<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Rowwise and block-scaled FP8 granularity</title><desc id="desc">Rowwise and per-channel scales provide finer numerical adaptation, while one-by-128 activation and 128-by-128 weight blocks use coarser power-of-two UE8M0 scales aligned to SM100 pipelines.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="32" font-weight="700">SCALE GRANULARITY CHANGES ERROR AND HARDWARE PATH</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">Same E4M3 payload family · different scale protocol</text><g font-family="Arial, sans-serif"><g transform="translate(65 165)"><rect width="500" height="390" rx="24" fill="#14263b" stroke="#70e6ff" stroke-width="3"/><text x="250" y="45" text-anchor="middle" fill="#70e6ff" font-size="24" font-weight="700">ROWWISE / PER-CHANNEL</text><g transform="translate(55 95)"><rect width="390" height="45" rx="11" fill="#70e6ff"/><rect y="65" width="390" height="45" rx="11" fill="#70e6ff"/><rect y="130" width="390" height="45" rx="11" fill="#70e6ff"/><text x="195" y="210" text-anchor="middle" fill="#eef7ff" font-size="18">one flexible FP32 scale per row</text><text x="195" y="240" text-anchor="middle" fill="#c9d5e5" font-size="16">finer numerical adaptation</text></g><text x="250" y="365" text-anchor="middle" fill="#70e6ff" font-size="20" font-weight="700">B1-SAFE BASELINE</text></g><g transform="translate(635 165)"><rect width="500" height="390" rx="24" fill="#183125" stroke="#a8ff60" stroke-width="3"/><text x="250" y="45" text-anchor="middle" fill="#a8ff60" font-size="24" font-weight="700">BLOCK-SCALED UE8M0</text><g transform="translate(55 95)" fill="#a8ff60"><rect width="85" height="85" rx="12"/><rect x="100" width="85" height="85" rx="12"/><rect x="200" width="85" height="85" rx="12"/><rect x="300" width="85" height="85" rx="12"/><rect y="100" width="85" height="85" rx="12"/><rect x="100" y="100" width="85" height="85" rx="12"/><rect x="200" y="100" width="85" height="85" rx="12"/><rect x="300" y="100" width="85" height="85" rx="12"/></g><text x="250" y="320" text-anchor="middle" fill="#eef7ff" font-size="18">1×128 activation · 128×128 weight</text><text x="250" y="350" text-anchor="middle" fill="#c9d5e5" font-size="16">power-of-two · TMA-aligned layout</text></g><rect x="185" y="595" width="830" height="50" rx="14" fill="#24243a" stroke="#b699ff" stroke-width="2"/><text x="600" y="627" text-anchor="middle" fill="#b699ff" font-size="19" font-weight="700">COARSER SCALE CAN IMPROVE THROUGHPUT WHILE REDUCING MODEL MARGIN</text></g></svg>
