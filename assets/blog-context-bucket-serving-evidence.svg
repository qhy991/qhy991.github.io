<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Context-bucket savings transfer from focused graph to serving</title><desc id="desc">The focused decode graph saves 20.1 percent and the complete capacity-16 serving workload improves 13.83 percent with correctness and opposite-order evidence.</desc><rect width="1200" height="675" rx="24" fill="#0b111c"/><text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="32" font-weight="700">PHYSICAL WORK REMOVAL SURVIVES SERVING</text><text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">Focused graph locates the mechanism; C16 A/B decides promotion</text><g font-family="Arial, sans-serif"><g transform="translate(65 165)"><rect width="500" height="340" rx="24" fill="#183125" stroke="#a8ff60" stroke-width="3"/><text x="250" y="45" text-anchor="middle" fill="#a8ff60" font-size="24" font-weight="700">FOCUSED DECODE</text><text x="250" y="120" text-anchor="middle" fill="#eef7ff" font-size="20">K2048 → live K bucket</text><text x="250" y="190" text-anchor="middle" fill="#a8ff60" font-size="34" font-weight="700">−20.1%</text><text x="250" y="235" text-anchor="middle" fill="#eef7ff" font-size="18">−0.6857 ms / step</text><text x="250" y="290" text-anchor="middle" fill="#c9d5e5" font-size="16">mechanism / local boundary</text></g><path d="M565 335H625" stroke="#b699ff" stroke-width="7"/><path d="M613 322L637 335 613 348Z" fill="#b699ff"/><g transform="translate(635 165)"><rect width="500" height="340" rx="24" fill="#14263b" stroke="#70e6ff" stroke-width="3"/><text x="250" y="45" text-anchor="middle" fill="#70e6ff" font-size="24" font-weight="700">HTTP C16 SERVING</text><text x="250" y="115" text-anchor="middle" fill="#eef7ff" font-size="19">2803.6 → 3191.3 tok/s</text><text x="250" y="180" text-anchor="middle" fill="#70e6ff" font-size="34" font-weight="700">+13.83%</text><text x="250" y="225" text-anchor="middle" fill="#eef7ff" font-size="18">orders +15.58 / +11.73%</text><text x="250" y="270" text-anchor="middle" fill="#c9d5e5" font-size="16">1920/1920 · gate PASS</text><text x="250" y="300" text-anchor="middle" fill="#c9d5e5" font-size="16">qualified default-on evidence</text></g><rect x="80" y="565" width="1040" height="60" rx="16" fill="#24243a" stroke="#b699ff" stroke-width="2"/><text x="600" y="603" text-anchor="middle" fill="#b699ff" font-size="18" font-weight="700">E2E GAIN &lt; LOCAL GAIN BECAUSE PREFILL / SCHEDULER / OTHER KERNELS REMAIN</text></g></svg>
