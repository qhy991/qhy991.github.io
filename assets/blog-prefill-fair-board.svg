<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Fair same-workload true-batched prefill comparison</title>
  <desc id="desc">OMoE is slightly slower than SGLang at B16 T128, slower at B16 T512, and faster at B64 T128, showing strong shape dependence after the false baseline is removed.</desc>
  <rect width="1200" height="675" rx="24" fill="#0b111c"/>
  <text x="65" y="70" fill="#eef7ff" font-family="Arial, sans-serif" font-size="32" font-weight="700">FAIR BOARD STILL DEPENDS ON B/T SHAPE</text>
  <text x="65" y="108" fill="#9fb1c8" font-family="Arial, sans-serif" font-size="19">BF16 true-batched whole-prefill · one B200</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(65 165)">
      <rect width="330" height="380" rx="24" fill="#34271b" stroke="#ffb15c" stroke-width="3"/>
      <text x="165" y="45" text-anchor="middle" fill="#ffb15c" font-size="23" font-weight="700">B16×T128</text>
      <text x="55" y="115" fill="#eef7ff" font-size="17">OMoE</text><text x="275" y="115" text-anchor="end" fill="#70e6ff" font-size="20" font-weight="700">15.5 ms</text>
      <text x="55" y="175" fill="#eef7ff" font-size="17">SGLang</text><text x="275" y="175" text-anchor="end" fill="#a8ff60" font-size="20" font-weight="700">15.03 ms</text>
      <text x="165" y="260" text-anchor="middle" fill="#ffb15c" font-size="27" font-weight="700">1.03× SLOWER</text><text x="165" y="310" text-anchor="middle" fill="#c9d5e5" font-size="16">near parity</text>
    </g>
    <g transform="translate(435 165)">
      <rect width="330" height="380" rx="24" fill="#361c21" stroke="#ff927f" stroke-width="3"/>
      <text x="165" y="45" text-anchor="middle" fill="#ff927f" font-size="23" font-weight="700">B16×T512</text>
      <text x="55" y="115" fill="#eef7ff" font-size="17">OMoE</text><text x="275" y="115" text-anchor="end" fill="#70e6ff" font-size="20" font-weight="700">59.5 ms</text>
      <text x="55" y="175" fill="#eef7ff" font-size="17">SGLang</text><text x="275" y="175" text-anchor="end" fill="#a8ff60" font-size="20" font-weight="700">50.89 ms</text>
      <text x="165" y="260" text-anchor="middle" fill="#ff927f" font-size="27" font-weight="700">1.17× SLOWER</text><text x="165" y="310" text-anchor="middle" fill="#c9d5e5" font-size="16">non-GEMM gap remains</text>
    </g>
    <g transform="translate(805 165)">
      <rect width="330" height="380" rx="24" fill="#183125" stroke="#a8ff60" stroke-width="3"/>
      <text x="165" y="45" text-anchor="middle" fill="#a8ff60" font-size="23" font-weight="700">B64×T128</text>
      <text x="55" y="115" fill="#eef7ff" font-size="17">OMoE</text><text x="275" y="115" text-anchor="end" fill="#70e6ff" font-size="20" font-weight="700">60.0 ms</text>
      <text x="55" y="175" fill="#eef7ff" font-size="17">SGLang</text><text x="275" y="175" text-anchor="end" fill="#ff927f" font-size="20" font-weight="700">128.08 ms</text>
      <text x="165" y="260" text-anchor="middle" fill="#a8ff60" font-size="27" font-weight="700">2.13× FASTER</text><text x="165" y="310" text-anchor="middle" fill="#c9d5e5" font-size="16">different B/T geometry</text>
    </g>
    <rect x="180" y="590" width="840" height="50" rx="14" fill="#24243a" stroke="#b699ff" stroke-width="2"/>
    <text x="600" y="622" text-anchor="middle" fill="#b699ff" font-size="19" font-weight="700">DO NOT CHERRY-PICK ONE SHAPE OR COMPARE AGAINST THE 409 ms SERIAL PATH</text>
  </g>
</svg>
