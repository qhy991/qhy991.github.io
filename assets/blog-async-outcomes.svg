<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Async optimization outcomes across four execution shapes</title><desc id="desc">Named barriers win when they hide exposed stalls with independent ownership, while batch phase fusion, pending TMA stores, and L2 prefetch lose when dependency, state, or resource costs dominate.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0d0f"/><stop offset="1" stop-color="#142035"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)" rx="24"/><g font-family="Inter,Arial,'PingFang SC',sans-serif"><text x="65" y="68" fill="#eef7ff" font-size="30" font-weight="700">异步净收益 = 隐藏的关键 Stall − 新增成本</text><text x="65" y="104" fill="#9aacbf" font-size="16">结构更漂亮、overlap 更多、barrier 更少，都不是独立验收指标。</text><g transform="translate(65 155)" font-size="15"><g><rect width="250" height="375" rx="21" fill="#182d24" stroke="#b8ff5b" stroke-width="3"/><text x="24" y="42" fill="#b8ff5b" font-size="19" font-weight="700">SINGLE NAMED BAR</text><text x="24" y="76" fill="#d9e7f5">16 warps · 4 tz groups</text><text x="24" y="116" fill="#9aacbf">Hidden:</text><text x="24" y="143" fill="#eef7ff">同相 MIO/FMA burst</text><text x="24" y="181" fill="#9aacbf">Added:</text><text x="24" y="208" fill="#eef7ff">小，ownership 独立</text><line x1="24" y1="246" x2="226" y2="246" stroke="#40564a"/><text x="24" y="290" fill="#b8ff5b" font-size="28" font-weight="700">−4.45%</text><text x="24" y="326" fill="#d9e7f5">WIN</text></g><g transform="translate(270)"><rect width="250" height="375" rx="21" fill="#2b2020" stroke="#ff927f" stroke-width="3"/><text x="24" y="42" fill="#ff927f" font-size="19" font-weight="700">BATCH PHASE FUSE</text><text x="24" y="76" fill="#d9e7f5">4 warps · 8 blocks/SM</text><text x="24" y="116" fill="#9aacbf">Removed:</text><text x="24" y="143" fill="#eef7ff">便宜的 barrier</text><text x="24" y="181" fill="#9aacbf">Added:</text><text x="24" y="208" fill="#eef7ff">QK 等待 K+V</text><line x1="24" y1="246" x2="226" y2="246" stroke="#604040"/><text x="24" y="290" fill="#ff927f" font-size="28" font-weight="700">+2.9–4.5%</text><text x="24" y="326" fill="#d9e7f5">LOSE</text></g><g transform="translate(540)"><rect width="250" height="375" rx="21" fill="#2b2020" stroke="#ff927f" stroke-width="3"/><text x="24" y="42" fill="#ff927f" font-size="19" font-weight="700">HAZY PENDING1</text><text x="24" y="76" fill="#d9e7f5">depth4 full-model Graph</text><text x="24" y="116" fill="#9aacbf">Target:</text><text x="24" y="143" fill="#eef7ff">覆盖 TMA store wait</text><text x="24" y="181" fill="#9aacbf">Added:</text><text x="24" y="208" fill="#eef7ff">ring / lifetime / drain</text><line x1="24" y1="246" x2="226" y2="246" stroke="#604040"/><text x="24" y="290" fill="#ff927f" font-size="28" font-weight="700">+0.704%</text><text x="24" y="326" fill="#d9e7f5">REJECT</text></g><g transform="translate(810)"><rect width="250" height="375" rx="21" fill="#34271b" stroke="#ffb15c" stroke-width="3"/><text x="24" y="42" fill="#ffb15c" font-size="19" font-weight="700">HAZY L2 PREFETCH</text><text x="24" y="76" fill="#d9e7f5">distance 1/2 · pos 0/4K/8K</text><text x="24" y="116" fill="#9aacbf">Target:</text><text x="24" y="143" fill="#eef7ff">覆盖 future weight miss</text><text x="24" y="181" fill="#9aacbf">Added:</text><text x="24" y="208" fill="#eef7ff">issue / registers / L2 pollution</text><line x1="24" y1="246" x2="226" y2="246" stroke="#60492f"/><text x="24" y="290" fill="#ffb15c" font-size="28" font-weight="700">0 / 6 pass</text><text x="24" y="326" fill="#d9e7f5">CLOSE</text></g></g><text x="600" y="592" text-anchor="middle" fill="#eef7ff" font-size="20" font-weight="700">只有 matched no-profiler latency 能决定符号；Profiler 只负责解释。</text></g></svg>
