<svg xmlns="http://www.w3.org/2000/svg" width="430" height="600" viewBox="0 0 430 600" role="img" aria-labelledby="title desc">
  <title id="title">EngineTailor overview</title>
  <desc id="desc">A registered target informs a Manager and isolated Workers. Their candidate must pass independent verification before the engine advances. Outcomes and runnable variants are retained.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#71849e"/></marker></defs>
  <rect width="430" height="600" fill="#f3f6fa"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="30" y="36" font-size="11" letter-spacing="1.2" fill="#234e86">REGISTERED TARGET</text>
    <text x="30" y="60" font-size="14" fill="#556477">Model · Device · Workload</text>
    <path d="M30 80h370" stroke="#d6dee9"/>
    <text x="30" y="109" font-size="10" letter-spacing="1.1" fill="#788595">AGENT IMPLEMENTATION</text>
    <g fill="#fff" stroke="#bdcadb"><rect x="30" y="127" width="160" height="66" rx="3"/><rect x="240" y="127" width="160" height="66" rx="3"/><rect x="240" y="228" width="160" height="66" rx="3"/></g>
    <g fill="#1c2735" font-size="15" text-anchor="middle"><text x="110" y="154">Manager</text><text x="320" y="154">Workers</text><text x="320" y="254">Candidate</text></g>
    <g fill="#6c7785" font-size="11" text-anchor="middle"><text x="110" y="176">Task contracts</text><text x="320" y="176">Isolated worktrees</text><text x="320" y="276">Recorded base revision</text></g>
    <g fill="none" stroke="#71849e" stroke-width="1.3" marker-end="url(#arrow)"><path d="M190 160h49"/><path d="M320 194v33"/><path d="M320 295v66"/><path d="M320 428v33"/></g>
    <path d="M30 323h370" stroke="#93a8c3" stroke-dasharray="4 5"/>
    <text x="30" y="347" font-size="10" letter-spacing="1.1" fill="#234e86">PROTECTED VERIFICATION</text>
    <rect x="190" y="362" width="210" height="66" rx="3" fill="#e7eef8" stroke="#7c9bc2"/>
    <text x="295" y="389" text-anchor="middle" font-size="15" fill="#1c2735">Correctness + E2E</text>
    <text x="295" y="411" text-anchor="middle" font-size="11" fill="#6c7785">Gate and independent re-verification</text>
    <rect x="240" y="462" width="160" height="66" rx="3" fill="#fff" stroke="#7c9bc2"/>
    <text x="320" y="489" text-anchor="middle" font-size="15" fill="#1c2735">Next engine state</text>
    <text x="320" y="511" text-anchor="middle" font-size="11" fill="#6c7785">Admitted changes only</text>
    <path d="M190 395H55V194" fill="none" stroke="#93a5bd" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="30" y="224" width="143" height="72" fill="#f3f6fa"/>
    <g fill="#556477" font-size="11"><text x="31" y="244">Evidence ledger</text><text x="31" y="264">Runnable variants</text><text x="31" y="284">Conditional recipes</text></g>
    <text x="30" y="568" font-size="11" fill="#788595">New target → fresh qualification.</text>
  </g>
</svg>
